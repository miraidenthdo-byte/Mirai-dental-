        <span><strong>緊急時の対応はこちら</strong><span>気分不良・針刺し事故などの手順</span></span>
        ${svg('chev', 'chev')}
      </a>

      <section>
        <div class="section-head"><h2>あなたの進み具合</h2>${me ? '<a href="#mine">くわしく見る</a>' : ''}</div>
        ${me ? `<a class="mine-card" href="#mine">
            <span class="mine-top">${avatarHTML(me)}<span><b>${esc(me.name)}</b><br><span class="muted" style="font-size:.8rem">${esc(me.role || '')}</span></span><span class="rate">${sum.rate}%</span></span>
            ${stackHTML(sum, sum.total)}
            <span class="row-stats"><span>完了 ${sum.done}/${sum.total}</span><span>途中 ${sum.doing}</span>${sum.review ? `<span style="color:var(--warn-ink);font-weight:700">要再確認 ${sum.review}</span>` : ''}<span>未着手 ${sum.none}</span></span>
          </a>`
          : `<div class="empty">${svg('shield')}<div>管理者としてログインしています。進み具合は記録されません</div><a class="btn primary" href="#admin" style="margin-top:10px">管理者ページへ</a></div>`}
      </section>

      <section>
        <div class="section-head"><h2>カテゴリから探す</h2></div>
        <div class="cat-grid">
          ${CATEGORIES.map(c => `
            <a class="cat" href="#cat-${c.id}" style="${catStyle(c.id)}">
              <span class="cat-icon">${svg(c.id)}</span>
              <span><span class="cat-name">${esc(c.name)}</span><br><span class="cat-count">${state.manuals.filter(m => m.cat === c.id).length}件</span></span>
            </a>`).join('')}
        </div>
      </section>

      <section>
        <div class="section-head"><h2>お気に入り</h2>${favs.length ? '<a href="#fav">すべて見る</a>' : ''}</div>
        ${favs.length ? `<div class="list">${favs.slice(0, 3).map(m => itemHTML(m)).join('')}</div>`
          : emptyHTML('heart', 'よく使うマニュアルの「お気に入り」を押すと、ここに表示されます')}
      </section>

      ${recent.length ? `<section>
        <div class="section-head"><h2>最近見たマニュアル</h2></div>
        <div class="list">${recent.map(m => itemHTML(m)).join('')}</div>
      </section>` : ''}

      <section>
        <div class="section-head"><h2>最近更新されたマニュアル</h2><a href="#all">一覧へ</a></div>
        <div class="list">${latest.map(m => itemHTML(m)).join('')}</div>
      </section>
    `;
  }

  /* ================= 画面: 一覧 / カテゴリ ================= */
  let listFilter = 'all';
  function renderList(catId) {
    listFilter = catId || 'all';
    const items = state.manuals.filter(m => listFilter === 'all' || m.cat === listFilter);
    const c = listFilter !== 'all' ? catById(listFilter) : null;
    view.innerHTML = `
      <section>
        <div class="section-head"><h2>${c ? esc(c.name) : 'すべてのマニュアル'}</h2><span class="muted" style="font-size:.85rem">${items.length}件</span></div>
        ${c ? `<p class="muted" style="margin:-6px 0 14px;font-size:.9rem">${esc(c.desc)}</p>` : ''}
        <div class="chips" role="group" aria-label="カテゴリで絞り込む">
          <button class="chip" data-filter="all" aria-pressed="${listFilter === 'all'}">すべて</button>
          ${CATEGORIES.map(x => `<button class="chip" data-filter="${x.id}" aria-pressed="${listFilter === x.id}">${esc(x.name)}</button>`).join('')}
        </div>
      </section>
      <div class="list">
        ${items.length ? items.map(m => itemHTML(m)).join('') : emptyHTML('plus', 'このカテゴリにはまだマニュアルがありません。<br>下の「追加」から作成できます')}
      </div>
    `;
    view.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
      const f = b.dataset.filter;
      history.replaceState(null, '', f === 'all' ? '#all' : `#cat-${f}`);
      renderList(f === 'all' ? null : f);
      setTab();
    }));
  }

  /* ================= 画面: お気に入り ================= */
  function renderFav() {
    const favs = state.favs.map(getManual).filter(Boolean);
    view.innerHTML = `
      <section>
        <div class="section-head"><h2>お気に入り</h2><span class="muted" style="font-size:.85rem">${favs.length}件</span></div>
        ${favs.length ? `<div class="list">${favs.map(m => itemHTML(m)).join('')}</div>`
          : emptyHTML('heart', 'まだお気に入りがありません。<br>マニュアルを開いて「お気に入り」を押してください')}
      </section>`;
  }

  /* ================= 画面: 検索 ================= */
  function renderSearch(q) {
    const ql = q.toLowerCase();
    const hits = state.manuals.filter(m => {
      const hay = [m.title, m.summary, catById(m.cat).name, ...(m.tags || []), ...m.steps.map(s => s.t + ' ' + (s.tip || '') + ' ' + (s.warn || ''))].join(' ').toLowerCase();
      return hay.includes(ql);
    });
    view.innerHTML = `
      <section>
        <div class="section-head"><h2>「${esc(q)}」の検索結果</h2><span class="muted" style="font-size:.85rem">${hits.length}件</span></div>
        ${hits.length ? `<div class="list">${hits.map(m => itemHTML(m, q)).join('')}</div>`
          : emptyHTML('search', '見つかりませんでした。<br>別のことば（例：「予約」「消毒」）で試してみてください')}
      </section>`;
  }

  /* ================= 画面: マニュアル詳細 ================= */
  function renderDetail(id) {
    const m = getManual(id);
    if (!m) { view.innerHTML = emptyHTML('search', 'マニュアルが見つかりませんでした。<br><a href="#home">ホームへ戻る</a>'); return; }
    if (editing && editing.id === id) return renderEditor();
    state.recent = [id, ...state.recent.filter(x => x !== id)].slice(0, 8);
    savePersonal();
    const c = catById(m.cat);
    const isFav = state.favs.includes(id);
    const st = state.me ? statusOf(state.me, m) : 'none';
    const rec = recOf(state.me, id);

    view.innerHTML = `
      <div style="${catStyle(c.id)};display:flex;flex-direction:column;gap:18px">
        <div><a class="back" href="#cat-${c.id}">${svg('back')}${esc(c.name)}へ戻る</a></div>
        <header class="detail-head">
          <span class="tag">${svg(c.id)}${esc(c.name)}</span>
          <h1>${esc(m.title)}</h1>
          ${m.summary ? `<p class="summary">${esc(m.summary)}</p>` : ''}
          <div class="meta-row">
            <span>${svg('clock')}所要時間 約${esc(m.minutes || 5)}分</span>
            <span>${svg('cal')}${fmtDate(m.updated)} 更新</span>
            ${m.author ? `<span>${svg('user')}${esc(m.author)}</span>` : ''}
          </div>
          ${(m.tags || []).length ? `<div class="keywords">${m.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
        </header>
        ${st === 'review' ? `<div class="review-banner">${svg('alert')}<span><b>内容が改訂されました。</b>前回の完了（${fmtShort(rec.completedAt)}）のあとに内容が変わっています。もう一度、最後まで確認してください。</span></div>` : ''}
        <div class="actions">
          <button class="btn ${isFav ? 'faved' : ''}" id="favBtn" aria-pressed="${isFav}">${svg('heart')}${isFav ? 'お気に入り済み' : 'お気に入り'}</button>
          <button class="btn" id="resetBtn">${svg('reset')}チェックをリセット</button>
          <button class="btn lock" id="lockBtn">${svg('lock')}ロックを解除して編集</button>
        </div>
        <div class="progress" id="progress">
          <div class="progress-bar"><i id="progressFill"></i></div>
          <span class="progress-label" id="progressLabel"></span>
        </div>
        <ol class="steps">
          ${m.steps.map((s, i) => `
            <li class="step" data-i="${i}">
              <button class="step-check" aria-label="ステップ${i + 1}を完了にする" aria-pressed="false"><span>${i + 1}</span>${svg('check')}</button>
              <div class="step-body">
                <p class="step-text">${esc(s.t)}</p>
                ${s.tip ? `<div class="note tip">${svg('bulb')}<b>ポイント</b><span>${esc(s.tip)}</span></div>` : ''}
                ${s.warn ? `<div class="note warn">${svg('alert')}<b>注意</b><span>${esc(s.warn)}</span></div>` : ''}
              </div>
            </li>`).join('')}
        </ol>
        <div class="complete" id="complete" hidden><strong>すべて完了しました</strong><span class="muted" id="completeNote">おつかれさまでした。完了は管理者ページに記録されます。</span></div>
        ${rec && rec.completedAt && st === 'done' ? `<p class="muted" style="margin:0;font-size:.84rem;text-align:center">${esc(getStaff(state.me).name)}さん：${fmtShort(rec.completedAt)}に完了${rec.count > 1 ? `（${rec.count}回目）` : ''}</p>` : ''}
      </div>`;

    const updateProgress = () => {
      const r = recOf(state.me, id);
      const set = new Set(r ? r.done : []);
      view.querySelectorAll('.step').forEach(li => {
        const on = set.has(+li.dataset.i);
        li.classList.toggle('done', on);
        li.querySelector('.step-check').setAttribute('aria-pressed', on);
      });
      const n = doneOf(state.me, m), total = m.steps.length;
      $('#progressFill').style.width = (total ? n / total * 100 : 0) + '%';
      $('#progressLabel').textContent = state.me ? `${n} / ${total} 完了` : '管理者としてログイン中（記録されません）';
      $('#progress').classList.toggle('done', total > 0 && n === total);
      $('#complete').hidden = !(total > 0 && n === total);
    };
    updateProgress();

    view.querySelectorAll('.step-check').forEach(b => b.addEventListener('click', () => {
      if (needMe()) return;
      const i = +b.closest('.step').dataset.i;
      const prev = recOf(state.me, id) || { done: [], completedAt: '', count: 0 };
      const set = new Set(prev.done);
      set.has(i) ? set.delete(i) : set.add(i);
      const rec2 = { ...prev, done: [...set].sort((a, z) => a - z), updatedAt: nowISO() };
      const finished = m.steps.every((_, k) => set.has(k));
      if (finished) { rec2.completedAt = rec2.updatedAt; rec2.count = (prev.count || 0) + 1; }
      (state.progress[state.me] = state.progress[state.me] || {})[id] = rec2;
      updateProgress();
      send('saveProgress', tok(), id, rec2);
      if (finished) toast('すべてのステップが完了しました。記録しました');
    }));
    $('#favBtn').addEventListener('click', () => {
      const on = state.favs.includes(id);
      state.favs = on ? state.favs.filter(x => x !== id) : [id, ...state.favs];
      savePersonal();
      toast(on ? 'お気に入りから外しました' : 'お気に入りに追加しました');
      renderDetail(id);
    });
    $('#resetBtn').addEventListener('click', () => {
      const prev = recOf(state.me, id);
      if (!prev || !prev.done.length) return toast('リセットするチェックはありません');
      // 完了の記録は残したまま、チェックだけ外す（毎日のチェックリストとして使えるように）
      const rec2 = { ...prev, done: [], updatedAt: nowISO() };
      state.progress[state.me][id] = rec2;
      updateProgress();
      send('saveProgress', tok(), id, rec2);
      toast('チェックをリセットしました');
    });
    $('#lockBtn').addEventListener('click', () => askUnlock(id));
  }

  /* ================= 画面: 自分の進み具合 ================= */
  function renderPerson(sid, asAdmin) {
    const s = getStaff(sid);
    if (!s) { view.innerHTML = emptyHTML('users', asAdmin ? 'スタッフが見つかりません' : '管理者としてログイン中は、進み具合は記録されません'); return; }
    const sum = staffSummary(sid);
    const order = { review: 0, doing: 1, none: 2, done: 3 };
    view.innerHTML = `
      <div><a class="back" href="${asAdmin ? '#admin' : '#home'}">${svg('back')}${asAdmin ? 'スタッフ一覧へ戻る' : 'ホームへ戻る'}</a></div>
      <header class="person-head">${avatarHTML(s, 'lg')}<div><h1>${esc(s.name)}${asAdmin ? '' : 'さんの進み具合'}</h1><span class="muted" style="font-size:.86rem">${s.active === false ? `<span class="st st-review">退職 ${fmtShort(s.retiredAt)}</span> ` : ''}${esc(s.role || '')}${sum.last ? `・最終記録 ${fmtShort(sum.last)}` : ''}</span></div></header>
      <div class="tiles">
        <div class="tile good"><span class="tile-label">完了率</span><span class="tile-value">${sum.rate}<small>%</small></span></div>
        <div class="tile"><span class="tile-label">完了</span><span class="tile-value">${sum.done}<small>/ ${sum.total}</small></span></div>
        <div class="tile ${sum.review ? 'warn' : ''}"><span class="tile-label">要再確認</span><span class="tile-value">${sum.review}<small>件</small></span></div>
        <div class="tile"><span class="tile-label">途中・未着手</span><span class="tile-value">${sum.doing + sum.none}<small>件</small></span></div>
      </div>
      ${CATEGORIES.map(c => {
        const ms = state.manuals.filter(m => m.cat === c.id).sort((a, b) => order[statusOf(sid, a)] - order[statusOf(sid, b)]);
        if (!ms.length) return '';
        return `<section style="${catStyle(c.id)}">
          <div class="group-title">${svg(c.id)}${esc(c.name)}</div>
          <div class="list">${ms.map(m => {
            const st = statusOf(sid, m), r = recOf(sid, m.id);
            const note = st === 'done' ? `${fmtShort(r.completedAt)} 完了` : st === 'review' ? `${fmtShort(r.completedAt)} 完了後に改訂` : st === 'doing' ? `${doneOf(sid, m)} / ${m.steps.length} ステップ` : '';
            return `<a class="item" href="${asAdmin ? '#admin-m-' + esc(m.id) : '#m-' + esc(m.id)}">
              <span class="item-icon">${svg(c.id)}</span>
              <span class="item-body"><span class="item-title">${esc(m.title)}</span><span class="row-stats">${stPill(st)}<span>${note}</span></span></span>
              ${svg('chev', 'chev')}
            </a>`;
          }).join('')}</div>
        </section>`;
      }).join('')}`;
  }

  /* ================= その場編集（ロック付き） ================= */
  // editing: ロックを解除して編集中のマニュアル。null のときはロック中
  let editing = null;
  const editHash = () => editing.isNew ? '#new' : '#m-' + editing.id;
  const isDirty = () => !!editing && JSON.stringify(editing.draft) !== editing.snapshot;

  function toDraft(m) {
    return {
      id: m.id, cat: m.cat, title: m.title, summary: m.summary || '', minutes: m.minutes || 5,
      author: m.author || '', tagsText: (m.tags || []).join(', '), updated: m.updated, requireReview: false,
      steps: m.steps.map((s, i) => ({ o: i, t: s.t, kind: s.warn ? 'warn' : s.tip ? 'tip' : 'none', note: s.warn || s.tip || '' }))
    };
  }

  function beginEdit(m, isNew) {
    editing = { id: m.id, isNew, draft: toDraft(m) };
    editing.snapshot = JSON.stringify(editing.draft);
  }

  function newManual() {
    beginEdit({
      id: 'u' + Date.now().toString(36), cat: listFilter !== 'all' ? listFilter : 'reception', title: '', summary: '', minutes: 5,
      author: '', tags: [], updated: today(), steps: [{ t: '' }, { t: '' }, { t: '' }]
    }, true);
    editing.snapshot = JSON.stringify(editing.draft);
  }

  // ロック解除：暗証番号があれば入力、なければ確認だけ
  function askUnlock(id) {
    const unlock = () => {
      beginEdit(getManual(id), false);
      closeSheet();
      renderDetail(id);
      syncChrome();
      toast('ロックを解除しました');
    };
    if (state.hasEditPin && state.role !== 'admin') {
      openSheet(`
        <div class="sheet-head"><h2>暗証番号を入力</h2><button class="icon-btn" data-close aria-label="閉じる">${svg('x')}</button></div>
        <p style="margin:0" class="muted">編集ロックを解除するには、4桁の暗証番号を入力してください。</p>
        <label for="pinIn" class="sr-only">暗証番号</label>
        <input id="pinIn" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
        <p class="err" id="pinErr"></p>
        <div class="actions" style="justify-content:flex-end">
          <button class="btn" data-close>やめる</button>
          <button class="btn primary" id="pinOk">${svg('unlock')}解除する</button>
        </div>`);
      const input = $('#pinIn');
      let busy = false;
      const tryPin = () => {
        if (busy) return;
        busy = true;
        const pin = input.value;
        callApi('verifyPin', tok(), 'edit', pin).then(ok => {
          busy = false;
          if (ok) { session.editPin = pin; unlock(); }
          else { $('#pinErr').textContent = '暗証番号がちがいます'; input.value = ''; input.focus(); }
        }, e => { busy = false; apiError(e); });
      };
      $('#pinOk').addEventListener('click', tryPin);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') tryPin(); });
      input.addEventListener('input', () => { if (input.value.length === 4) tryPin(); });
    } else {
      openSheet(`
        <div class="sheet-head"><h2>ロックを解除しますか？</h2></div>
        <p style="margin:0">解除すると、この画面でそのまま内容を書き換えられます。「保存してロック」を押すと、自動でロックに戻ります。</p>
        <p style="margin:0;font-size:.82rem" class="muted">管理者ページで暗証番号を決めておくと、解除のときに入力が必要になります。</p>
        <div class="actions" style="justify-content:flex-end">
          <button class="btn" data-close>やめる</button>
          <button class="btn primary" id="unlockOk">${svg('unlock')}解除して編集する</button>
        </div>`);
      $('#unlockOk').addEventListener('click', unlock);
    }
  }

  // 保存：成功したら保存したマニュアルを返し、ロックに戻す
  function saveEdit() {
    const d = editing.draft;
    if (!d.title.trim()) { toast('タイトルを入力してください'); const t = $('#ed-title'); if (t) t.focus(); return null; }
    const kept = d.steps.filter(s => s.t.trim());
    if (!kept.length) { toast('手順を1つ以上入力してください'); const t = $('#ed-st-0'); if (t) t.focus(); return null; }
    const m = {
      id: d.id, cat: d.cat, title: d.title.trim(), summary: d.summary.trim(),
      minutes: Math.max(1, Math.min(240, parseInt(d.minutes, 10) || 5)),
      author: d.author.trim(),
      tags: d.tagsText.split(/[,、，]/).map(t => t.trim().replace(/^#/, '')).filter(Boolean),
      updated: today(),
      reviewFrom: d.requireReview ? nowISO() : ((getManual(d.id) || {}).reviewFrom || ''),
      steps: kept.map(s => {
        const o = { t: s.t.trim() };
        const n = s.note.trim();
        if (s.kind === 'tip' && n) o.tip = n;
        if (s.kind === 'warn' && n) o.warn = n;
        return o;
      })
    };
    if (!m.reviewFrom) delete m.reviewFrom;
    // 並べ替え・削除に合わせて、スタッフ全員のチェック済みの印も付け替える
    const updates = {};
    if (!editing.isNew) {
      Object.keys(state.progress).forEach(sid => {
        const r = state.progress[sid][m.id];
        if (!r || !(r.done || []).length) return;
        const old = new Set(r.done);
        const moved = kept.map((s, i) => (s.o !== undefined && old.has(s.o)) ? i : -1).filter(i => i >= 0);
        if (moved.join() === r.done.join()) return;
        updates[sid] = state.progress[sid][m.id] = { ...r, done: moved };
      });
    }
    if (editing.isNew) state.manuals.unshift(m);
    else state.manuals = state.manuals.map(x => x.id === m.id ? m : x);
    send('saveManual', tok(), m, editing.isNew ? null : kept.map(s => s.o === undefined ? -1 : s.o), session.editPin);
    editing = null;
    return m;
  }

  function finishSave() {
    const m = saveEdit();
    if (!m) return;
    toast('保存してロックしました');
    if (location.hash !== '#m-' + m.id) location.hash = '#m-' + m.id;
    else { renderDetail(m.id); syncChrome(); }
  }

  function cancelEdit() {
    const leave = () => {
      const wasNew = editing.isNew, id = editing.id;
      editing = null;
      closeSheet();
      if (wasNew) location.hash = '#home';
      else { renderDetail(id); syncChrome(); toast('ロックしました'); }
    };
    if (!isDirty()) return leave();
    openSheet(`
      <div class="sheet-head"><h2>変更を取り消しますか？</h2></div>
      <p style="margin:0">書き換えた内容は保存されず、元に戻ります。</p>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn" data-close>編集を続ける</button>
        <button class="btn danger" id="discardOk">取り消してロック</button>
      </div>`);
    $('#discardOk').addEventListener('click', leave);
  }

  // 保存していない変更があるまま、ほかの画面へ移ろうとしたとき
  function confirmLeave(target) {
    openSheet(`
      <div class="sheet-head"><h2>保存していない変更があります</h2></div>
      <p style="margin:0">このまま移動すると、書き換えた内容は消えてしまいます。</p>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn" data-close>編集を続ける</button>
        <button class="btn danger" id="leaveDiscard">保存せずに移動</button>
        <button class="btn primary" id="leaveSave">${svg('lock')}保存して移動</button>
      </div>`);
    $('#leaveDiscard').addEventListener('click', () => { editing = null; closeSheet(); location.hash = target; });
    $('#leaveSave').addEventListener('click', () => {
      closeSheet();
      if (saveEdit()) { toast('保存してロックしました'); location.hash = target; }
    });
  }

  document.addEventListener('click', e => {
    if (!editing) return;
    const a = e.target.closest('a[href^="#"]');
    if (!a) return;
    const target = a.getAttribute('href');
    if (target === editHash()) { e.preventDefault(); return; }
    if (!isDirty()) { editing = null; return; }
    e.preventDefault();
    confirmLeave(target);
  }, true);
  window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

  const autosize = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };

  function renderEditor() {
    const d = editing.draft;
    const c = catById(d.cat);
    const last = d.steps.length - 1;
    view.innerHTML = `
      <div class="editor" style="${catStyle(c.id)};display:flex;flex-direction:column;gap:18px">
        <div class="editbar" role="region" aria-label="編集中">
          <span class="editbar-state">${svg('unlock')}<span><b>編集中</b><small>${editing.isNew ? '新しいマニュアル' : 'ロックを解除しています'}</small></span></span>
          <span class="editbar-actions">
            <button type="button" class="btn sm" data-ed="cancel">取り消す</button>
            <button type="button" class="btn sm primary" data-ed="save">${svg('lock')}保存してロック</button>
          </span>
        </div>
        <header class="detail-head">
          <div class="ed-row">
            <label class="ed-inline"><span>カテゴリ</span>
              <select id="ed-cat" data-k="cat">${CATEGORIES.map(x => `<option value="${x.id}" ${d.cat === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
            </label>
            <label class="ed-inline"><span>所要時間 約</span>
              <input id="ed-min" type="number" min="1" max="240" inputmode="numeric" data-k="minutes" value="${esc(d.minutes)}"><span>分</span>
            </label>
          </div>
          <label for="ed-title" class="sr-only">タイトル</label>
          <textarea id="ed-title" class="ed ed-title" data-k="title" rows="1" maxlength="60" placeholder="タイトル（例：レントゲン撮影の準備）">${esc(d.title)}</textarea>
          <label for="ed-sum" class="sr-only">概要</label>
          <textarea id="ed-sum" class="ed ed-sum" data-k="summary" rows="1" placeholder="どんなときに使うマニュアルか、ひとことで">${esc(d.summary)}</textarea>
          <div class="ed-row">
            <label class="ed-inline grow"><span>担当</span><input id="ed-author" type="text" data-k="author" placeholder="例：衛生士チーム" value="${esc(d.author)}"></label>
            <label class="ed-inline grow"><span>キーワード</span><input id="ed-tags" type="text" data-k="tagsText" placeholder="カンマ区切り（例：電話, 予約）" value="${esc(d.tagsText)}"></label>
          </div>
        </header>
        <ol class="steps">
          ${d.steps.map((s, i) => `
            <li class="step editing" data-i="${i}">
              <span class="step-num">${i + 1}</span>
              <div class="step-body">
                <textarea id="ed-st-${i}" class="ed" data-f="t" rows="1" placeholder="やることを1つ、短く書きます" aria-label="ステップ${i + 1}の内容">${esc(s.t)}</textarea>
                ${s.kind !== 'none' ? `
                  <div class="note ${s.kind} ed-note">${svg(s.kind === 'tip' ? 'bulb' : 'alert')}
                    <div class="ed-note-body">
                      <select id="ed-kind-${i}" data-f="kind" aria-label="補足の種類">
                        <option value="tip" ${s.kind === 'tip' ? 'selected' : ''}>ポイント</option>
                        <option value="warn" ${s.kind === 'warn' ? 'selected' : ''}>注意</option>
                        <option value="none">補足を外す</option>
                      </select>
                      <textarea id="ed-note-${i}" class="ed" data-f="note" rows="1" placeholder="${s.kind === 'tip' ? 'コツや覚えておくと良いこと' : '気をつけること'}" aria-label="補足の内容">${esc(s.note)}</textarea>
                    </div>
                  </div>` : `
                  <div class="ed-add-note">
                    <button type="button" class="btn sm" data-act="tip">${svg('bulb')}ポイントを追加</button>
                    <button type="button" class="btn sm" data-act="warn">${svg('alert')}注意を追加</button>
                  </div>`}
                <div class="step-tools">
                  <button type="button" class="icon-btn" data-act="up" aria-label="ステップ${i + 1}を上へ" ${i === 0 ? 'disabled' : ''}>${svg('up')}</button>
                  <button type="button" class="icon-btn" data-act="down" aria-label="ステップ${i + 1}を下へ" ${i === last ? 'disabled' : ''}>${svg('down')}</button>
                  <button type="button" class="icon-btn" data-act="del" aria-label="ステップ${i + 1}を削除">${svg('trash')}</button>
                </div>
              </div>
            </li>`).join('')}
        </ol>
        ${editing.isNew ? '' : `<label class="review-banner" style="cursor:pointer">
          <input type="checkbox" data-k="requireReview" ${d.requireReview ? 'checked' : ''} style="width:20px;height:20px;min-height:0;margin-top:2px;flex:none">
          <span><b>スタッフ全員に再確認してもらう</b><br><span class="muted" style="font-size:.82rem">内容が大きく変わったときにチェックします。完了済みのスタッフは「要再確認」になります。</span></span>
        </label>`}
        <div class="editor-foot">
          <button type="button" class="btn" data-ed="add">${svg('plus')}ステップを追加</button>
          ${editing.isNew ? '' : `<button type="button" class="btn danger" data-ed="delete">${svg('trash')}このマニュアルを削除</button>`}
        </div>
      </div>`;

    const root = $('.editor', view);
    root.querySelectorAll('textarea.ed').forEach(autosize);
    const redraw = focusId => {
      const y = window.scrollY;
      renderEditor();
      window.scrollTo(0, y);
      if (focusId) { const el = $('#' + focusId); if (el) el.focus(); }
    };

    root.addEventListener('input', e => {
      const el = e.target;
      if (el.tagName === 'TEXTAREA') autosize(el);
      if (el.dataset.k && el.type === 'checkbox') d[el.dataset.k] = el.checked;
      else if (el.dataset.k && el.tagName !== 'SELECT') d[el.dataset.k] = el.value;
      const li = el.closest('.step');
      if (li && el.dataset.f && el.dataset.f !== 'kind') d.steps[+li.dataset.i][el.dataset.f] = el.value;
    });
    root.addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.k === 'cat') { d.cat = el.value; redraw(); }
      if (el.dataset.f === 'kind') {
        const i = +el.closest('.step').dataset.i;
        d.steps[i].kind = el.value;
        if (el.value === 'none') d.steps[i].note = '';
        redraw();
      }
    });
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-act], [data-ed]');
      if (!b || b.disabled) return;
      const ed = b.dataset.ed;
      if (ed === 'save') return finishSave();
      if (ed === 'cancel') return cancelEdit();
      if (ed === 'add') { d.steps.push({ t: '', kind: 'none', note: '' }); return redraw('ed-st-' + (d.steps.length - 1)); }
      if (ed === 'delete') return askDelete();
      const i = +b.closest('.step').dataset.i;
      const act = b.dataset.act;
      if (act === 'tip' || act === 'warn') { d.steps[i].kind = act; return redraw('ed-note-' + i); }
      if (act === 'up' && i > 0) [d.steps[i - 1], d.steps[i]] = [d.steps[i], d.steps[i - 1]];
      if (act === 'down' && i < last) [d.steps[i + 1], d.steps[i]] = [d.steps[i], d.steps[i + 1]];
      if (act === 'del') { d.steps.splice(i, 1); if (!d.steps.length) d.steps.push({ t: '', kind: 'none', note: '' }); }
      redraw();
    });
  }

  function askDelete() {
    const m = getManual(editing.id);
    openSheet(`
      <div class="sheet-head"><h2>このマニュアルを削除しますか？</h2></div>
      <p style="margin:0">「${esc(m.title)}」を削除します。この操作は取り消せません。</p>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn" data-close>やめる</button>
        <button class="btn danger" id="confirmDel">${svg('trash')}削除する</button>
      </div>`);
    $('#confirmDel').addEventListener('click', () => {
      state.manuals = state.manuals.filter(x => x.id !== m.id);
      state.favs = state.favs.filter(x => x !== m.id);
      state.recent = state.recent.filter(x => x !== m.id);
      Object.values(state.progress).forEach(p => { delete p[m.id]; });
      savePersonal();
      send('deleteManual', tok(), m.id, session.editPin);
      editing = null;
      closeSheet();
      toast('削除しました');
      location.hash = '#cat-' + m.cat;
    });
  }

  /* ================= シート（設定・確認） ================= */
  const overlay = $('#overlay');
  function openSheet(html) {
    overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    overlay.hidden = false;
    const f = overlay.querySelector('input, textarea, button:not([data-close])') || overlay.querySelector('button');
    if (f) f.focus();
  }
  function closeSheet() { overlay.hidden = true; overlay.innerHTML = ''; }
  overlay.addEventListener('click', e => { if (e.target === overlay || e.target.closest('[data-close]')) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeSheet(); });

  // 押し間違いを防ぐため、2回押して実行するボタン
  function armed(btn, label, fn) {
    btn.addEventListener('click', () => {
      if (btn.dataset.armed) return fn();
      btn.dataset.armed = '1';
      btn.innerHTML = `${svg('alert')}${label}`;
    });
  }

  function openSettings() {
    const me = state.meInfo;
    openSheet(`
      <div class="sheet-head"><h2>設定</h2><button class="icon-btn" data-close aria-label="閉じる">${svg('x')}</button></div>
      <div class="setting">
        <span class="setting-title">ログイン中</span>
        <div style="display:flex;align-items:center;gap:10px">${me ? avatarHTML(me) : `<span class="avatar">${svg('shield')}</span>`}<span style="flex:1">${me ? esc(me.name) : '管理者'}</span><button class="btn sm" id="setLogout">${svg('lock')}ログアウト</button></div>
      </div>
      <div class="setting">
        <span class="setting-title">文字の大きさ</span>
        <div class="seg" role="group" aria-label="文字の大きさ">
          <button data-size="normal" aria-pressed="${!state.largeText}">ふつう</button>
          <button data-size="large" aria-pressed="${state.largeText}">大きめ</button>
        </div>
      </div>
      <div class="setting">
        <span class="setting-title">管理者ページ</span>
        <span class="muted" style="font-size:.84rem">スタッフの進み具合の確認、スタッフの登録・退職の手続き、暗証番号やデータの管理ができます。</span>
        <a class="btn sm" href="#admin" data-close style="align-self:flex-start">${svg('shield')}管理者ページを開く</a>
      </div>
      <div class="setting">
        <span class="setting-title">データの保存先</span>
        <span class="muted" style="font-size:.84rem">${REMOTE
          ? 'Googleスプレッドシートに保存され、スタッフ全員で共有されています。'
          : '体験モードです。この端末の中だけで動いていて、サンプルのスタッフと進み具合が入っています。スタッフ全員で使うには、Googleスプレッドシート版を設置してください（手順は README にあります）。'}</span>
      </div>`);
    $('#setLogout').addEventListener('click', logoutNow);
    overlay.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
      state.largeText = b.dataset.size === 'large';
      document.documentElement.classList.toggle('large-text', state.largeText);
      savePersonal();
      overlay.querySelectorAll('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b));
    }));
  }
  $('#openSettings').addEventListener('click', openSettings);

  /* ================= 管理者ページ ================= */
  const demoNote = () => REMOTE ? '' : `<div class="demo-note">${svg('info')}<span>体験モードのため、サンプルのスタッフと進み具合を表示しています。スプレッドシート版では、登録したスタッフの実際の記録が表示されます。</span></div>`;

  function renderGate(next) {
    const setup = !state.hasAdminPin;
    view.innerHTML = `
      <div class="gate">
        <span class="gate-icon">${svg('shield')}</span>
        <h1 style="font-size:1.3rem">管理者ページ</h1>
        <p class="muted" style="margin:0">${setup
          ? 'はじめに、管理者用の4桁の暗証番号を決めてください。次回からは、この暗証番号で開きます。'
          : '管理者用の暗証番号を入力してください。'}</p>
        <label for="gatePin" class="sr-only">暗証番号</label>
        <input id="gatePin" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="${setup ? '新しい暗証番号' : ''}">
        ${setup ? `<label for="gatePin2" class="sr-only">確認のためもう一度</label>
        <input id="gatePin2" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="もう一度">` : ''}
        <p class="err" id="gateErr"></p>
        <button class="btn primary" id="gateOk">${svg('unlock')}${setup ? '設定して開く' : '開く'}</button>
        <a class="back" href="#home" style="align-self:center">${svg('back')}ホームへ戻る</a>
      </div>`;
    const pin = $('#gatePin'), err = $('#gateErr');
    pin.focus();
    let busy = false;
    const go = () => {
      if (busy) return;
      const v = pin.value;
      if (!/^\d{4}$/.test(v)) { err.textContent = '4桁の数字を入力してください'; return; }
      if (setup && v !== $('#gatePin2').value) { err.textContent = '2回の入力が一致しません'; return; }
      busy = true;
      callApi(setup ? 'adminSetup' : 'adminLogin', v, deviceLabel()).then(r => {
        busy = false;
        if (setup) { state.hasAdminPin = true; toast('管理者の暗証番号を設定しました'); }
        session.adminToken = r.token;
        saveAdminToken();
        next();
      }, e => {
        busy = false;
        err.textContent = errText(e).includes('LIMIT') ? '失敗が続いたため、しばらく開けません。10分ほど待ってください' : '暗証番号がちがいます';
        pin.value = '';
        pin.focus();
      });
    };
    $('#gateOk').addEventListener('click', go);
    view.querySelectorAll('.pin-input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  }

  function adminHead(active) {
    const tab = (h, label) => `<a href="${h}" ${active === h ? 'aria-current="page"' : ''}>${label}</a>`;
    return `
      <div class="admin-head">
        <h1>${svg('shield')}管理者ページ</h1>
        <div class="actions">
          <button class="btn sm" id="adminReload">${svg('refresh')}最新にする</button>
          <button class="btn sm" id="adminExit">${svg('lock')}管理者ページを閉じる</button>
        </div>
      </div>
      ${demoNote()}
      <nav class="seg-nav" aria-label="管理メニュー">${tab('#admin', 'スタッフ別')}${tab('#admin-manuals', 'マニュアル別')}${tab('#admin-team', 'スタッフ管理')}</nav>`;
  }
  function bindAdminHead() {
    $('#adminExit').addEventListener('click', () => {
      callApi('logout', session.adminToken).catch(() => { /* 期限切れでも続行 */ });
      session.adminToken = '';
      saveAdminToken();
      if (!state.token) return lockOut('');
      toast('管理者ページを閉じました');
      loadShared().then(() => { location.hash = '#home'; route(); }, apiError);
    });
    $('#adminReload').addEventListener('click', () => {
      loadShared().then(loadAdmin).then(() => { route(true); toast('最新の記録を読み込みました'); }, apiError);
    });
  }

  function renderAdminStaff() {
    const active = activeStaff();
    const total = active.length * state.manuals.length;
    const sums = active.map(s => ({ s, sum: staffSummary(s.id) }));
    const done = sums.reduce((a, x) => a + x.sum.done, 0);
    const review = sums.reduce((a, x) => a + x.sum.review, 0);
    const weekAgo = new Date(Date.now() - 7 * 864e5).toISOString();
    let week = 0;
    active.forEach(s => Object.keys(state.progress[s.id] || {}).forEach(mid => { if (getManual(mid) && state.progress[s.id][mid].completedAt > weekAgo) week++; }));
    sums.sort((a, b) => a.sum.rate - b.sum.rate || b.sum.review - a.sum.review);
    const retired = state.staff.length - active.length;

    view.innerHTML = `
      ${adminHead('#admin')}
      <div class="tiles">
        <div class="tile"><span class="tile-label">スタッフ${retired ? `（退職 ${retired}人は除く）` : ''}</span><span class="tile-value">${active.length}<small>人</small></span></div>
        <div class="tile good"><span class="tile-label">全体の完了率</span><span class="tile-value">${total ? Math.round(done / total * 100) : 0}<small>%</small></span></div>
        <div class="tile ${review ? 'warn' : ''}"><span class="tile-label">要再確認</span><span class="tile-value">${review}<small>件</small></span></div>
        <div class="tile"><span class="tile-label">この7日間の完了</span><span class="tile-value">${week}<small>件</small></span></div>
      </div>
      <section>
        <div class="section-head"><h2>スタッフ別の進み具合</h2><span class="muted" style="font-size:.8rem">完了率の低い順</span></div>
        <div style="margin-bottom:10px">${legendHTML()}</div>
        ${sums.length ? `<div class="list">${sums.map(({ s, sum }) => `
          <a class="item" href="#admin-s-${esc(s.id)}">
            ${avatarHTML(s)}
            <span class="item-body">
              <span class="item-title">${esc(s.name)} <span class="muted" style="font-weight:400;font-size:.8rem">${esc(s.role || '')}</span></span>
              ${stackHTML(sum, sum.total)}
              <span class="row-stats"><span>完了 ${sum.done}/${sum.total}</span><span>途中 ${sum.doing}</span>${sum.review ? `<span style="color:var(--warn-ink);font-weight:700">要再確認 ${sum.review}</span>` : ''}<span>未着手 ${sum.none}</span></span>
            </span>
            <span class="item-side"><span class="rate">${sum.rate}%</span><span>${sum.last ? '最終 ' + fmtShort(sum.last) : '記録なし'}</span></span>
          </a>`).join('')}</div>`
          : `${emptyHTML('users', 'スタッフがまだ登録されていません')}<a class="btn" href="#admin-team" style="margin-top:10px">${svg('plus')}スタッフを登録する</a>`}
      </section>`;
    bindAdminHead();
  }

  function renderAdminManuals() {
    const rows = state.manuals.map(m => ({ m, sum: manualSummary(m) }));
    rows.sort((a, b) => (a.sum.done / (a.sum.total || 1)) - (b.sum.done / (b.sum.total || 1)));

        <div style="margin-bottom:10px">${legendHTML()}</div>
        <div class="list">${rows.map(({ m, sum }) => {
          const c = catById(m.cat);
          return `<a class="item" href="#admin-m-${esc(m.id)}" style="${catStyle(c.id)}">
            <span class="item-icon">${svg(c.id)}</span>
            <span class="item-body">
              <span class="item-title">${esc(m.title)}</span>
              ${stackHTML(sum, sum.total)}
              <span class="row-stats"><span>${esc(c.name)}</span>${sum.review ? `<span style="color:var(--warn-ink);font-weight:700">要再確認 ${sum.review}人</span>` : ''}<span>途中 ${sum.doing}人</span><span>未着手 ${sum.none}人</span></span>
            </span>
            <span class="item-side"><span class="rate">${sum.done}<span class="muted" style="font-size:.8rem;font-weight:400">/${sum.total}人</span></span><span>完了</span></span>
          </a>`;
        }).join('')}</div>
      </section>`;
    bindAdminHead();
  }

  function renderAdminManual(id) {
    const m = getManual(id);

    const sum = manualSummary(m);
    view.innerHTML = `
      <div><a class="back" href="#admin-manuals">${svg('back')}マニュアル別へ戻る</a></div>
      <header class="detail-head" style="${catStyle(c.id)}">
        <span class="tag">${svg(c.id)}${esc(c.name)}</span>
        <h1>${esc(m.title)}</h1>
        <div class="meta-row"><span>${svg('cal')}${fmtDate(m.updated)} 更新</span><span>${m.steps.length}ステップ</span>${m.reviewFrom ? `<span>${svg('alert')}${fmtShort(m.reviewFrom)}に再確認を依頼</span>` : ''}</div>
      </header>
      <div class="tiles">
        <div class="tile good"><span class="tile-label">完了</span><span class="tile-value">${sum.done}<small>/ ${sum.total}人</small></span></div>
        <div class="tile ${sum.review ? 'warn' : ''}"><span class="tile-label">要再確認</span><span class="tile-value">${sum.review}<small>人</small></span></div>
        <div class="tile"><span class="tile-label">途中</span><span class="tile-value">${sum.doing}<small>人</small></span></div>
        <div class="tile"><span class="tile-label">未着手</span><span class="tile-value">${sum.none}<small>人</small></span></div>
      </div>
      <div class="list">${people.map(({ s, st, r }) => `
        <a class="item" href="#admin-s-${esc(s.id)}">
          ${avatarHTML(s)}
          <span class="item-body"><span class="item-title">${esc(s.name)}</span><span class="row-stats">${stPill(st)}<span>${
            st === 'done' ? `${fmtShort(r.completedAt)} 完了${r.count > 1 ? `（${r.count}回）` : ''}`
            : st === 'review' ? `${fmtShort(r.completedAt)} 完了（改訂前）`
            : st === 'doing' ? `${doneOf(s.id, m)} / ${m.steps.length} ステップ・${fmtShort(r.updatedAt)}`
            : 'まだ開いていません'}</span></span></span>
          ${svg('chev', 'chev')}
        </a>`).join('') || emptyHTML('users', 'スタッフがまだ登録されていません')}</div>
      <a class="btn" href="#m-${esc(m.id)}" style="align-self:flex-start">マニュアルを開く</a>`;
  }

  /* ---------- 登録・セキュリティ ---------- */
  // 管理者の操作を送り、最新の状態を読み直して画面を描き直す
  function adminDo(name, args, msg) {
    return callApi(name, session.adminToken, ...args).then(r => loadAdmin().then(() => {
      if (msg) toast(msg);
      route(true);
      return r;
    }), e => { apiError(e); return null; });
  }

  function showCode(s, code, title) {
    openSheet(`
      <div class="sheet-head"><h2>${esc(title)}</h2></div>
      <p style="margin:0">${esc(s.name)}さんのログインコードです。本人だけに伝えてください。</p>
      <div class="pin-input" style="padding:14px;border-radius:var(--radius);background:var(--accent-soft);font-weight:700" id="codeShow">${esc(code)}</div>
      <p class="muted" style="margin:0;font-size:.84rem">この画面を閉じると、もう一度表示することはできません。忘れたときは「ログインコードを再発行」してください。</p>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn" id="copyCode">${svg('copy')}コピー</button>
        <button class="btn primary" data-close>伝えました</button>
      </div>`);
    $('#copyCode').addEventListener('click', () => {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(() => toast('コピーしました'), () => toast('コピーできませんでした。書き写してください'));
      else toast('コピーできませんでした。書き写してください');
    });
  }

  function devicesHTML(s) {
    const list = s.sessions || [];
    if (!list.length) return '<span class="muted" style="font-size:.84rem">ログイン中の端末はありません</span>';
    return `<ul class="devices">${list.map(d => `<li>${svg('user')}<span>${esc(d.device || '端末')}</span><span class="muted">最終 ${fmtShort(d.lastSeen)}</span></li>`).join('')}</ul>`;
  }

  function openStaffSheet(id) {
    const s = getStaff(id);
    if (!s) return;
    if (s.active === false) {
      openSheet(`
        <div class="sheet-head"><h2>${esc(s.name)}さん</h2><button class="icon-btn" data-close aria-label="閉じる">${svg('x')}</button></div>
        <p style="margin:0"><span class="st st-review">退職 ${fmtShort(s.retiredAt)}</span></p>
        <p class="muted" style="margin:0;font-size:.86rem">ログインコードは無効になっていて、このアプリを開くことはできません。これまでの進み具合の記録は残っています。</p>
        <div class="actions">
          <a class="btn sm" href="#admin-s-${esc(s.id)}" data-close>記録を見る</a>
          <button class="btn sm" id="stReinstate">${svg('reset')}再登録する（新しいコードを発行）</button>
          <button class="btn sm danger" id="stDelete">${svg('trash')}記録ごと削除</button>
        </div>`);
      $('#stReinstate').addEventListener('click', () => adminDo('reinstateStaff', [s.id], '').then(r => { if (r) showCode(s, r.code, '再登録しました'); }));
      armed($('#stDelete'), 'もう一度押すと削除します（取り消せません）', () => { closeSheet(); adminDo('deleteStaff', [s.id], '削除しました'); });
      return;
    }
    openSheet(`
      <div class="sheet-head"><h2>${esc(s.name)}さん</h2><button class="icon-btn" data-close aria-label="閉じる">${svg('x')}</button></div>
      <div class="inline-form">
        <label class="sr-only" for="stName">名前</label>
        <input id="stName" type="text" value="${esc(s.name)}" maxlength="20">
        <label class="sr-only" for="stRole">役割</label>
        <input id="stRole" type="text" value="${esc(s.role || '')}" placeholder="役割" maxlength="20">
        <button class="btn sm" id="stSave">保存</button>
      </div>
      <div class="setting">
        <span class="setting-title">ログイン中の端末</span>
        ${devicesHTML(s)}
        <div class="actions">
          <button class="btn sm" id="stReissue">${svg('reset')}ログインコードを再発行</button>
          <button class="btn sm" id="stLogout" ${(s.sessions || []).length ? '' : 'disabled'}>${svg('lock')}端末をすべてログアウト</button>
        </div>
        <span class="muted" style="font-size:.78rem">再発行すると、今のコードは使えなくなり、ログイン中の端末もログアウトされます。</span>
      </div>
      <div class="setting">
        <span class="setting-title" style="color:var(--warn-ink)">退職・利用停止</span>
        <span class="muted" style="font-size:.84rem">退職にすると、この人のログインコードはすぐに使えなくなります。ログイン中の端末も、数分以内に画面が閉じてログイン画面に戻ります。これまでの記録は残ります。</span>
        <button class="btn sm danger" id="stRetire" style="align-self:flex-start">${svg('lock')}退職にする（利用を停止）</button>
      </div>`);
    $('#stSave').addEventListener('click', () => {
      const name = $('#stName').value.trim();
      if (!name) return toast('名前を入力してください');
      closeSheet();
      adminDo('updateStaff', [s.id, name, $('#stRole').value.trim()], '保存しました');
    });
    $('#stReissue').addEventListener('click', () => adminDo('reissueCode', [s.id], '').then(r => {
      if (!r) return;
      if (s.id === state.me) { state.token = ''; savePersonal(); }
      showCode(s, r.code, 'ログインコードを再発行しました');
    }));
    $('#stLogout').addEventListener('click', () => {
      if (s.id === state.me) { state.token = ''; savePersonal(); }
      closeSheet();
      adminDo('logoutStaff', [s.id], `${s.name}さんの端末をログアウトしました`);
    });
    armed($('#stRetire'), 'もう一度押すと退職にします', () => adminDo('retireStaff', [s.id], '').then(r => {
      if (!r) return;
      if (s.id === state.me) { state.token = ''; savePersonal(); state.me = ''; state.meInfo = null; }
      openSheet(`
        <div class="sheet-head"><h2>${esc(s.name)}さんを退職にしました</h2></div>
        <ul class="checklist">
          <li class="ok">${svg('check')}<span>ログインコードを無効にしました</span></li>
          <li class="ok">${svg('check')}<span>ログイン中だった端末 ${r.closed}台をログアウトしました</span></li>
          <li>${svg('alert')}<span>${esc(s.name)}さんが<b>管理者や編集ロックの暗証番号</b>を知っていた場合は、変更してください</span></li>
          <li>${svg('alert')}<span>医院の共用端末のパスコードや、Googleアカウントの共有も見直しましょう</span></li>
        </ul>
        <div class="actions" style="justify-content:flex-end">
          <button class="btn" data-close>閉じる</button>
          <button class="btn primary" id="toPins">暗証番号を変更する</button>
        </div>`);
      $('#toPins').addEventListener('click', () => { closeSheet(); const el = $('#pinPanel'); if (el) el.scrollIntoView({ behavior: 'smooth' }); });
    }));
  }

  function renderAdminTeam() {
    const active = activeStaff();
    const retired = state.staff.filter(s => s.active === false);
    view.innerHTML = `
      ${adminHead('#admin-team')}
      <section class="panel">
        <h2>スタッフ</h2>
        <span class="muted" style="font-size:.84rem">スタッフは、ここで発行する6桁のログインコードでログインします。辞めるときは「管理」から退職の手続きをしてください。</span>
        <div>${active.map(s => `
          <div class="team-row">
            ${avatarHTML(s)}
            <span style="min-width:0"><b>${esc(s.name)}</b> <span class="muted" style="font-size:.8rem">${esc(s.role || '')}</span><br>
              <span class="muted" style="font-size:.76rem">${(s.sessions || []).length ? `ログイン中 ${s.sessions.length}台・最終 ${fmtShort(s.sessions.map(x => x.lastSeen).sort().pop())}` : 'ログイン中の端末なし'}</span></span>
            <button class="btn sm" data-manage="${esc(s.id)}">管理</button>
          </div>`).join('') || '<p class="muted" style="margin:0">まだ登録されていません。下から追加してください。</p>'}</div>
        <div class="inline-form">
          <label class="sr-only" for="newName">名前</label>
          <input id="newName" type="text" placeholder="名前（例：山田 はな）" maxlength="20">
          <label class="sr-only" for="newRole">役割</label>
          <input id="newRole" type="text" placeholder="役割（例：歯科衛生士）" maxlength="20">
          <button class="btn sm primary" id="addStaff">${svg('plus')}追加してコードを発行</button>
        </div>
      </section>

      ${retired.length ? `<section class="panel">
        <h2>退職したスタッフ</h2>
        <span class="muted" style="font-size:.84rem">ログインできません。進み具合の集計にも含まれません。</span>
        <div>${retired.map(s => `
          <div class="team-row">
            ${avatarHTML(s)}
            <span style="min-width:0"><b>${esc(s.name)}</b> <span class="muted" style="font-size:.8rem">${esc(s.role || '')}</span><br><span class="st st-review">退職 ${fmtShort(s.retiredAt)}</span></span>
            <button class="btn sm" data-manage="${esc(s.id)}">管理</button>
          </div>`).join('')}</div>
      </section>` : ''}

      <section class="panel">
        <h2>${svg('shield')} スタッフが辞めるときは</h2>
        <ol class="howto">
          <li>上の一覧で「管理」→「退職にする」を押します。ログインコードが使えなくなり、その人の端末は数分以内にログイン画面に戻ります。</li>
          <li>その人が管理者や編集ロックの暗証番号を知っていた場合は、下で変更します。管理者の暗証番号を変えると、ほかの端末の管理者ページも閉じられます。</li>
          <li>ログインコードを誰かに教えていた心配があるときは「全員をログアウト」を押し、必要ならコードを再発行します。</li>
        </ol>
        <button class="btn sm danger" id="revokeAll" style="align-self:flex-start">${svg('lock')}全員の端末をログアウト</button>
        <span class="muted" style="font-size:.78rem">スタッフ全員が、もう一度ログインコードを入力することになります。</span>
      </section>

      <section class="panel" id="pinPanel">
        <h2>管理者の暗証番号</h2>
        <span class="muted" style="font-size:.84rem">変更すると、この端末以外で開いている管理者ページはすべて閉じられます。</span>
        <div class="inline-form">
          <label class="sr-only" for="adminPinNew">新しい暗証番号</label>
          <input id="adminPinNew" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="新しい">
          <button class="btn sm" id="adminPinBtn">変更する</button>
        </div>
        <p class="err" id="adminPinErr"></p>
      </section>

      <section class="panel">
        <h2>編集ロックの暗証番号</h2>
        <span class="muted" style="font-size:.84rem">${state.hasEditPin
          ? '設定されています。スタッフがマニュアルの編集ロックを解除するとき、この暗証番号が必要です。変えるときは、新しい番号を入れて「変更する」を押します。'
          : '設定されていません。今は確認画面だけでロックを解除できます。4桁の数字を決めると、解除に暗証番号が必要になります。'}</span>
        <div class="inline-form">
          <label class="sr-only" for="editPinNew">新しい暗証番号</label>
          <input id="editPinNew" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="新しい">
          <button class="btn sm" id="editPinBtn">${svg('lock')}${state.hasEditPin ? '変更する' : '設定する'}</button>
          ${state.hasEditPin ? `<button class="btn sm danger" id="editPinOff">${svg('unlock')}外す</button>` : ''}
        </div>
        <p class="err" id="editPinErr"></p>
      </section>

      <section class="panel">
        <h2>マニュアルのデータ</h2>
        <span class="muted" style="font-size:.84rem">バックアップや別の場所への移動に使います。下の文字をコピーして保管し、戻すときは「読み込み」に貼り付けます。</span>
        <label class="sr-only" for="exportBox">書き出したデータ</label>
        <textarea id="exportBox" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:.74rem;min-height:90px"></textarea>
        <button class="btn sm" id="copyExport" style="align-self:flex-start">${svg('copy')}コピーする</button>
        <label class="sr-only" for="importBox">読み込むデータ</label>
        <textarea id="importBox" placeholder="書き出したデータをここに貼り付け" style="font-family:ui-monospace,Menlo,monospace;font-size:.74rem;min-height:70px"></textarea>
        <div class="actions">
          <button class="btn sm" id="doImport">読み込む</button>
          <label class="btn sm" for="importFile">ファイルから選ぶ</label>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
          <button class="btn sm danger" id="resetAll">${svg('reset')}サンプルに戻す</button>
        </div>
      </section>`;
    bindAdminHead();

    view.querySelectorAll('[data-manage]').forEach(b => b.addEventListener('click', () => openStaffSheet(b.dataset.manage)));
    $('#addStaff').addEventListener('click', () => {
      const name = $('#newName').value.trim();
      if (!name) { toast('名前を入力してください'); $('#newName').focus(); return; }
      adminDo('addStaff', [name, $('#newRole').value.trim()], '').then(r => { if (r) showCode({ name }, r.code, `${name}さんを追加しました`); });
    });
    armed($('#revokeAll'), 'もう一度押すと全員をログアウトします', () => {
      adminDo('revokeAll', [], '全員の端末をログアウトしました').then(r => { if (r && state.token) { state.token = ''; savePersonal(); } });
    });

    // 暗証番号
    $('#adminPinBtn').addEventListener('click', () => {
      const v = $('#adminPinNew').value;
      if (!/^\d{4}$/.test(v)) { $('#adminPinErr').textContent = '4桁の数字を入力してください'; return; }
      adminDo('setPin', ['admin', v], '管理者の暗証番号を変更しました');
    });
    $('#editPinBtn').addEventListener('click', () => {
      const v = $('#editPinNew').value;
      if (!/^\d{4}$/.test(v)) { $('#editPinErr').textContent = '4桁の数字を入力してください'; return; }
      adminDo('setPin', ['edit', v], '編集ロックの暗証番号を設定しました').then(r => { if (r) { state.hasEditPin = true; session.editPin = v; route(true); } });
    });
    const off = $('#editPinOff');
    if (off) off.addEventListener('click', () => adminDo('setPin', ['edit', ''], '編集ロックの暗証番号を外しました').then(r => { if (r) { state.hasEditPin = false; route(true); } }));

    // データ
    $('#exportBox').value = JSON.stringify({ app: 'mirai-manual', version: 2, manuals: state.manuals }, null, 1);
    $('#copyExport').addEventListener('click', () => {
      const box = $('#exportBox');
      const fallback = () => { box.focus(); box.select(); toast('選択しました。コピーしてください'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(box.value).then(() => toast('コピーしました'), fallback);
      else fallback();
    });
    const replaceAll = (list, msg) => {
      editing = null;
      callApi('replaceManuals', session.adminToken, clone(list)).then(() => loadShared()).then(loadAdmin).then(() => { toast(msg); route(true); }, apiError);
    };
    const importText = text => {
      try {
        const data = JSON.parse(text);
        const list = Array.isArray(data) ? data : data.manuals;
        if (!Array.isArray(list) || !list.every(m => m && m.id && m.title && Array.isArray(m.steps))) throw new Error('bad');
        replaceAll(list, `${list.length}件のマニュアルを読み込みました`);
      } catch (err) {
        toast('読み込めませんでした。書き出したデータをそのまま貼り付けてください');
      }
    };
    $('#doImport').addEventListener('click', () => importText($('#importBox').value));
    $('#importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => importText(r.result);
      r.readAsText(file);
    });
    armed($('#resetAll'), 'もう一度押すと、全マニュアルを置き換えます', () => replaceAll(clone(DEFAULT_MANUALS), 'サンプルのマニュアルに戻しました'));
  }

  /* ================= ルーティング ================= */
  const q = $('#q');
  let searchTimer;
  q.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const v = q.value.trim();
      if (v) { renderSearch(v); setTab(''); }
      else route();
    }, 150);
  });

  function setTab(name) {
    const h = location.hash.slice(1) || 'home';
    const active = name !== undefined ? name
      : h === 'home' ? 'home' : (h === 'all' || h.startsWith('cat-')) ? 'all' : h === 'fav' ? 'fav' : h === 'new' ? 'new' : '';
    document.querySelectorAll('.tab').forEach(t => {
      if (t.dataset.tab === active) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
  }

  // 編集中は検索を止め、ヘッダーの表示をそろえる
  function syncChrome() {
    q.disabled = !!editing;
    q.placeholder = editing ? '編集中は検索できません' : 'マニュアルを検索';
    const me = state.meInfo;
    $('#whoBtn').innerHTML = me ? `${avatarHTML(me)}<span class="who-name">${esc(me.name)}</span>`
      : `<span class="avatar">${svg('shield')}</span><span class="who-name">管理者</span>`;
    setTab();
  }

  function route(keepScroll) {
    if (!state.ready) return;
    if (editing && location.hash !== editHash()) {
      if (isDirty()) {
        const target = location.hash || '#home';
        history.replaceState(null, '', editHash());
        confirmLeave(target);
        return;
      }
      editing = null;
    }
    const h = location.hash.slice(1) || 'home';
    if (q.value && !h.startsWith('m-')) q.value = '';
    const admin = fn => {
      if (!session.adminToken) return renderGate(() => route());
      if (!state.adminLoaded) {
        view.innerHTML = '<div class="loading">読み込んでいます…</div>';
        return loadAdmin().then(() => route(keepScroll), apiError);
      }
      fn();
    };
    if (h.startsWith('m-')) { q.value = ''; renderDetail(h.slice(2)); }
    else if (h.startsWith('cat-')) renderList(h.slice(4));
    else if (h === 'all') renderList(null);
    else if (h === 'fav') renderFav();
    else if (h === 'mine') renderPerson(state.me, false);
    else if (h === 'new') { if (!editing) newManual(); renderEditor(); }
    else if (h.startsWith('edit-')) { history.replaceState(null, '', '#m-' + h.slice(5)); renderDetail(h.slice(5)); }
    else if (h === 'admin') admin(renderAdminStaff);
    else if (h === 'admin-manuals') admin(renderAdminManuals);
    else if (h === 'admin-team') admin(renderAdminTeam);
    else if (h.startsWith('admin-s-')) admin(() => renderPerson(h.slice(8), true));
    else if (h.startsWith('admin-m-')) admin(() => renderAdminManual(h.slice(8)));
    else renderHome();
    syncChrome();
    if (!keepScroll) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => route());

  // 利用停止や期限切れを、開きっぱなしの画面にもすぐ反映する
  const checkAccess = () => {
    if (!state.ready || document.hidden) return;
    callApi('ping', tok()).catch(e => { if (errText(e).includes('AUTH')) apiError(e); });
  };
  setInterval(checkAccess, 2 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !state.ready) return;
    if (!REMOTE || editing || !overlay.hidden) return checkAccess();
    // ほかのスタッフの記録を取り込む（スプレッドシート版で、画面に戻ってきたとき）
    loadShared().then(() => route(true), e => { if (errText(e).includes('AUTH')) apiError(e); });
  });

  function boot() {
    view.innerHTML = '<div class="loading">読み込んでいます…</div>';
    if (!REMOTE) LocalServer.init();
    if (!tok()) return renderLogin('');
    loadShared().then(() => {
      setSignedOut(false);
      route();
    }, e => {
      if (errText(e).includes('AUTH')) return lockOut('ログインの有効期限が切れたか、管理者によって利用が停止されました。');
      view.innerHTML = `${emptyHTML('alert', 'データを読み込めませんでした。<br>通信状態を確かめてから、もう一度お試しください')}<button class="btn" id="retry" style="align-self:center">${svg('refresh')}もう一度読み込む</button>`;
      $('#retry').addEventListener('click', boot);
    });
  }
  boot();
})();
</script>
</body>
</html>
