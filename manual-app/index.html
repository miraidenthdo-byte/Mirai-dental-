    {"id":"n-dfdfe734bae6","cat":"assist","title":"難抜歯","summary":"難抜歯の準備物と、器具の出し方・片付けの注意です。","minutes":15,"updated":"2026-07-20","author":"アシスト業務","tags":["難抜歯","抜歯","外科","メス","ナート","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581d58a8adfdfe734bae6","steps":[{"h":"準備物","t":"基本セット／表マ／浸マ／メスホルダー・メス／剥離子／持針器・ナート／外科用ハサミ／抜歯鉗子／ヘーベル／滅菌ガーゼ／外科用バキューム／抜歯後の注意事項の用紙","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/8nQclMKj_t.jpeg"]},{"t":"必要に応じて：ゼックリア、ルートチップ、ルートエレベーターなどがいる時がある","tip":"最後の処置に使うものや、場合によっては必要になるものなどはチェストの上に置いておく"},{"h":"アシスト","t":"タイミングを見て、外科用トレーの上にメス、剥離子、エーヒ、ヘーベル、鉗子を出してメインテーブルにおく","tip":"滅菌ガーゼも1〜2枚ピンセットでとり、外科用トレーの上に一緒に置く","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/30TtqmYc_t.jpeg"]},{"t":"必要に応じて外科用バキュームを使うので、アシスト側においておく。浸マの予備も数本おいておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/JO0XK0Bh_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/77/QTxqYJfA_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/77/LE2UCGp6_t.jpeg"]},{"h":"片付け","t":"メスやナートの針を片付ける","warn":"メスやナートの針は危険なので、片付ける際は他の人にもわかりやすいようにしておく（メスやナートがあることを知らせるメモを置いておく等）。もしくは自分で片付けるようにする"}]},
    {"id":"n-dbef55b58581","cat":"assist","title":"上唇小帯切除","summary":"上唇小帯切除の準備物とアシストです。","minutes":15,"updated":"2025-09-09","author":"アシスト業務","tags":["上唇小帯切除","外科","メス","ナート","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581ed9c14dbef55b58581","steps":[{"h":"準備物","t":"①表面麻酔 ②浸潤麻酔 ③外科用バキューム ④メス ⑤ナート/持針器 ⑥ハサミ ⑦滅菌ガーゼ"},{"h":"アシスト","t":"必要に応じて外科用バキュームを使う。外科用バキュームはアシスト側におく","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/2pf7bTms_t.jpeg"]},{"t":"メスホルダーに刃をつけて、刃の部分は刃が入っていた袋で覆っておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/kRIYHgpb_t.jpeg"]},{"t":"最後の処置に使うものは、チェストの上でペーパートレーにいれておく。外科用トレーの上に出しておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/jpsSB0EZ_t.jpeg"]},{"h":"片付け","t":"メスやナートの針を片付ける","warn":"メスやナートは危険なので、すぐに片付けられない場合はメモ書きを残すなどし、周りの人への配慮をする。もしくは自分で片付けるようにする"}]},
    {"id":"n-f7236f9e57ae","cat":"assist","title":"インプラントキット","summary":"インプラントで使う器具のキットとツールBOXです。使用後は元の位置に戻して下さい。","minutes":5,"updated":"2026-05-08","author":"アシスト業務","tags":["インプラント","キット","ツールBOX","外科","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581afa800f7236f9e57ae","steps":[{"t":"インプラントキットの中身と置き場所（画像を参照）","warn":"使用後は元の位置に戻して下さい","img":["https://toothtooth-manual.jp/data/files/00/00/01/75/uruMrxFe_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/75/miMP3d0M_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/88/lrUAHwlm_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/75/TKRq26aT_t.jpeg"]},{"t":"インプラントツールBOX（２次オペ、インプラント上部印象時に使用します）","img":["https://toothtooth-manual.jp/data/files/00/00/01/88/FGmHHBch_t.jpeg"]}]},
    {"id":"n-fa0be739c4d3","cat":"assist","title":"インプラントオペ","summary":"インプラントオペの診察室の準備、メインテーブル・アシスト側の準備物とアシストです。","minutes":60,"updated":"2026-05-12","author":"アシスト業務","tags":["インプラント","オペ","外科","ドレープ","生理食塩水","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581b2a46cfa0be739c4d3","steps":[{"h":"診察室の準備","t":"技工室からインプラントのワゴンと矯正のワゴン(台として使うため)を診察室に運ぶ"},{"t":"バリアフィルムをメインテーブルの取手やライト、ライトの取手に貼り付ける"},{"t":"オペのドレープやガウン、滅菌グローブなどは技工室の上の棚から出し入れする"},{"t":"チェストの上にも準備物を置くので片付ける。メインテーブルに機械台ドレープを敷いてテープで固定する"},{"t":"インプラントのワゴンの上にモーターを設置する。インプラント用コントラをつけてモーターに繋ぐ"},{"t":"コントラの先に生理食塩水のチューブをつなぎ、生理食塩水にチューブを差し込む","warn":"差し込んだらコントラの先から生理食塩水が出てくるので、モーターの横に必ず先にチューブを挟む","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/55CWkG23_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/77/GmGQIhX7_t.jpeg"]},{"h":"メインテーブルに","t":"サージカルツールトレー／基本セット／外科用メス／剥離子／浸マ／表マ／プローブ／フィッシュプライヤー／銀のコップ","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/u5jg1IoY_t.jpeg"]},{"t":"最後に使う持針器やナート(ナイロン糸）、外科用ハサミなどは別のトレーに入れて、チェストの上においておく"},{"t":"他にも外科器具が必要になる場合があるため、近くにおいておく(ルートチップ、ゼックリアなど)"},{"h":"アシスト側に","t":"麻酔の取り替え何本か／基本セット／滅菌ガーゼ何枚か／コップに生理食塩水を入れる　を用意しておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/diwh63hx_t.jpeg"]},{"h":"アシスト","t":"同意書・ガイドデント申請用紙の記入、スケーリングを済ましておく"},{"t":"必要に応じて外科用バキュームで吸う。ゼックリアを使う時は普通のバキュームに付け替えて吸う"},{"t":"Drがナートを使う時はミラーで視野を広げる","tip":"ミラーは生理食塩水につけて、引っかからないようにする"}]},
    {"id":"n-d7828f35d852","cat":"assist","title":"インプラント２次オペ","summary":"インプラント２次オペの準備です（Notionでは画像のみのページです）。","minutes":30,"updated":"2026-09-29","author":"アシスト業務","tags":["インプラント","２次オペ","外科","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581d1bf58d7828f35d852","steps":[{"t":"インプラント２次オペの準備物（画像を参照）","tip":"ツールBOXは「インプラントキット」を参照。もう1枚の写真はNotionの元ページで見られます。","img":["https://toothtooth-manual.jp/data/files/00/00/01/80/G7OdWSYc_t.jpeg"]}]},
    {"id":"n-ddd279f86e40","cat":"hygiene","title":"リコールまでの流れ","summary":"初診からP検②、SRP、P検③を経て、SPT・P重防（定期検診）に移行するまでの衛生士の流れです。","minutes":30,"updated":"2026-06-29","author":"衛生士業務","tags":["リコール","初診","P検","SRP","TBI","PCR","メンテ","SPT","衛生士業務"],"source":"https://app.notion.com/p/38e9c73023f580f18512ddd279f86e40","steps":[{"h":"初診時（16歳以上）","t":"問診、パノラマ、口腔内写真、歯式(1号用紙に)、P検(+Perio Touch)","tip":"問診では前の医院から転院した理由を特に詳しく聞くこと（メンテナンスをする上での気をつける情報が盛りだくさん）。前の医院より良ければまた来てくれるようになる"},{"t":"〈治療希望、痛みありの方〉治療が必要そうであればP検終了後インカムでドクターに報告。Drが空いていなければ3〜3 SCしておく"},{"t":"〈定期検診希望〉アポに余裕があれば、Full SC・PMTC／Pの説明(現状も話す）／TBI(使った歯ブラシはプレゼント)など。SRPが必要な方はP検②へ、必要ない方は1M後P検③へ"},{"h":"初診時（15歳以下）","t":"〈定期検診希望〉問診、パノラマ、口腔内写真、歯式、染色、TBI、(歯石ついてたら SC)、PMTC、フッ素"},{"t":"〈治療希望、痛みあり〉問診、パノラマ、口腔内写真、歯式、TBI、(歯石ついてたら SC)。Drに治療の必要性を確認","tip":"パノラマは６歳以上は必ず撮影。３歳以上で撮影可能なこどもは撮影"},{"h":"P検②","t":"初診時にSCしていない時はfull SC、PMTC、エアフロー","tip":"一度のアポで縁上歯石が取りきれない場合は２度に分けて下さい"},{"t":"P検②再評価：4mm以上のポケットがある／プラークコントロール不良（50%以上）／再度縁上に歯石が付いている。上記の方に対しては1w後の来院→SRPへ","tip":"【当日に伝えること】TBI（バス法を優先して伝えて下さい。細かい所よりPCRを下げることが第一優先）。4mm以上のポケット、縁下歯石のある方には、SRPの必要性、内容、おおよその回数を説明"},{"h":"SRP(2〜6回) or TBI","t":"＊1回目：SRP + TBI(Yulyは毎回全顎します)。初回はPCRを確認して下さい。目標はPCR30%以下にすることです。","tip":"改善が見られる場合は褒めてあげて、モチベーションを上げましょう。改善が見られない場合でも、来院してるということは頑張る気持ちはあるということです。一緒に患者さんの口腔内を良くしていくスタンスでTBIに取り組みましょう。"},{"t":"どういうところが苦手なのかカウンセリングをして聞き出しましょう：時間の問題（5分以上推奨）、ブラッシングの方法（角度、ストローク幅、ブラッシング圧など）","tip":"フロス、歯間ブラシ、タフトブラシなど補助清掃具については、PCRが約30%以下になったら追加で説明して下さい。PCRが50%以上の人にいきなり歯ブラシ以外を使うことはハードルが高いと思われます。重度の叢生など、補助清掃具がどうしても必要になる場合は適宜説明をお願いします。"},{"t":"次回アポを取って終了して下さい。SRP何回の予定かをDr.に報告して下さい"},{"t":"＊2回目〜：SRPを4mm以上ポケットのある部位、縁下歯石の沈着がある部位に行って下さい。基本的にはブロックで分けて行うようにして下さい。あまり付着していない人に関してはブロックを超えてのSRPも構いません。全顎Yulyをして終了。あと何回かかるのか伝え、DHがアポを取って終了して下さい。"},{"t":"SRP、TBIが完了した後、次回アポは１M後にP検③でアポを取る","say":"「〇〇さんに合った定期検診の間隔を決めるため、歯石や汚れの付着の程度を見て、間隔を決めさせて貰いたいです。」"},{"h":"1M後　P検③（SRP必要ない方はここに飛ぶ）","t":"P検③とは、１M後にリコール間隔を決めるための検査。SRP必要なかった方→SC full +TBI(初診時とのプラコン比較する)。20％以下なら3Mメンテ。SRP終了した方→６点法で精密検査を行って下さい。"},{"t":"どちらもその時の状態により、リコールの間隔を決定します。1〜3Mが基本です。定期検診30分の枠内で管理できるのはどの位の間隔までかで判断してもらえると良いかと思います。","tip":"最終的には患者さんが継続して通える間隔が一番大事です。理想の間隔はこちらから提案はしますが、この間隔なら継続して通えると思える間隔を自身で決めてもらえるよう話しあって決めてください。","warn":"土曜日のみ、夕方のみしか来院できない方は3Mにして下さい。"},{"t":"ここまで来院してもらった方、全員にアンケートを実施してください。好印象を持ってもらえてそうな方にはGoogleの口コミに誘導して下さい。","say":"「今後のより良い医院の運営のためにご協力お願い出来ませんか？」"},{"h":"SPT or P重防","t":"基本検査／スケーリングor ソニックブラシ／PMTC（ラバーは必須、ブラシは適宜）／着色ある人に関してはエアフロー（前歯のみ）／TBI","tip":"臼歯までエアフロー希望の人は、自費で+1500円/1回と伝えて下さい。"},{"t":"患者によって時間の延長が必要な場合はDrに相談して下さい。汚れが多い場合などは月２回にするなどで対応して頂く場合もあります。"},{"t":"メンテで通ってる以上、前回との比較をしっかり伝えてあげて下さい。いきなり最上級は求めず、少しずつステップアップしていけるように指導を心がけてください。","tip":"新しい習慣を獲得するのにはそれ相応のエネルギーが必要です。簡単で続けれることから始めるようにして下さい（例：とりあえず5分は歯を磨く／朝と夜だけでも歯を磨いてもらう／お風呂に入ってる時に歯磨き）"},{"t":"次回アポをなるべく取って終了","tip":"定期検診の案内、リマインドはSMS、メール、ハガキのどの手段で行って貰いたいか確認する。携帯番号、メールアドレスに変更がないか確認する。診察券アプリの方はアプリに連絡が届きます"}]},
    {"id":"n-c689ab0a5134","cat":"hygiene","title":"メンテナンス","summary":"メンテナンス（定期検診）の必須内容と目安時間です。","minutes":30,"updated":"2026-06-29","author":"衛生士業務","tags":["メンテナンス","定期検診","スケーリング","TBI","PMTC","衛生士業務"],"source":"https://app.notion.com/p/1d39c73023f580b4b9b9c689ab0a5134","steps":[{"h":"必須内容","t":"基本検査（1点法）"},{"t":"ブラッシング、TBI"},{"t":"スケーリング"},{"t":"フロス、歯間ブラシ"},{"t":"歯面清掃","tip":"この時に磨き残しの部分など伝えながらTBIも行って下さい"},{"h":"目安時間","t":"導入 2分／基本検査 5分／スケーリング 7分／PMTC、IDB、フロス 7分／アポイント、アプリ、片付け 5分"},{"t":"Drのチェックは施術中でも、Drが来た場合には患者さんに声をかける","say":"「先生が来られたのでお口の中見てもらいますね」"}]},
    {"id":"n-f36a00a79416","cat":"hygiene","title":"iTeroの使い方","summary":"iTeroのログインと新患登録、追加スキャンのしかたです。","minutes":10,"updated":"2026-06-29","author":"衛生士業務","tags":["iTero","スキャン","インビザライン","補綴","矯正","衛生士業務"],"source":"https://app.notion.com/p/19c9c73023f581baa252f36a00a79416","steps":[{"h":"ログイン","t":"インビザラインの場合は青山先生のアカウント、補綴の印象の場合は院長先生のアカウントを選択する","tip":"パスワードは本体上部に記載されています（青山先生：Align123／院長先生：Mirai1107）"},{"h":"新患登録","t":"1. 新しいスキャンを選択"},{"t":"2. 患者入力項目：患者氏名＝英語表記（ローマ字）で入力／生年月日＝西暦/月/日／性別／チャート＝カルテ番号を入力"},{"t":"3. オーダー：矯正の場合・補綴の場合それぞれのページを参照","links":[{"label":"矯正の場合（Notion）","url":"https://app.notion.com/p/19c9c73023f5818c8f5fcdccd4f3345d"},{"label":"補綴の場合（Notion）","url":"https://app.notion.com/p/19c9c73023f5819f99f9e9c4225cf9c4"}]},{"h":"前回のスキャンデータを追加でスキャンする場合","t":"1. 追加したいデータを選択する→2. Rxを追加するを選択→3. スキャンを開始する"}]},
    {"id":"n-e8b813146ec5","cat":"hygiene","title":"ホワイトニング","summary":"ホワイトニングの料金・特徴と、オフィスホワイトニングの手順です。","minutes":60,"updated":"2026-06-29","author":"衛生士業務","tags":["ホワイトニング","オフィス","ホーム","デュアル","料金","同意書","衛生士業務"],"source":"https://app.notion.com/p/19c9c73023f58179bd0be8b813146ec5","steps":[{"h":"料金","t":"オフィスホワイトニング（60分アポ）：¥49,800　4回照射、1本使い切るように／ホームホワイトニング：マウスピース＋ジェル／追加ジェル 2本入り ¥5,500／デュアルホワイトニング：オフィス4回照射＋ホーム（マウスピース＋ジェル）","tip":"ホームホワイトニングとデュアルの金額は、Notionの元ページでは未記入です。"},{"h":"特徴","t":"オフィスホワイトニング：歯医者で光を当てて白くするホワイトニング。早く白くしたい方向け。一度で2段階ほど白くなるが後戻りもしやすい。施術後しみやすい"},{"t":"ホームホワイトニング：マウスピースにジェルをつけてお家でしてもらうホワイトニング。効果を実感するまで時間がかかる（１ヶ月ほど続けてもらうと効果が出てくる）。ゆっくり白くするのでキープしやすい","tip":"装着推奨時間：15% 4〜6h／20% 2〜4h。長くつけると効果は出やすいが、しみることがある"},{"t":"デュアルホワイトニング(オフィス+ホーム)：早く白くしたい、白さをキープさせたい方。オフィスとホームを同時にすると早く白くなりやすい"},{"h":"手順","t":"ブランケットをかける。オフィスの簡単な説明（2〜3回すると効果的、デュアルだと◎）"},{"t":"同意書を読んで記入してもらう。既往歴、授乳、しみる、直後は着色がつきやすいことは口頭でしっかり伝える。コーヒー、紅茶、カレー、ワイン、喫煙などは控えてもらう","warn":"補綴が入ってるところは変わらないことは必ず伝える"},{"t":"シェード確認・口写（シェードモードで前歯が見えるように）"},{"t":"5〜5をプレサージュで磨く"},{"t":"口唇にワセリン塗布・リトラクターをかける"},{"t":"奥歯でワッテを噛んでもらう→乾燥"},{"t":"歯肉マージンに沿って4ブロックに分けてワセリン塗布→光照射で固める","warn":"歯頸部に広げすぎると色の差が出やすいので、きわきわに塗布する"},{"t":"シリンジを希釈する（50回位）。1回の施術で1本使い切る"},{"t":"紙練板にのせてスパチュラで上下5〜5に塗布"},{"t":"1歯ずつ光照射する。照射器の設定を20秒に変える。上下で5分間ぐらい","tip":"照射時間が長い方が効果があるかも"},{"t":"ワッテで薬剤の拭き取り。3回繰り返す"},{"t":"ワセリンを拭う、ワッテの排除→水洗、乾燥"},{"t":"口写を撮って比較"},{"t":"ルシェロホワイトで磨く"},{"t":"口写の取り込み（『口腔内』に入れる）"},{"t":"着色しやすいものは控えてもらう","say":"「白いTシャツに着いたら嫌なものは控えてください」"},{"t":"口写を見せながら比較説明。何処がどれくらいのシェードに変化したか伝える。","tip":"エナメル質が分厚いと効果が出にくい(3など)。色は次第に馴染んでくる。"},{"t":"鏡を見てもらう・Drチェック"}]},
    {"id":"n-fc9a28ae9085","cat":"hygiene","title":"矯正相談","summary":"矯正相談（初診）、矯正資料採得、検査結果説明の流れです。","minutes":45,"updated":"2026-06-29","author":"衛生士業務","tags":["矯正","矯正相談","パノラマ","iTero","インビザライン","割引チケット","検査結果","衛生士業務"],"source":"https://app.notion.com/p/19c9c73023f581069cbcfc9a28ae9085","steps":[{"h":"矯正相談（初診）","t":"1. どこが気になるのかなど、簡単なカウンセリング(DH)"},{"t":"2. パノラマ撮影の確認：相談は無料だが、よりしっかりお話するためにパノラマを撮影しても良いか必ず確認。保険料がかかることを必ず説明する","say":"「矯正相談は無料ですが、より詳しい歯の状態を確認してお話するために保険料はかかりますがレントゲン撮影をしてもよろしいでしょうか？」","tip":"当日の支払い価格：大人、京都府外在住の全年齢の方 約3000円／子供(京都府在住) 200円"},{"t":"【了承を得た方】パノラマ撮影／口腔内写真(５枚法)撮影／(13歳以上は)iTero撮影。インビザライン(全顎)・インビザファスト(小児)⇨青山先生アカウント、iGo(部分矯正)⇨院長アカウント","tip":"基本は青山先生のアカウントでOK","warn":"どのアカウントでスキャンしたか分かるようカルテに記載してください"},{"t":"【拒否されたら】パノラマ、口腔内写真、iTero無し。院長からの簡単な説明のみになることを患者に伝える"},{"t":"3. 矯正相談の流れの紙を読み上げて説明する(ラミネートされたものを使用)"},{"t":"4. ドクターに報告し、カウンセリング：Drカウンセリング(ざっくりの期間、金額、抜歯の有無など)","warn":"アシスタントは話した内容等を細かくカルテに記入して残すこと。"},{"t":"5. 矯正相談の流れの紙と料金表を渡す。【すぐ矯正を始められる方】チケット付きの流れの紙を渡し、割引の説明をする。チケットを渡した旨と割引の期限をカルテに記入すること。","warn":"チケットは必ず検査当日に持参してもらうことを伝える。チケットが無い場合には割引適用できません"},{"t":"【時期を待って矯正が必要な方】チケット無しの流れの紙を渡す。割引のことは言わない。カルテの赤ふせんに、いつ頃から矯正スタートか記入すること。定期検診で矯正のタイミングまで様子を見ていく必要性を説明し、次回１〜３M後、メンテでアポを取る。"},{"h":"矯正資料採得","t":"矯正検査に必要な資料採りをする(当日検査代支払いあり)","tip":"チケットを持参した人のみ¥22,000割引"},{"t":"セファロ撮影／13歳以下は口写を撮り直す(短期間で口腔内が変わる為)"},{"t":"顔貌写真撮影（正面・右側貌）","warn":"必ず耳が見えるように"},{"t":"(インビザの場合)iTero細部撮影→Dr.チェック／(13歳以上は)CT撮影"},{"t":"(インビザファストの場合)インビザファスト用のプレオルソを装着し、口腔内（正面、左右側方）、顔貌の正面写真を撮影"},{"t":"１M後、診断結果説明のアポを取る(院長と岩田先生アポのみ)"},{"h":"検査結果","t":"同意書(受付にある)、顎模型を準備しておく。Drが伝えた内容を矯正結果の用紙に記入する(用紙名：矯正記録に入ってる)"},{"t":"矯正する→装置代の請求書お渡し→入金確認→発注（または装置代当日お支払い→発注）。１ヶ月〜１ヶ月半で届くので、届き次第TELする。矯正セットアポは60分（ワイヤー矯正：Dr岩田　マウスピース矯正：DH）"},{"t":"矯正しない or 一旦持ち帰り検討→終了。次回アポは定期検診でアポを取る"},{"t":"当院では無理なケース→検査代の50%を返金し、終了"}]},
    {"id":"n-dc293ed8dc7c","cat":"hygiene","title":"矯正器具（プライヤーの種類）","summary":"矯正で使うプライヤーの名前と用途です。","minutes":10,"updated":"2026-06-29","author":"衛生士業務","tags":["矯正","器具","プライヤー","ワイヤー","ブラケット","衛生士業務"],"source":"https://app.notion.com/p/19c9c73023f581c2b3acdc293ed8dc7c","steps":[{"t":"ユーティリティプライヤー→ワイヤーの把持","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/RbXV0kmz_t.jpeg"]},{"t":"ピンカッター→ワイヤーを切断する","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/miPySYEd_t.jpeg"]},{"t":"エンドカッター→最遠心のワイヤーをカットする","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/eoNfZZS4_t.jpeg"]},{"t":"バンドリムーバー→バンド除去に使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/AZdCCGm8_t.jpeg"]},{"t":"リガチャー→ワイヤー結紮する時に使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/ykji6VCm_t.jpeg"]},{"t":"ブラケットリムーバー①→ブラケット除去する時に使用する","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/J6tbwlnf_t.jpeg"]},{"t":"ブラケットリムーバー②→ブラケットやアタッチメントを除去する時","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/9hxv6au2_t.jpeg"]},{"t":"アタッチメントリムーバー→アタッチメントを除去する","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/kSDLiCkB_t.jpeg"]},{"t":"シンチバックプライヤー→ワイヤーの端をL字に曲げる","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/2Kw3PhPE_t.jpeg"]},{"t":"クリンピングプライヤー→クリンパブルフックをつける時","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/eoNfZZS4_t.jpeg"],"tip":"Notionの元ページでは、エンドカッターと同じ画像が使われています。"},{"t":"スリージョー→ワイヤーを屈曲する","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/miPySYEd_t.jpeg"],"tip":"Notionの元ページでは、ピンカッターと同じ画像が使われています。"}]},
    {"id":"n-e24439b5c364","cat":"hygiene","title":"矯正器具（その他）","summary":"プライヤー以外の矯正器具の名前と用途です。","minutes":5,"updated":"2026-06-29","author":"衛生士業務","tags":["矯正","器具","バンド","モジュール","ブラケット","衛生士業務"],"source":"https://app.notion.com/p/19c9c73023f58136a3b0e24439b5c364","steps":[{"t":"セパレーティングプライヤー→セパレートゴム装着時に使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/cdSCZDQF_t.jpeg"]},{"t":"バンドプッシャー→歯間にバンドを挿入する時に使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/qIQkdxjr_t.jpeg"]},{"t":"バンドシーター→バンドを噛み込ませるバンドセット時に使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/GJOPQqlU_t.jpeg"]},{"t":"モスキート→モジュールつける時に使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/1v8bnkgu_t.jpeg"]},{"t":"クリッピーインスツルメント→クリッピー上げる時に使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/rV6xzwT0_t.jpeg"]},{"t":"ブラケット用ピンセット→ブラケットセット時に使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/z68Zzvzo_t.jpeg"]},{"t":"インスツルメント","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/w0hMJHwm_t.jpeg"]}]},
    {"id":"n-c2559e691de5","cat":"hygiene","title":"矯正資料採得","summary":"矯正の初回資料採得と、追加アライナー時に必要な資料です。","minutes":20,"updated":"2026-06-29","author":"衛生士業務","tags":["矯正","資料採得","パノラマ","セファロ","iTero","アライナー","衛生士業務"],"source":"https://app.notion.com/p/24a9c73023f5809ebdfdc2559e691de5","steps":[{"h":"初回資料採得で必要なもの","t":"パノラマ"},{"t":"セファロ"},{"t":"口腔内写真"},{"t":"顔貌写真（正面、スマイル、右側貌、オーバージェット）"},{"t":"アイテロ（上顎の2番が萌出してる方）"},{"h":"追加アライナー時に必要なもの","t":"顔貌写真（正面、スマイル、右側貌、オーバージェット）","warn":"Angel alignerの場合は必ず"},{"t":"口腔内写真","warn":"Angel alignerの場合は必ず"},{"t":"アイテロ","warn":"必ず"}]},
    {"id":"n-ccc6c92d15a9","cat":"hygiene","title":"矯正終了時の記録","summary":"矯正終了時に取る資料です。","minutes":15,"updated":"2026-06-29","author":"衛生士業務","tags":["矯正","終了","資料","パノラマ","セファロ","衛生士業務"],"source":"https://app.notion.com/p/24a9c73023f5807b80dfccc6c92d15a9","steps":[{"h":"資料取るもの","t":"パノラマ"},{"t":"セファロ"},{"t":"口腔内写真"},{"t":"顔貌写真（正面、スマイル、右側貌、オーバージェット）"}]},
    {"id":"n-eae68d344105","cat":"hygiene","title":"小児トレーニング","summary":"抑制などはせずに、自分で治療できたという達成感を感じてもらうためのトレーニングです。しっかり治療に入る前に、出来る子か治療ができない子なのか線引きします。","minutes":15,"updated":"2026-06-29","author":"衛生士業務","tags":["小児","トレーニング","サホライド","フッ素","紹介","衛生士業務"],"source":"https://app.notion.com/p/3049c73023f580019d3eeae68d344105","steps":[{"h":"目的","t":"抑制などはせずに、自分で治療できたという達成感を感じてもらう。将来的に歯科治療の恐怖症になったりする子を増やさないためにも、しっかり治療に入る前に出来る子か治療ができない子なのか線引きする。"},{"h":"トレーニングの内容","t":"チェアに座ることができる"},{"t":"手をお腹の上から挙げないようにできる"},{"t":"バキュームを入れることができる"},{"t":"タービンを口腔内で使用できる（バー無）"},{"t":"クランプ（指輪）をかけることができる（ソフトクランプを上顎右側Eに）"},{"t":"鼻マスクをつけることができる（おおむね8歳未満の場合）"},{"t":"ロールワッテを入れることができる（口腔前庭に２分間）"},{"h":"結果の説明","t":"トレーニングの項目を全て達成出来るお子さんについては、次回に治療でアポイントを取ってください。"},{"t":"出来ないお子さんについては、①〜③のどれを希望するか保護者の方と相談します。①サホライドが出来そうなお子さんは、歯面は黒くなるが、サホライドを塗って治療可能な年齢になるまで1-2ヶ月経過観察をする　②フッ素塗布のみで1ヶ月ごとの経過観察をする　③大学病院などの専門機関に紹介する","tip":"紹介先：大阪歯科大学附属病院（〒540-0008 大阪府大阪市中央区大手前１丁目５−１７）／大阪大学歯学部附属病院（〒565-0871 大阪府吹田市山田丘１−８）"}]},
    {"id":"n-f7b31273f5ac","cat":"hygiene","title":"プレオルソの使用方法の説明","summary":"プレオルソを使う患者さんに説明する、あいうべ体操と取り扱いです。","minutes":5,"updated":"2026-06-29","author":"衛生士業務","tags":["プレオルソ","矯正","小児","あいうべ体操","衛生士業務"],"source":"https://app.notion.com/p/38d9c73023f5807d92b9f7b31273f5ac","steps":[{"h":"あいうべ体操","t":"おおげさに口を動かします。①「あ」の口で3秒キープ ②「い」の口で3秒キープ ③「う」の口で3秒キープ ④「べー」と舌を伸ばして3秒キープ","say":"「これを1セットとして、20回を目安に行ってください。朝・夜などに分けても構いません。」"},{"h":"取り扱いについて","t":"中性洗剤で洗ってください。"},{"t":"白い汚れは気にしなくて大丈夫です。しっかり使っているとプレオルソは白くなっていきます。"},{"t":"使用していない時はケースに入れて、無くさないように保管してください。"}]},
    {"id":"n-ca2de9924e43","cat":"steril","title":"ハンドピースの滅菌","summary":"コントラやタービン、ストレートは、器具とは別の滅菌の機械を使います。注油してから滅菌にかけます。","minutes":15,"updated":"2026-07-01","author":"滅菌・消毒・掃除","tags":["ハンドピース","滅菌","注油","タービン","コントラ","滅菌・消毒・掃除"],"source":"https://app.notion.com/p/3909c73023f580468930ca2de9924e43","steps":[{"h":"ハンドピースの注油","t":"注油前にspでしっかり拭く"},{"t":"注油の機械にかける","warn":"しっかりはまっているのを確認してかける","img":["https://toothtooth-manual.jp/data/files/00/00/01/81/SwqA18dU_t.jpeg"]},{"t":"ストレートを注油するときは、上の蓋を開けたところに入ってるバーを差して注油する","img":["https://toothtooth-manual.jp/data/files/00/00/01/81/VxmhC4FA_t.jpeg"]},{"t":"注油後、spで余分な油を拭き取る"},{"h":"ハンドピースの滅菌","t":"コントラやタービン、ストレートは器具とは別の滅菌の機械を使う。滅菌にかける前に注油を済ます"},{"t":"滅菌のカゴがある程度埋まってきたら滅菌にかける","warn":"精製水がしっかり入っていることを確認してから滅菌をかけるようにする","img":["https://toothtooth-manual.jp/data/files/00/00/01/81/9mN608Zm_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/81/jfFXypeb_t.jpeg"]},{"t":"蓋を閉めてロックをかける→PG-1かPG-2を押す→スタートボタン長押し"},{"t":"終了後に取り出す","warn":"終了後は熱いので十分気をつける。熱いので手袋をつける","img":["https://toothtooth-manual.jp/data/files/00/00/01/80/nLiv2Ml6_t.jpeg"]}]},
    {"id":"n-c40511f15b5a","cat":"steril","title":"オートクレーブの使い方","summary":"超音波にかけた器具を、オートクレーブで滅菌するときの手順です。","minutes":10,"updated":"2026-07-01","author":"滅菌・消毒・掃除","tags":["オートクレーブ","滅菌","滅菌袋","135℃","滅菌・消毒・掃除"],"source":"https://app.notion.com/p/3909c73023f5806aa506c40511f15b5a","steps":[{"t":"超音波にかけた器具は滅菌をする。タオルで拭き、乾いてから滅菌の袋に入れる","tip":"袋を閉じるときは音が鳴るまで待つ"},{"t":"滅菌のカゴにある程度の量が溜まったら、滅菌の機械に入れる","warn":"プラスチック類や滅菌に入れないものもあるので、確認してからカゴに入れる","img":["https://toothtooth-manual.jp/data/files/00/00/01/80/9XHs2m9y_t.jpeg"]},{"t":"①135℃ ②決定 ③スタート　の順番でボタンを押す","img":["https://toothtooth-manual.jp/data/files/00/00/01/80/kGUxjMbT_t.jpeg"]},{"t":"終了後に取り出す","warn":"終了後は熱いので、取り出す際は十分に気をつける。手袋を使う","img":["https://toothtooth-manual.jp/data/files/00/00/01/80/nLiv2Ml6_t.jpeg"]}]},
    {"id":"n-f9b15fbf26f2","cat":"steril","title":"超音波洗浄について","summary":"使った器具を洗ってから超音波洗浄にかけるまでの手順と注意点です。","minutes":10,"updated":"2026-07-01","author":"滅菌・消毒・掃除","tags":["超音波洗浄","器具","消毒","血液分解液","滅菌・消毒・掃除"],"source":"https://app.notion.com/p/3909c73023f5801bb8b1f9b15fbf26f2","steps":[{"t":"使った器具は消毒室で薬液に一度つけてから、食器用洗剤のついたスポンジで洗う"},{"t":"外科などで血液がついた器具は、一度血液分解液につけてから超音波にかける"},{"t":"洗った後に超音波洗浄にかける。タービンやコントラのバー、歯面清掃のブラシなど小さいものは、蛇口にかかっているネットに入れる","img":["https://toothtooth-manual.jp/data/files/00/00/01/81/1NNqelgz_t.jpeg"]},{"t":"ストレートのバーはネットに入らないので、銀のコップに入れてかける"},{"t":"探針やプローブは先が尖っているので、向きを揃えて入れる","warn":"先が尖っているので注意"},{"t":"バーセットは傾くと中身が出てくるため、上下の向きを確認して入れる","img":["https://toothtooth-manual.jp/data/files/00/00/01/80/rRXCxwre_t.jpeg"]},{"t":"ミラー類は傷がつくので超音波にはかけず、洗うのみ","warn":"コントラやタービンは水につけない"},{"t":"超音波が終わったら、水で軽く洗い流してからタオルの上に置く","img":["https://toothtooth-manual.jp/data/files/00/00/01/80/mHGulwvT_t.jpeg"]}]},
    {"id":"n-c1bd206ee8ad","cat":"steril","title":"大掃除リスト","summary":"大掃除のときに場所ごとに行うことの一覧です。","minutes":60,"updated":"2026-07-01","author":"滅菌・消毒・掃除","tags":["大掃除","エアコン","フィルター","技工室","掃除","滅菌・消毒・掃除"],"source":"https://app.notion.com/p/3909c73023f58092be3fc1bd206ee8ad","steps":[{"h":"技工室","t":"保護用銀シートの交換"},{"t":"石膏トラップの掃除"},{"h":"診察室","t":"エアコンフィルター掃除"},{"h":"待合","t":"エアコンフィルター交換"},{"t":"窓の掃除"},{"h":"２階スタッフルーム","t":"エアコンフィルター掃除","tip":"機械室の項目は、Notionの元ページでは未記入です。"}]},
    {"id":"n-ff87ccaf33b1","cat":"steril","title":"清潔 / 不潔 ゾーニング","summary":"歯科治療では唾液や血液に触れる機会が多い環境です！汚染のレベルに合わせて使用するゾーンを区切り、予想できない汚染と院内感染を防ぎます。","minutes":5,"updated":"2026-07-01","author":"滅菌・消毒・掃除","tags":["ゾーニング","清潔","不潔","院内感染","感染対策","滅菌・消毒・掃除"],"source":"https://app.notion.com/p/3909c73023f580568ee6ff87ccaf33b1","steps":[{"h":"ゾーニングとは？","t":"汚染のレベルに合わせて使用するゾーンを区切ること。主に、不潔エリア・清潔エリアの２つのエリアに区切る。","tip":"予想できない汚染と院内感染を防ぎます！"},{"h":"不潔エリア","t":"唾液や血液に汚染された使用済みの器具 / 器材を置くエリア"},{"t":"●洗浄 / 消毒ゾーン：流し台／浸漬消毒槽／超音波洗浄機／ウォッシャー／ハンドピース注油器"},{"t":"●滅菌ゾーン：滅菌機／エアーガン"},{"h":"清潔エリア","t":"●乾燥 / 保管ゾーン：消毒または滅菌後の器具器材を、乾燥 / 冷却し保管場所に戻すまでのエリア"}]},
    {"id":"n-cd933df2d40c","cat":"chart","title":"アポの取り方","summary":"来院目標人数 70、メンテ目標人数 50。中断を防ぐため、次回予約は必ずおさえるという意識を1人1人がもちましょう。","minutes":15,"updated":"2026-06-29","author":"アポの取り方","tags":["アポ","次回予約","中断","キャンセル","メンテ","チェアサイド"],"source":"https://app.notion.com/p/38e9c73023f580139eeacd933df2d40c","steps":[{"h":"受付対応","t":"アポツール左のイベントの欄に来院人数が表示されているので、アポが70名に達してない近い日からすすめる（基本的に同じドクター、衛生士になるように）","say":"『次回(内容)になりますので、(近々・1w後・1m後・3m後)の○月○日の○時、○時が空いてますがいかがですか？』","tip":"断られたら次の日、その次の日と、40未満のアポ日を優先にすすめる。"},{"t":"「予定分からないので連絡します」と言われたら、中断に繋がるのでできるだけその場でアポを取ってもらう。","say":"『仮押さえして変更していただいても大丈夫ですので一旦枠だけ押さえておいてもよろしいですか？』"},{"t":"土曜日は、土曜日にしか来れない方・初診で枠を空けておきたいので、こちらからはすすめない。平日来れる方は平日に来てもらう。"},{"h":"電話対応","t":"キャンセルの電話で「また連絡します」となると中断に繋がるので、仮でもいいので予約を取ってから電話を切る。","say":"患者さん『予約をキャンセルしたいです』\n受付『かしこまりました。このお電話で変更させていただきますね』\n患者さん『予定が今わからないです』\n受付『では、仮押さえしてその後変更していただいても大丈夫ですので一旦押さえておいてもよろしいですか？』","warn":"中断患者が増えると、しばらくしてから急患で来られたり、患者さんの口腔内も悪化していくため、次回予約は必ずおさえるという意識を1人1人がもつ。"},{"h":"チェアサイド","t":"中でアポを取ることで次回予約取得率が上がる。先生、衛生士との約束になるのでキャンセル率も下げることができる。治療、メンテ、P処終了後に声をかける。","say":"『〇〇さんお疲れ様でした。このまま次回のご予約取らせてもらっても大丈夫ですか？』"},{"t":"【治療の場合】","say":"『次回〇〇の治療になるので最短で〇日の〇時と〇時が空いてますがご予定いかがですか？』"},{"t":"【SRPの場合】","say":"『次回深い所の歯石取り〇回目(あと何回かも伝える)になるので近々でお取りできればと思います。〇日の〇時と〇時空いていますがご予定いかがですか？』"},{"t":"【P検③の場合】期間があく場合はまず日にちを決める。メンテアポが埋まってない日にちを2日ほど提案する。","say":"『次回１ヶ月後に再度汚れのつき具合を見させてもらって、〇〇さんに合った定期検診の間隔を決めていきたいので、〇月〇日や〇日で取らせていただきたいのですがご予定いかがですか？』","warn":"『いつがご都合いいですか？、いつでも大丈夫ですよ』などは言わない。"},{"t":"【メンテの場合】予定が分からない方がほとんどなので、前もって変更可能な事を伝える。ここで引き下がると中断に繋がるので、ここで必ず予約を取る！という気持ちで。","say":"『次回３ヶ月後の○月で予約取りますね。まだ予定分からないと思うので近くなって難しかったら変更していただいても大丈夫です。〇日や〇日が空いてますがいかがですか？』"},{"t":"DHはドクター待ちの時間に中でアポを取る。","warn":"DHはドクター待ちの時間に中でアポを取る。"}]},
    {"id":"n-faa787aeb5ad","cat":"chart","title":"カルテの書き方","summary":"間違えやすいカルテ記入のポイントと、各欄の書き方です。","minutes":10,"updated":"2026-07-01","author":"カルテの書き方","tags":["カルテ","メンテ","主訴","次回アポ","赤付箋"],"source":"https://app.notion.com/p/3909c73023f580ed90f2faa787aeb5ad","steps":[{"h":"間違えやすいカルテ記入のポイント","t":"1Mメンテ：定期検診の間隔が１ヶ月ごとの方（定期検診に移行してる方に使用）"},{"t":"１ヶ月後メンテ：来院当日から1ヶ月後にメンテナンスを行うということ","warn":"必ず月をまたいでください。例：4/1に来院の方は4/30ではアポは取らない"},{"t":"1月メンテ：1月のどこかでメンテナンスを行うということ"},{"h":"各欄の書き方","t":"主訴：患者さんの言葉でわかりやすくまとめる","tip":"記入例の画像はNotionの元ページで見られます。"},{"t":"前回の歯科医院：最後の通院がいつ頃か確認する"},{"t":"治療部位：初診時にドクターに確認して、治療予定部位にはマーカーで塗る"},{"t":"検査内容：当日行った検査を丸で囲む"},{"t":"不安なこと：なぜ今回は当医院に来院しようと思ったか、過去に歯科医院で嫌な思いや不安に思ったことが無かったか確認すること。","tip":"その中に今回、当院で行う対応のヒントが見つけられます。その点に最大限注意した対応を行うこと。"},{"t":"次回アポ：N）と表記し、次回のアポイントを正しく記載をして、マーカーでアンダーラインを引く"},{"h":"赤付箋の使い方","t":"治療時に対応が必要な重要な事項を記載する。例）ロキソニンアレルギー、チェアがあまり倒せない、タオルいらない　など"}]},
    {"id":"n-e88f72681621","cat":"rules","title":"有給申請について","summary":"有給制度は、所定の書類を記入して院長に承認後、アポツールのシフトを変更し、キングオブタイムでの有給申請を行って下さい。","minutes":10,"updated":"2026-07-01","author":"申請書類","tags":["有給","申請","シフト","キングオブタイム","申請書類"],"source":"https://app.notion.com/p/3909c73023f58036a767e88f72681621","steps":[{"h":"申請の決まり","t":"３ヶ月前が最終の提出期限とします。どうしても３か月以内の申請が必要な場合、まずは衛生士長に相談してください","warn":"土曜日、祝日前後、３連休以上になる場合には要相談。"},{"h":"有給申請の流れ","t":"1. 有給申請用紙の記入：スタッフルームに置いてある書類を記入して、院長に承認をもらう。"},{"t":"2. 承認後、有給の日のアポツールのシフトを変更する。"},{"t":"3. キングオブタイムでの有給申請を行う。"}]},

  /* ================= データの置き場所 ================= */
  // Apps Script（Googleスプレッドシート版）で開いたときはスタッフ全員の共有データ。
  // それ以外（ファイルを直接開いたとき）は、この端末の中だけで動く「体験モード」。
  const REMOTE = typeof google !== 'undefined' && google.script && google.script.run;
  const clone = o => JSON.parse(JSON.stringify(o));
  const nowISO = () => new Date().toISOString();

  // 体験モード用のサンプル（スプレッドシート版では使いません）
  const SAMPLE_STAFF = [
    { id: 's1', name: '佐藤 さくら', role: '歯科衛生士', code: '111111' },
    { id: 's2', name: '鈴木 ゆい', role: '歯科助手', code: '222222' },
    { id: 's3', name: '高橋 みなみ', role: '受付', code: '333333' },
    { id: 's4', name: '田中 あおい', role: '歯科衛生士', code: '444444' },
    { id: 's5', name: '伊藤 ひなた', role: '受付（新人）', code: '555555' },
    { id: 's6', name: '渡辺 まい', role: '歯科助手', code: '', active: false, retiredAt: '2026-08-31T09:00:00.000Z' }
  ];
  function sampleProgress(manuals, staff) {
    const level = [0.92, 0.72, 0.55, 0.38, 0.16, 0.6];
    const progress = {};
    staff.forEach((s, si) => {
      progress[s.id] = {};
      manuals.forEach((m, mi) => {
        const r = (((si + 1) * 9301 + (mi + 1) * 49297) % 233280) / 233280;
        const day = String(5 + (si * 3 + mi * 5) % 25).padStart(2, '0');
        const month = s.active === false ? '08' : '09';
        const at = `2026-${month}-${day}T10:${String(10 + mi).padStart(2, '0')}:00.000Z`;
        if (r < level[si]) progress[s.id][m.id] = { done: [], completedAt: at, updatedAt: at, count: 1 };
        else if (r < level[si] + 0.22) progress[s.id][m.id] = { done: m.steps.map((_, i) => i).slice(0, Math.max(1, Math.floor(m.steps.length / 2))), completedAt: '', updatedAt: at, count: 0 };
      });
    });
    return progress;
  }

  // 体験モードでは、サーバー（Code.gs）と同じ動きをこの端末の中で再現する
  const DEMO_KEY = 'mirai-manual-demo-v4';
  const LocalServer = (() => {
    let db = null;
    let fails = [];
    const STAFF_IDLE = 120 * 864e5, ADMIN_TTL = 12 * 3600e3;
    const persist = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify(db)); } catch (e) { /* 保存できない環境 */ } };
    const rnd = () => Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    const iso = () => new Date().toISOString();
    const newCode = () => { let c; do { c = String(Math.floor(100000 + Math.random() * 900000)); } while (db.staff.some(s => s.code === c)); return c; };
    const pub = s => ({ id: s.id, name: s.name, role: s.role || '' });
    const dropSessions = test => { db.sessions = db.sessions.filter(x => !test(x)); };
    const openSession = (staffId, device) => { const token = rnd(); db.sessions.push({ token, staffId, device: String(device || ''), createdAt: iso(), lastSeen: iso() }); persist(); return { token }; };
    const throttle = () => { const now = Date.now(); fails = fails.filter(t => now - t < 600e3); if (fails.length >= 20) throw new Error('LIMIT'); };
    const check = (kind, pin) => { if (db.pins[kind] && db.pins[kind] !== pin) throw new Error('PIN'); };
    function resolve(token) {
      const s = db.sessions.find(x => x.token === token);
      if (!s) throw new Error('AUTH');
      const now = Date.now();
      if (s.staffId === '__admin') {
        if (now - Date.parse(s.createdAt) > ADMIN_TTL) { dropSessions(x => x === s); persist(); throw new Error('AUTH'); }
        return { admin: true };
      }
      const st = db.staff.find(x => x.id === s.staffId && x.active !== false);
      if (!st || now - Date.parse(s.lastSeen) > STAFF_IDLE) { dropSessions(x => x === s); persist(); throw new Error('AUTH'); }
      s.lastSeen = iso();
      return { admin: false, staff: st };
    }
    function requireAdmin(token) {
      let r;
      try { r = resolve(token); } catch (e) { throw new Error('ADMINAUTH'); }
      if (!r.admin) throw new Error('ADMINAUTH');
    }
    const staffById = id => { const s = db.staff.find(x => x.id === id); if (!s) throw new Error('STAFF'); return s; };
    function remap(mid, map) {
      if (!map) return;
      Object.values(db.progress).forEach(p => {
        const r = p[mid];
        if (!r || !(r.done || []).length) return;
        const old = new Set(r.done);
        r.done = map.map((o, i) => (o >= 0 && old.has(o)) ? i : -1).filter(i => i >= 0);
      });
    }
    const api = {
      status() { return { hasAdminPin: !!db.pins.admin, initialized: true, demo: true }; },
      initialize() { return true; },
      login(code, device) {
        throttle();
        const st = db.staff.find(s => s.active !== false && s.code && s.code === String(code));
        if (!st) { fails.push(Date.now()); throw new Error('LOGIN'); }
        return openSession(st.id, device);
      },
      adminLogin(pin, device) {
        throttle();
        if (!db.pins.admin) throw new Error('NOADMIN');
        if (db.pins.admin !== String(pin)) { fails.push(Date.now()); throw new Error('PIN'); }
        return openSession('__admin', device);
      },
      adminSetup(pin, device) {
        if (db.pins.admin) throw new Error('PIN');
        if (!/^\d{4}$/.test(String(pin))) throw new Error('FORMAT');
        db.pins.admin = String(pin);
        return openSession('__admin', device);
      },
      logout(token) { dropSessions(x => x.token === token); persist(); return true; },
      ping(token) { resolve(token); persist(); return true; },
      getAll(token) {
        const r = resolve(token);
        persist();
        return {
          role: r.admin ? 'admin' : 'staff', me: r.admin ? null : pub(r.staff), manuals: db.manuals,
          progress: r.admin ? db.progress : { [r.staff.id]: db.progress[r.staff.id] || {} },
          hasEditPin: !!db.pins.edit, hasAdminPin: !!db.pins.admin, initialized: true, demo: true
        };
      },
      verifyPin(token, kind, pin) { resolve(token); return !db.pins[kind] || db.pins[kind] === pin; },
      saveManual(token, m, map, editPin) {
        if (!resolve(token).admin) check('edit', editPin);
        const i = db.manuals.findIndex(x => x.id === m.id);
        if (i >= 0) db.manuals[i] = m; else db.manuals.unshift(m);
        remap(m.id, map);
        persist();
        return true;
      },
      deleteManual(token, id, editPin) {
        if (!resolve(token).admin) check('edit', editPin);
        db.manuals = db.manuals.filter(x => x.id !== id);
        Object.values(db.progress).forEach(p => { delete p[id]; });
        persist();
        return true;
      },
      saveProgress(token, mid, rec) {
        const r = resolve(token);
        if (r.admin) throw new Error('STAFF');
        (db.progress[r.staff.id] = db.progress[r.staff.id] || {})[mid] = rec;
        persist();
        return true;
      },
      adminData(token) {
        requireAdmin(token);
        return {
          staff: db.staff.map(s => ({
            ...pub(s), active: s.active !== false, retiredAt: s.retiredAt || '',
            sessions: db.sessions.filter(x => x.staffId === s.id).map(x => ({ device: x.device, lastSeen: x.lastSeen }))
          })),
          progress: db.progress
        };
      },
      addStaff(token, name, role) {
        requireAdmin(token);
        if (!String(name || '').trim()) throw new Error('FORMAT');
        const s = { id: 's' + rnd().slice(0, 8), name: String(name).trim(), role: String(role || '').trim(), active: true, retiredAt: '', code: newCode() };
        db.staff.push(s);
        persist();
        return { id: s.id, code: s.code };
      },
      updateStaff(token, id, name, role) {
        requireAdmin(token);
        if (!String(name || '').trim()) throw new Error('FORMAT');
        const s = staffById(id);
        s.name = String(name).trim();
        s.role = String(role || '').trim();
        persist();
        return true;
      },
      retireStaff(token, id) {
        requireAdmin(token);
        const s = staffById(id);
        const closed = db.sessions.filter(x => x.staffId === id).length;
        s.active = false; s.retiredAt = iso(); s.code = '';
        dropSessions(x => x.staffId === id);
        persist();
        return { closed };
      },
      reinstateStaff(token, id) {
        requireAdmin(token);
        const s = staffById(id);
        s.active = true; s.retiredAt = ''; s.code = newCode();
        persist();
        return { code: s.code };
      },
      reissueCode(token, id) {
        requireAdmin(token);
        const s = staffById(id);
        if (s.active === false) throw new Error('STAFF');
        s.code = newCode();
        dropSessions(x => x.staffId === id);
        persist();
        return { code: s.code };
      },
      logoutStaff(token, id) { requireAdmin(token); dropSessions(x => x.staffId === id); persist(); return true; },
      deleteStaff(token, id) {
        requireAdmin(token);
        db.staff = db.staff.filter(x => x.id !== id);
        delete db.progress[id];
        dropSessions(x => x.staffId === id);
        persist();
        return true;
      },
      revokeAll(token) { requireAdmin(token); dropSessions(x => x.staffId !== '__admin'); persist(); return true; },
      setPin(token, kind, next) {
        requireAdmin(token);
        if (next && !/^\d{4}$/.test(String(next))) throw new Error('FORMAT');
        if (kind === 'admin') {
          if (!next) throw new Error('FORMAT');
          dropSessions(x => x.staffId === '__admin' && x.token !== token);
        }
        db.pins[kind] = next ? String(next) : '';
        persist();
        return true;
      },
      replaceManuals(token, list) {
        requireAdmin(token);
        db.manuals = list;
        const ids = new Set(list.map(m => m.id));
        Object.values(db.progress).forEach(p => Object.keys(p).forEach(mid => { if (!ids.has(mid)) delete p[mid]; }));
        persist();
        return true;
      }
    };
    return {
      init() {
        try { db = JSON.parse(localStorage.getItem(DEMO_KEY)); } catch (e) { db = null; }
        if (db && Array.isArray(db.manuals) && Array.isArray(db.sessions)) {
          // あとから増えた初期マニュアルを足す（一度入れて削除したものは戻さない）
          const seeded = new Set(db.seeded || db.manuals.map(m => m.id));
          const added = clone(DEFAULT_MANUALS.filter(m => !seeded.has(m.id) && !db.manuals.some(x => x.id === m.id)));
          db.manuals = db.manuals.concat(added);
          db.seeded = DEFAULT_MANUALS.map(m => m.id).concat([...seeded].filter(id => !DEFAULT_MANUALS.some(m => m.id === id)));
          if (added.length) persist();
          return;
        }
        const manuals = clone(DEFAULT_MANUALS).map(m => m.id === 'm10' ? { ...m, reviewFrom: '2026-10-01T00:00:00.000Z' } : m);
        const staff = clone(SAMPLE_STAFF).map(s => ({ active: true, retiredAt: '', ...s }));
        db = { manuals, staff, progress: sampleProgress(manuals, SAMPLE_STAFF), sessions: [], pins: { edit: '', admin: '' }, seeded: DEFAULT_MANUALS.map(m => m.id) };
        persist();
      },
      call(name, args) { return api[name](...args); }
    };
  })();

  function callApi(name, ...args) {
    if (REMOTE) {
      return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
    }
    return new Promise((resolve, reject) => {
      try { const r = LocalServer.call(name, clone(args)); resolve(r === undefined ? null : clone(r)); } catch (e) { reject(e); }
    });
  }
  const errText = e => String((e && e.message) || e);
  function apiError(e) {
    const msg = errText(e);
    if (msg.includes('ADMINAUTH')) {
      session.adminToken = '';
      saveAdminToken();
      toast('管理者の確認が切れました。もう一度暗証番号を入力してください');
      if (location.hash.startsWith('#admin')) route(); else location.hash = '#admin';
    }
    else if (msg.includes('AUTH')) lockOut('ログインの有効期限が切れたか、管理者によって利用が停止されました。');
    else if (msg.includes('PIN')) toast('暗証番号が確認できませんでした。もう一度ロックを解除してください');
    else if (msg.includes('LIMIT')) toast('失敗が続いたため、しばらくログインできません。10分ほど待ってからお試しください');
    else if (msg.includes('STAFF')) toast('スタッフが見つかりません。画面を最新にしてください');
    else toast('保存できませんでした。通信状態を確かめて、もう一度お試しください');
  }

  /* ================= 画像・動画の保存先 ================= */
  // スプレッドシート版：医院のGoogleドライブ（非公開フォルダ）に保存し、ログイン中のスタッフだけが読み込める
  // 体験モード：この端末のブラウザ（IndexedDB）に保存
  const MEDIA_LIMIT = { image: 10 * 1024 * 1024, video: 25 * 1024 * 1024 };
  const MEDIA_CHUNK = 4 * 1024 * 1024;
  const Media = (() => {
    const urls = new Map();
    let dbp = null;
    const idb = () => dbp || (dbp = new Promise((resolve, reject) => {
      const req = indexedDB.open('mirai-manual-media', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('files');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    }));
    const idbDo = (mode, fn) => idb().then(db => new Promise((resolve, reject) => {
      const tx = db.transaction('files', mode);
      const r = fn(tx.objectStore('files'));
      tx.oncomplete = () => resolve(r && r.result);
      tx.onerror = () => reject(tx.error);
    }));
    const toBase64 = blob => new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result).split(',')[1] || '');
      fr.onerror = () => reject(fr.error);
      fr.readAsDataURL(blob);
    });
    const fromBase64 = b64 => { const s = atob(b64); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
    async function put(blob, name) {
      if (REMOTE) {
        const r = await callApi('uploadMedia', tok(), session.editPin, String(name || 'file').slice(0, 80), blob.type, await toBase64(blob));
        urls.set(r.id, Promise.resolve(URL.createObjectURL(blob)));
        return r.id;
      }
      const id = 'loc-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      await idbDo('readwrite', st => st.put(blob, id));
      urls.set(id, Promise.resolve(URL.createObjectURL(blob)));
      return id;
    }
    async function load(id) {
      if (!REMOTE) {
        const blob = await idbDo('readonly', st => st.get(id));
        if (!blob) throw new Error('NOTFOUND');
        return URL.createObjectURL(blob);
      }
      const parts = [];
      let offset = 0, size = 1, mime = '';
      while (offset < size) {
        const r = await callApi('getMediaChunk', tok(), id, offset, MEDIA_CHUNK);
        size = r.size; mime = r.mime;
        const bytes = fromBase64(r.data);
        if (!bytes.length) break;
        parts.push(bytes);
        offset += bytes.length;
      }
      return URL.createObjectURL(new Blob(parts, { type: mime }));
    }
    return {
      put,
      url(id) {
        if (!urls.has(id)) urls.set(id, load(id).catch(e => { urls.delete(id); throw e; }));
        return urls.get(id);
      }
    };
  })();

  // 写真は送る前に縮小する（長い辺 1600px・JPEG）。GIF や動画はそのまま
  async function prepareMedia(file) {
    const type = file.type.startsWith('video/') ? 'video' : file.type.startsWith('image/') ? 'image' : '';
    if (!type) throw new Error('TYPE');
    if (type === 'image' && file.type !== 'image/gif' && window.createImageBitmap) {
      try {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
        const c = document.createElement('canvas');
        c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
        if (out && out.size < file.size) return { type, blob: out };
      } catch (e) { /* 縮小できない形式はそのまま送る */ }
    }
    if (file.size > MEDIA_LIMIT[type]) throw new Error(type === 'video' ? 'VIDEOSIZE' : 'IMAGESIZE');
    return { type, blob: file };
  }

  // 画面内の [data-media-src] に、保存先から読み込んだ画像・動画を入れる
  function hydrateMedia(root) {

      const id = el.dataset.mediaSrc;
      Media.url(id).then(u => {

        const box = el.closest('.media-loading');
        if (box) box.classList.remove('media-loading');
      }, () => {
        const host = el.closest('.step-img, .media-loading, .ed-thumb') || el;
        host.outerHTML = `<div class="img-missing">${svg('image')}画像・動画を読み込めませんでした</div>`;
      });
    });
  }

  function deviceLabel() {

  async function loadShared() {
    const d = await callApi('getAll', tok());
    state.role = d.role;
    state.meInfo = d.me || null;

    state.staff = d.me ? [d.me] : [];
    state.manuals = d.manuals || [];

    state.hasAdminPin = !!d.hasAdminPin;

    if (REMOTE && !d.initialized) {
      await callApi('initialize', clone(DEFAULT_MANUALS));
      state.manuals = clone(DEFAULT_MANUALS);
    }
    state.ready = true;
  }
  async function loadAdmin() {
    const d = await callApi('adminData', session.adminToken);
    state.staff = d.staff || [];
    state.progress = d.progress || {};
    state.adminLoaded = true;
  }

  // 利用停止・期限切れ・ログアウト：画面の中身を消してログイン画面へ
  function lockOut(msg) {
    state.token = '';
    savePersonal();
    session.adminToken = '';
    session.editPin = '';
    saveAdminToken();
    editing = null;
    Object.assign(state, { ready: false, role: '', me: '', meInfo: null, adminLoaded: false, manuals: [], staff: [], progress: {} });
    closeSheet();
    renderLogin(msg);
  }
  function logoutNow() {
    [state.token, session.adminToken].filter(Boolean).forEach(t => callApi('logout', t).catch(() => { /* 期限切れでも続行 */ }));

  const setSignedOut = on => document.body.classList.toggle('signed-out', on);

  function renderLogin(msg) {
    setSignedOut(true);
    view.innerHTML = `
      <div class="gate">

        <p class="muted" style="margin:0">管理者から受け取った、6桁のログインコードを入力してください。</p>
        <label for="loginCode" class="sr-only">ログインコード</label>
        <input id="loginCode" class="pin-input" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
        <p class="err" id="loginErr"></p>
        <button class="btn primary" id="loginOk">${svg('unlock')}ログイン</button>
        ${REMOTE ? '' : `<div class="demo-note" style="text-align:left">${svg('info')}<span>体験モード用のコード：${SAMPLE_STAFF.filter(s => s.code).map(s => `${esc(s.name)} <b>${s.code}</b>`).join('、')}</span></div>`}
        <details class="admin-login">
          <summary>管理者の方はこちら</summary>

    const code = $('#loginCode'), err = $('#loginErr');

    code.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

    $('.admin-login').addEventListener('toggle', function onToggle() {
      if (!this.open || this.dataset.loaded) return;
      this.dataset.loaded = '1';
      callApi('status').then(st => {
        const setup = !st.hasAdminPin;
        $('#adminLoginBox').innerHTML = `
          <span class="muted" style="font-size:.84rem">${setup ? 'はじめに、管理者用の4桁の暗証番号を決めてください。' : '管理者用の4桁の暗証番号を入力してください。'}</span>
          <label for="aPin" class="sr-only">暗証番号</label>
          <input id="aPin" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="${setup ? '新しい暗証番号' : ''}">
          ${setup ? '<label for="aPin2" class="sr-only">もう一度</label><input id="aPin2" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="もう一度">' : ''}
          <p class="err" id="aErr"></p>
          <button class="btn" id="aOk">${svg('shield')}${setup ? '設定して管理者ページを開く' : '管理者ページを開く'}</button>`;

            pin.value = '';

        $('#aOk').addEventListener('click', goAdmin);

    });
  }

  /* ================= ユーティリティ ================= */
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const getManual = id => state.manuals.find(m => m.id === id);
  const getStaff = id => state.staff.find(s => s.id === id) || (state.meInfo && state.meInfo.id === id ? state.meInfo : null);
  const activeStaff = () => state.staff.filter(s => s.active !== false);
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fmtDate = s => { const p = String(s || '').split('-'); return p.length === 3 ? `${+p[0]}年${+p[1]}月${+p[2]}日` : ''; };
  const fmtShort = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}月${d.getDate()}日`; };
  const view = $('#view');

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return safe.replace(re, m => `<mark>${m}</mark>`);
  }

  /* ================= 進み具合の計算 ================= */
  const recOf = (sid, mid) => (sid && state.progress[sid] && state.progress[sid][mid]) || null;
  const doneOf = (sid, m) => { const r = recOf(sid, m.id); return r ? (r.done || []).filter(i => i < m.steps.length).length : 0; };
  // 完了 / 要再確認（完了後にマニュアルが改訂された） / 途中 / 未着手
  function statusOf(sid, m) {
    const r = recOf(sid, m.id);
    if (r && r.completedAt) return (m.reviewFrom && r.completedAt < m.reviewFrom) ? 'review' : 'done';
    return r && doneOf(sid, m) ? 'doing' : 'none';
  }
  const STATUS = { done: '完了', review: '要再確認', doing: '途中', none: '未着手' };
  const stPill = st => `<span class="st st-${st}">${STATUS[st]}</span>`;
  function staffSummary(sid) {
    const c = { done: 0, review: 0, doing: 0, none: 0 };
    let last = '';
    state.manuals.forEach(m => {
      c[statusOf(sid, m)]++;
      const r = recOf(sid, m.id);
      if (r && r.updatedAt > last) last = r.updatedAt;
    });
    const total = state.manuals.length;
    return { ...c, total, last, rate: total ? Math.round(c.done / total * 100) : 0 };
  }
  function manualSummary(m) {
    const c = { done: 0, review: 0, doing: 0, none: 0 };
    const list = activeStaff();
    list.forEach(s => c[statusOf(s.id, m)]++);
    return { ...c, total: list.length };
  }
  function stackHTML(c, total) {
    if (!total) return '<div class="stack"></div>';
    const seg = k => c[k] ? `<i class="s-${k}" style="width:${c[k] / total * 100}%"></i>` : '';
    return `<div class="stack" role="img" aria-label="完了${c.done}・要再確認${c.review}・途中${c.doing}・未着手${c.none}">${seg('done')}${seg('review')}${seg('doing')}</div>`;
  }
  const legendHTML = () => `<div class="legend"><span><i style="background:var(--ok)"></i>完了</span><span><i style="background:var(--warn-ink);opacity:.75"></i>要再確認</span><span><i style="background:var(--accent)"></i>途中</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>未着手</span></div>`;

  const AV_TONES = ['reception', 'assist', 'steril', 'open', 'patient', 'rules', 'material'];
  function avatarHTML(s, cls) {
    if (!s) return `<span class="avatar empty ${cls || ''}">?</span>`;
    let h = 0;
    for (const ch of s.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const tone = AV_TONES[h % AV_TONES.length];
    return `<span class="avatar ${cls || ''}" style="--av-bg: var(--c-${tone}); --av-ink: var(--c-${tone}-ink)">${esc((s.name || '?').trim().charAt(0))}</span>`;
  }

  function itemHTML(m, q) {
    const c = catById(m.cat);
    const done = doneOf(state.me, m);
    const st = state.me ? statusOf(state.me, m) : 'none';
    const pct = m.steps.length ? Math.round(done / m.steps.length * 100) : 0;
    let sub = m.summary;
    if (q) {
      const hit = m.steps.find(s => [s.h, s.t, s.say, s.tip, s.warn].filter(Boolean).join(' ').toLowerCase().includes(q.toLowerCase()));
      if (hit && !m.title.toLowerCase().includes(q.toLowerCase())) sub = hit.t;
    }
    return `<a class="item" href="#m-${esc(m.id)}" style="${catStyle(c.id)}">
      <span class="item-icon">${svg(c.id)}</span>
      <span class="item-body">
        <span class="item-title">${highlight(m.title, q)}</span>
        <span class="item-sub">${highlight(sub, q)}</span>
        <span class="item-meta">
          <span>${esc(c.name)}</span>
          <span>${svg('clock')}約${esc(m.minutes || 5)}分</span>
          <span>${m.steps.length}ステップ</span>
          ${st === 'done' || st === 'review' ? stPill(st) : ''}
          ${done ? `<span><span class="progress-mini"><i style="width:${pct}%"></i></span>${done}/${m.steps.length}</span>` : ''}
        </span>
      </span>
      ${svg('chev', 'chev')}
    </a>`;
  }

  function emptyHTML(icon, text) {
    return `<div class="empty">${svg(icon)}<div>${text}</div></div>`;
  }

  /* ================= ログイン中の人 ================= */
  function openAccount() {
    const me = state.meInfo;

      <div class="sheet-head"><h2>ログイン中</h2><button class="icon-btn" data-close aria-label="閉じる">${svg('x')}</button></div>

        <div><b>${me ? esc(me.name) : '管理者'}</b><br><span class="muted" style="font-size:.84rem">${me ? esc(me.role || '') : 'スタッフとしてはログインしていません'}</span></div></div>
      <p class="muted" style="margin:0;font-size:.84rem">共用の端末では、使い終わったらログアウトしてください。次の人は、自分のログインコードでログインします。</p>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn" data-close>閉じる</button>

  $('#whoBtn').addEventListener('click', openAccount);
  function needMe() {

  /* ================= 画面: ホーム ================= */
  function renderHome() {

    const h = now.getHours();

    const sum = me ? staffSummary(me.id) : null;

    view.innerHTML = `
      <section class="hello">
        <div class="hello-date">${now.getMonth() + 1}月${now.getDate()}日（${wd}）</div>
        <h1>${me ? esc(me.name.split(/\s/)[0]) + 'さん、' : ''}${greet}</h1>

        <div class="hello-stats">

        </div>
      </section>

      <a class="sos" href="#cat-emergency" style="${catStyle('emergency')}">
        <span class="sos-icon">${svg('emergency')}</span>

        ${svg('chev', 'chev')}
      </a>

      <section>
        <div class="section-head"><h2>あなたの進み具合</h2>${me ? '<a href="#mine">くわしく見る</a>' : ''}</div>
        ${me ? `<a class="mine-card" href="#mine">
            <span class="mine-top">${avatarHTML(me)}<span><b>${esc(me.name)}</b><br><span class="muted" style="font-size:.8rem">${esc(me.role || '')}</span></span><span class="rate">${sum.rate}%</span></span>
            ${stackHTML(sum, sum.total)}
            <span class="row-stats"><span>完了 ${sum.done}/${sum.total}</span><span>途中 ${sum.doing}</span>${sum.review ? `<span style="color:var(--warn-ink);font-weight:700">要再確認 ${sum.review}</span>` : ''}<span>未着手 ${sum.none}</span></span>
          </a>`
          : `<div class="empty">${svg('shield')}<div>管理者としてログインしています。進み具合は記録されません</div><a class="btn primary" href="#admin" style="margin-top:10px">管理者ページへ</a></div>`}
      </section>

      <section>
        <div class="section-head"><h2>カテゴリから探す</h2></div>
        <div class="cat-grid">
          ${CATEGORIES.map(c => `
            <a class="cat" href="#cat-${c.id}" style="${catStyle(c.id)}">
              <span class="cat-icon">${svg(c.id)}</span>
              <span><span class="cat-name">${esc(c.name)}</span><br><span class="cat-count">${state.manuals.filter(m => m.cat === c.id).length}件</span></span>
            </a>`).join('')}
        </div>
      </section>

      <section>
        <div class="section-head"><h2>お気に入り</h2>${favs.length ? '<a href="#fav">すべて見る</a>' : ''}</div>
        ${favs.length ? `<div class="list">${favs.slice(0, 3).map(m => itemHTML(m)).join('')}</div>`
          : emptyHTML('heart', 'よく使うマニュアルの「お気に入り」を押すと、ここに表示されます')}
      </section>

      ${recent.length ? `<section>
        <div class="section-head"><h2>最近見たマニュアル</h2></div>
        <div class="list">${recent.map(m => itemHTML(m)).join('')}</div>
      </section>` : ''}

      <section>
        <div class="section-head"><h2>最近更新されたマニュアル</h2><a href="#all">一覧へ</a></div>
        <div class="list">${latest.map(m => itemHTML(m)).join('')}</div>
      </section>
    `;
  }

  /* ================= 画面: 一覧 / カテゴリ ================= */
  let listFilter = 'all';
  function renderList(catId) {
    listFilter = catId || 'all';
    const items = state.manuals.filter(m => listFilter === 'all' || m.cat === listFilter);
    const c = listFilter !== 'all' ? catById(listFilter) : null;
    view.innerHTML = `
      <section>
        <div class="section-head"><h2>${c ? esc(c.name) : 'すべてのマニュアル'}</h2><span class="muted" style="font-size:.85rem">${items.length}件</span></div>

        </div>

  /* ================= 画面: 検索 ================= */
  function renderSearch(q) {

      const hay = [m.title, m.summary, catById(m.cat).name, ...(m.tags || []), ...m.steps.map(s => [s.h, s.t, s.say, s.tip, s.warn].filter(Boolean).join(' '))].join(' ').toLowerCase();
      return hay.includes(ql);
    });

      <section>
        <div class="section-head"><h2>「${esc(q)}」の検索結果</h2><span class="muted" style="font-size:.85rem">${hits.length}件</span></div>
        ${hits.length ? `<div class="list">${hits.map(m => itemHTML(m, q)).join('')}</div>`
          : emptyHTML('search', '見つかりませんでした。<br>別のことば（例：「予約」「消毒」）で試してみてください')}
      </section>`;
  }

    state.recent = [id, ...state.recent.filter(x => x !== id)].slice(0, 8);
    savePersonal();
    const c = catById(m.cat);
    const isFav = state.favs.includes(id);
    const st = state.me ? statusOf(state.me, m) : 'none';
    const rec = recOf(state.me, id);

    view.innerHTML = `
      <div style="${catStyle(c.id)};display:flex;flex-direction:column;gap:18px">

        <header class="detail-head">
          <span class="tag">${svg(c.id)}${esc(c.name)}</span>

          ${m.summary ? `<p class="summary">${esc(m.summary)}</p>` : ''}
          <div class="meta-row">
