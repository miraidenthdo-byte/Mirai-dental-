<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みらい歯科 院内マニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Yusei+Magic&display=swap">
<style>
/* Layout: 上部に検索バー、中央に1カラムのコンテンツ（最大960px）、下部にタブバー。カードは役割があるものだけに使う */
:root {
  --bg: #FFF6F8;
  --surface: #FFFFFF;
  --surface-2: #FFEEF3;
  --ink: #4A3036;
  --ink-soft: #85666E;
  --line: #F5D7E0;
  --accent: #F7A8C0;
  --accent-soft: #FFDCE6;
  --accent-ink: #B23F66;
  --warn-bg: #FFE5DF;
  --warn-ink: #A8402E;
  --ok: #5BAE8C;
  --shadow: 0 6px 20px rgba(214, 120, 150, .14);

  --c-reception: #FFD9E3; --c-reception-ink: #B5476E;
  --c-assist: #E8E0FB;    --c-assist-ink: #6A55B0;
  --c-steril: #D6F1E7;    --c-steril-ink: #2F8466;
  --c-emergency: #FFDCD5; --c-emergency-ink: #B4442F;
  --c-open: #FFF1CC;      --c-open-ink: #9A7414;
  --c-patient: #FFE5D3;   --c-patient-ink: #B0602A;
  --c-rules: #DAEDFB;     --c-rules-ink: #2F6E9E;
  --c-material: #F4E2F6;  --c-material-ink: #924A9C;

  --font-display: "Yusei Magic", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;

  --radius: 18px;
  --radius-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #251A1E; --surface: #32242A; --surface-2: #3D2B32; --ink: #FBEAEF; --ink-soft: #CFAFB8;
    --line: #4E3940; --accent: #F2A0BA; --accent-soft: #5A3442; --accent-ink: #FFB6CC;
    --warn-bg: #4A2A25; --warn-ink: #FFB4A3; --ok: #7CCBA9; --shadow: 0 6px 20px rgba(0,0,0,.3);
    --c-reception: #4E2C38; --c-reception-ink: #FFB3C9;
    --c-assist: #3A3352;    --c-assist-ink: #C9BBFF;
    --c-steril: #24433A;    --c-steril-ink: #93E0C2;
    --c-emergency: #4E2C26; --c-emergency-ink: #FFB2A2;
    --c-open: #463A1E;      --c-open-ink: #F3D27A;
    --c-patient: #4A3326;   --c-patient-ink: #FFC39C;
    --c-rules: #233B4E;     --c-rules-ink: #9FCFF5;
    --c-material: #452D4A;  --c-material-ink: #EAB3F2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #251A1E; --surface: #32242A; --surface-2: #3D2B32; --ink: #FBEAEF; --ink-soft: #CFAFB8;
  --line: #4E3940; --accent: #F2A0BA; --accent-soft: #5A3442; --accent-ink: #FFB6CC;
  --warn-bg: #4A2A25; --warn-ink: #FFB4A3; --ok: #7CCBA9; --shadow: 0 6px 20px rgba(0,0,0,.3);
  --c-reception: #4E2C38; --c-reception-ink: #FFB3C9;
  --c-assist: #3A3352;    --c-assist-ink: #C9BBFF;
  --c-steril: #24433A;    --c-steril-ink: #93E0C2;
  --c-emergency: #4E2C26; --c-emergency-ink: #FFB2A2;
  --c-open: #463A1E;      --c-open-ink: #F3D27A;
  --c-patient: #4A3326;   --c-patient-ink: #FFC39C;
  --c-rules: #233B4E;     --c-rules-ink: #9FCFF5;
  --c-material: #452D4A;  --c-material-ink: #EAB3F2;
  color-scheme: dark;
}
html.large-text { font-size: 112.5%; }
html, body { margin: 0; }
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.4; margin: 0; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { max-width: 960px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand-text { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.1; }
.brand-text small { display: block; font-family: var(--font-body); font-size: .68rem; color: var(--ink-soft); letter-spacing: .08em; }
.search { flex: 1; min-width: 0; position: relative; }
.search input {
  width: 100%; height: 44px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); padding: 0 16px 0 42px; font-size: .95rem;
}
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: var(--ink-soft);
  display: grid; place-items: center; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--accent-ink); }
@media (max-width: 520px) { .brand-text { display: none; } }

/* ---------- Main ---------- */
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.section-head a, .link-btn { color: var(--accent-ink); font-size: .88rem; text-decoration: none; background: none; border: none; padding: 0; }
.muted { color: var(--ink-soft); }

/* Greeting */
.hello {
  position: relative; overflow: hidden;
  background: var(--surface-2);
  border-radius: 24px; padding: 22px 22px 20px;
}
.hello::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, var(--accent-soft), transparent 70%);
  pointer-events: none;
}
.hello-date { font-size: .85rem; color: var(--ink-soft); letter-spacing: .04em; }
.hello h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.5rem, 4.5vw, 2rem); margin: 4px 0 6px; color: var(--ink); }
.hello p { margin: 0; color: var(--ink-soft); font-size: .92rem; position: relative; z-index: 1; }
.hello-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--surface); font-size: .82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.pill b { color: var(--accent-ink); font-weight: 700; }

/* Emergency banner */
.sos {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--radius);
  background: var(--c-emergency); color: var(--c-emergency-ink); text-decoration: none; border: 1.5px solid color-mix(in srgb, var(--c-emergency-ink) 25%, transparent);
}
.sos-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.sos-icon svg { width: 24px; height: 24px; }
.sos strong { display: block; font-size: 1rem; }
.sos span { font-size: .84rem; opacity: .9; }
.sos .chev { margin-left: auto; }

/* Category grid */
.cat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cat {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: var(--radius);
  background: var(--cat-bg); color: var(--ink); text-decoration: none; border: none; text-align: left;
  transition: transform .15s ease, box-shadow .15s ease;
}
.cat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.cat-icon { width: 42px; height: 42px; border-radius: 14px; background: var(--surface); color: var(--cat-ink); display: grid; place-items: center; }
.cat-icon svg { width: 24px; height: 24px; }
.cat-name { font-weight: 700; font-size: .98rem; line-height: 1.3; }
.cat-count { font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* Manual list */
.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.item:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.item-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--cat-bg); color: var(--cat-ink); display: grid; place-items: center; flex: none; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-weight: 700; font-size: 1rem; line-height: 1.45; }
.item-sub { font-size: .84rem; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .76rem; color: var(--ink-soft); margin-top: 2px; font-variant-numeric: tabular-nums; }
.item-meta span { display: inline-flex; align-items: center; gap: 4px; }
.item-meta svg { width: 14px; height: 14px; }
.item .chev { color: var(--ink-soft); }
.progress-mini { width: 54px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; }
.progress-mini i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
mark { background: var(--accent-soft); color: var(--ink); border-radius: 4px; padding: 0 2px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .86rem;
  color: var(--ink-soft); white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

.empty {
  text-align: center; padding: 28px 20px; border-radius: var(--radius); border: 2px dashed var(--line); color: var(--ink-soft); font-size: .92rem;
}
.empty svg { width: 34px; height: 34px; color: var(--accent); margin-bottom: 6px; }

/* ---------- Detail ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-soft); background: none; border: none; padding: 6px 8px 6px 0; font-size: .92rem; text-decoration: none; }
.back:hover { color: var(--accent-ink); }
.detail-head { display: flex; flex-direction: column; gap: 10px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; background: var(--cat-bg); color: var(--cat-ink); font-size: .82rem; font-weight: 700; align-self: flex-start; }
.tag svg { width: 16px; height: 16px; }
.detail-head h1 { font-size: clamp(1.4rem, 4vw, 1.85rem); font-weight: 700; }
.detail-head .summary { margin: 0; color: var(--ink-soft); max-width: 65ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meta-row span { display: inline-flex; align-items: center; gap: 5px; }
.meta-row svg { width: 16px; height: 16px; }
.keywords { display: flex; flex-wrap: wrap; gap: 6px; }
.keywords span { font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: .92rem; font-weight: 500; text-decoration: none;
}
.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #3E2229; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.04); color: #3E2229; }
.btn.danger { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn-ink) 35%, transparent); }
.btn.faved { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.btn.faved svg { fill: currentColor; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .84rem; }

.progress {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 65px); z-index: 10;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px;
  display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow);
}
.progress-bar { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: inherit; transition: width .3s ease; }
.progress-label { font-size: .86rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress.done .progress-label { color: var(--ok); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: step; }
.step {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 16px; border-radius: var(--radius);
  background: var(--surface); border: 1.5px solid var(--line); transition: background .2s ease, border-color .2s ease;
}
.step-check {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 0;
}
.step-check svg { display: none; width: 22px; height: 22px; stroke-width: 2.6; }
.step.done { background: color-mix(in srgb, var(--ok) 9%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.step.done .step-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.done .step-check span { display: none; }
.step.done .step-check svg { display: block; }
.step.done .step-text { color: var(--ink-soft); }
.step-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 7px; }
.step-text { margin: 0; font-size: 1rem; white-space: pre-wrap; }
.note { display: flex; gap: 8px; padding: 10px 12px; border-radius: var(--radius-sm); font-size: .88rem; line-height: 1.65; }
.note svg { margin-top: 2px; }
.note b { flex: none; }
.note.tip { background: var(--accent-soft); color: var(--ink); }
.note.tip svg, .note.tip b { color: var(--accent-ink); }
.note.warn { background: var(--warn-bg); color: var(--ink); }
.note.warn svg, .note.warn b { color: var(--warn-ink); }
.complete {
  text-align: center; padding: 22px; border-radius: var(--radius); background: color-mix(in srgb, var(--ok) 12%, var(--surface));
  color: var(--ink);
}
.complete strong { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; display: block; color: var(--ok); }

/* ---------- Form ---------- */
.form { display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .label { font-weight: 700; font-size: .9rem; }
.field .hint { font-size: .78rem; color: var(--ink-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
input[type="text"], input[type="number"], select, textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; min-height: 44px;
}
textarea { resize: vertical; min-height: 72px; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.step-edit { padding: 14px; border-radius: var(--radius); background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.step-edit-head { display: flex; align-items: center; gap: 8px; }
.step-edit-head .num { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #3E2229; display: grid; place-items: center; font-weight: 700; font-size: .88rem; }
.step-edit-head .tools { margin-left: auto; display: flex; gap: 2px; }
.step-edit-head .tools button { width: 36px; height: 36px; }
.note-row { display: grid; grid-template-columns: 140px 1fr; gap: 8px; }
@media (max-width: 520px) { .note-row { grid-template-columns: 1fr; } }
.form-foot { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; padding-top: 6px; }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 8px; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 10px; text-decoration: none; color: var(--ink-soft); font-size: .72rem;
  position: relative;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent-ink); font-weight: 700; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 4px 4px; background: var(--accent); }
.tab.add .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #3E2229; display: grid; place-items: center; margin-top: -2px; }
.tab.add .plus svg { width: 20px; height: 20px; stroke-width: 2.4; }

/* ---------- Sheet / Toast ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(60, 30, 40, .35); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
@media (min-width: 640px) { .overlay { align-items: center; } }
.sheet {
  width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto; background: var(--surface); border-radius: 24px; padding: 22px 20px;
  display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.2);
  margin-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet h2 { font-size: 1.15rem; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; }
.setting { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.setting-title { font-weight: 700; font-size: .92rem; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; align-self: flex-start; }
.seg button { border: none; background: transparent; border-radius: 999px; padding: 6px 16px; color: var(--ink-soft); font-size: .88rem; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent-ink); font-weight: 700; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.sheet textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .76rem; min-height: 120px; }
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 999px; font-size: .9rem; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="topbar">

  /* ================= 保存（端末ごと） ================= */
  const KEY = 'mirai-manual-v1';
  const store = {
    load() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
    },
    save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 保存不可の環境では何もしない */ }
    }
  };
  const saved = store.load();
  const state = {
    manuals: Array.isArray(saved.manuals) ? saved.manuals : JSON.parse(JSON.stringify(DEFAULT_MANUALS)),
    favs: Array.isArray(saved.favs) ? saved.favs : ['m10', 'm8'],
    recent: Array.isArray(saved.recent) ? saved.recent : ['m1', 'm2'],
    checks: saved.checks && typeof saved.checks === 'object' ? saved.checks : {},
    largeText: !!saved.largeText
  };
  document.documentElement.classList.toggle('large-text', state.largeText);

  /* ================= ユーティリティ ================= */
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const getManual = id => state.manuals.find(m => m.id === id);
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fmtDate = s => { const p = String(s || '').split('-'); return p.length === 3 ? `${+p[0]}年${+p[1]}月${+p[2]}日` : ''; };
  const doneCount = m => (state.checks[m.id] || []).filter(i => i < m.steps.length).length;
  const view = $('#view');

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return safe.replace(re, m => `<mark>${m}</mark>`);
  }

  function itemHTML(m, q) {
    const c = catById(m.cat);
    const done = doneCount(m);
    const pct = m.steps.length ? Math.round(done / m.steps.length * 100) : 0;
    let sub = m.summary;
    if (q) {
      const hit = m.steps.find(s => (s.t + (s.tip || '') + (s.warn || '')).toLowerCase().includes(q.toLowerCase()));
      if (hit && !m.title.toLowerCase().includes(q.toLowerCase())) sub = hit.t;
    }
    return `<a class="item" href="#m-${esc(m.id)}" style="${catStyle(c.id)}">
      <span class="item-icon">${svg(c.id)}</span>
      <span class="item-body">
        <span class="item-title">${highlight(m.title, q)}</span>
        <span class="item-sub">${highlight(sub, q)}</span>
        <span class="item-meta">
          <span>${esc(c.name)}</span>
          <span>${svg('clock')}約${esc(m.minutes || 5)}分</span>
          <span>${m.steps.length}ステップ</span>
          ${done ? `<span><span class="progress-mini"><i style="width:${pct}%"></i></span>${done}/${m.steps.length}</span>` : ''}
        </span>
      </span>
      ${svg('chev', 'chev')}
    </a>`;
  }

  function emptyHTML(icon, text) {
    return `<div class="empty">${svg(icon)}<div>${text}</div></div>`;
  }

  /* ================= 画面: ホーム ================= */
  function renderHome() {
    const now = new Date();
    const h = now.getHours();
    const greet = h < 11 ? 'おはようございます' : h < 17 ? 'こんにちは' : 'おつかれさまです';
    const wd = '日月火水木金土'[now.getDay()];
    const favs = state.favs.map(getManual).filter(Boolean);
    const recent = state.recent.map(getManual).filter(Boolean).slice(0, 4);
    const latest = [...state.manuals].sort((a, b) => String(b.updated).localeCompare(String(a.updated))).slice(0, 3);

    view.innerHTML = `
      <section class="hello">
        <div class="hello-date">${now.getMonth() + 1}月${now.getDate()}日（${wd}）</div>
        <h1>${greet}</h1>
        <p>迷ったときは、ここで手順を確認しましょう。</p>
        <div class="hello-stats">
          <span class="pill">マニュアル <b>${state.manuals.length}</b> 件</span>
          <span class="pill">お気に入り <b>${favs.length}</b> 件</span>
        </div>
      </section>

      <a class="sos" href="#cat-emergency" style="${catStyle('emergency')}">
        <span class="sos-icon">${svg('emergency')}</span>
        <span><strong>緊急時の対応はこちら</strong><span>気分不良・針刺し事故などの手順</span></span>
        ${svg('chev', 'chev')}
      </a>

      <section>
        <div class="section-head"><h2>カテゴリから探す</h2></div>
        <div class="cat-grid">
          ${CATEGORIES.map(c => `
            <a class="cat" href="#cat-${c.id}" style="${catStyle(c.id)}">
              <span class="cat-icon">${svg(c.id)}</span>
              <span><span class="cat-name">${esc(c.name)}</span><br><span class="cat-count">${state.manuals.filter(m => m.cat === c.id).length}件</span></span>
            </a>`).join('')}
        </div>
      </section>

      <section>
        <div class="section-head"><h2>お気に入り</h2>${favs.length ? '<a href="#fav">すべて見る</a>' : ''}</div>
        ${favs.length ? `<div class="list">${favs.slice(0, 3).map(m => itemHTML(m)).join('')}</div>`
          : emptyHTML('heart', 'よく使うマニュアルの「お気に入り」を押すと、ここに表示されます')}
      </section>

      ${recent.length ? `<section>
        <div class="section-head"><h2>最近見たマニュアル</h2></div>
        <div class="list">${recent.map(m => itemHTML(m)).join('')}</div>
      </section>` : ''}

      <section>
        <div class="section-head"><h2>最近更新されたマニュアル</h2><a href="#all">一覧へ</a></div>
        <div class="list">${latest.map(m => itemHTML(m)).join('')}</div>
      </section>
    `;
  }

  /* ================= 画面: 一覧 / カテゴリ ================= */
  let listFilter = 'all';
  function renderList(catId) {
    if (catId) listFilter = catId;
    else if (!catId && location.hash === '#all') listFilter = listFilter || 'all';
    const items = state.manuals.filter(m => listFilter === 'all' || m.cat === listFilter);
    const c = listFilter !== 'all' ? catById(listFilter) : null;
    view.innerHTML = `
      <section>
        <div class="section-head"><h2>${c ? esc(c.name) : 'すべてのマニュアル'}</h2><span class="muted" style="font-size:.85rem">${items.length}件</span></div>
        ${c ? `<p class="muted" style="margin:-6px 0 14px;font-size:.9rem">${esc(c.desc)}</p>` : ''}
        <div class="chips" role="group" aria-label="カテゴリで絞り込む">
          <button class="chip" data-filter="all" aria-pressed="${listFilter === 'all'}">すべて</button>
          ${CATEGORIES.map(x => `<button class="chip" data-filter="${x.id}" aria-pressed="${listFilter === x.id}">${esc(x.name)}</button>`).join('')}
        </div>
      </section>
      <div class="list">
        ${items.length ? items.map(m => itemHTML(m)).join('') : emptyHTML('plus', 'このカテゴリにはまだマニュアルがありません。<br>下の「追加」から作成できます')}
      </div>
    `;
    view.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
      listFilter = b.dataset.filter;
      const target = listFilter === 'all' ? '#all' : `#cat-${listFilter}`;
      if (location.hash !== target) history.replaceState(null, '', target);
      renderList(listFilter === 'all' ? null : listFilter);
      setTab();
    }));
  }

  /* ================= 画面: お気に入り ================= */
  function renderFav() {
    const favs = state.favs.map(getManual).filter(Boolean);
    view.innerHTML = `
      <section>
        <div class="section-head"><h2>お気に入り</h2><span class="muted" style="font-size:.85rem">${favs.length}件</span></div>
        ${favs.length ? `<div class="list">${favs.map(m => itemHTML(m)).join('')}</div>`
          : emptyHTML('heart', 'まだお気に入りがありません。<br>マニュアルを開いて「お気に入り」を押してください')}
      </section>`;
  }

  /* ================= 画面: 検索 ================= */
  function renderSearch(q) {
    const ql = q.toLowerCase();
    const hits = state.manuals.filter(m => {
      const hay = [m.title, m.summary, catById(m.cat).name, ...(m.tags || []), ...m.steps.map(s => s.t + ' ' + (s.tip || '') + ' ' + (s.warn || ''))].join(' ').toLowerCase();
      return hay.includes(ql);
    });
    view.innerHTML = `
      <section>
        <div class="section-head"><h2>「${esc(q)}」の検索結果</h2><span class="muted" style="font-size:.85rem">${hits.length}件</span></div>
        ${hits.length ? `<div class="list">${hits.map(m => itemHTML(m, q)).join('')}</div>`
          : emptyHTML('search', '見つかりませんでした。<br>別のことば（例：「予約」「消毒」）で試してみてください')}
      </section>`;
  }

  /* ================= 画面: マニュアル詳細 ================= */
  function renderDetail(id) {
    const m = getManual(id);
    if (!m) { view.innerHTML = emptyHTML('search', 'マニュアルが見つかりませんでした。<br><a href="#home">ホームへ戻る</a>'); return; }
    state.recent = [id, ...state.recent.filter(x => x !== id)].slice(0, 8);
    store.save();
    const c = catById(m.cat);
    const isFav = state.favs.includes(id);

    view.innerHTML = `
      <div style="${catStyle(c.id)};display:flex;flex-direction:column;gap:18px">
        <div><a class="back" href="#cat-${c.id}">${svg('back')}${esc(c.name)}へ戻る</a></div>
        <header class="detail-head">
          <span class="tag">${svg(c.id)}${esc(c.name)}</span>
          <h1>${esc(m.title)}</h1>
          ${m.summary ? `<p class="summary">${esc(m.summary)}</p>` : ''}
          <div class="meta-row">
            <span>${svg('clock')}所要時間 約${esc(m.minutes || 5)}分</span>
            <span>${svg('cal')}${fmtDate(m.updated)} 更新</span>
            ${m.author ? `<span>${svg('user')}${esc(m.author)}</span>` : ''}
          </div>
          ${(m.tags || []).length ? `<div class="keywords">${m.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
        </header>
        <div class="actions">
          <button class="btn ${isFav ? 'faved' : ''}" id="favBtn" aria-pressed="${isFav}">${svg('heart')}${isFav ? 'お気に入り済み' : 'お気に入り'}</button>
          <button class="btn" id="resetBtn">${svg('reset')}チェックをリセット</button>
          <a class="btn" href="#edit-${esc(m.id)}">${svg('pen')}編集</a>
        </div>
        <div class="progress" id="progress">
          <div class="progress-bar"><i id="progressFill"></i></div>
          <span class="progress-label" id="progressLabel"></span>
        </div>
        <ol class="steps">
          ${m.steps.map((s, i) => `
            <li class="step" data-i="${i}">
              <button class="step-check" aria-label="ステップ${i + 1}を完了にする" aria-pressed="false"><span>${i + 1}</span>${svg('check')}</button>
              <div class="step-body">
                <p class="step-text">${esc(s.t)}</p>
                ${s.tip ? `<div class="note tip">${svg('bulb')}<b>ポイント</b><span>${esc(s.tip)}</span></div>` : ''}
                ${s.warn ? `<div class="note warn">${svg('alert')}<b>注意</b><span>${esc(s.warn)}</span></div>` : ''}
              </div>
            </li>`).join('')}
        </ol>
        <div class="complete" id="complete" hidden><strong>すべて完了しました</strong><span class="muted">おつかれさまでした。次の作業も確認しましょう。</span></div>
      </div>`;

    const updateProgress = () => {
      const set = new Set(state.checks[id] || []);
      view.querySelectorAll('.step').forEach(li => {
        const on = set.has(+li.dataset.i);
        li.classList.toggle('done', on);
        li.querySelector('.step-check').setAttribute('aria-pressed', on);
      });
      const n = doneCount(m), total = m.steps.length;
      $('#progressFill').style.width = (total ? n / total * 100 : 0) + '%';
      $('#progressLabel').textContent = `${n} / ${total} 完了`;
      $('#progress').classList.toggle('done', total > 0 && n === total);
      $('#complete').hidden = !(total > 0 && n === total);
    };
    updateProgress();

    view.querySelectorAll('.step-check').forEach(b => b.addEventListener('click', () => {
      const i = +b.closest('.step').dataset.i;
      const set = new Set(state.checks[id] || []);
      set.has(i) ? set.delete(i) : set.add(i);
      state.checks[id] = [...set];
      store.save();
      updateProgress();
      if (doneCount(m) === m.steps.length) toast('すべてのステップが完了しました');
    }));
    $('#favBtn').addEventListener('click', () => {
      const on = state.favs.includes(id);
      state.favs = on ? state.favs.filter(x => x !== id) : [id, ...state.favs];
      store.save();
      toast(on ? 'お気に入りから外しました' : 'お気に入りに追加しました');
      renderDetail(id);
    });
    $('#resetBtn').addEventListener('click', () => {
      delete state.checks[id];
      store.save();
      updateProgress();
      toast('チェックをリセットしました');
    });
  }

  /* ================= 画面: 作成・編集 ================= */

      author: '', tags: [], steps: [{ t: '' }, { t: '' }, { t: '' }]

            </div>
          </div>
          <div class="field">
            <span class="label">手順</span>
            <div id="stepsEdit" style="display:flex;flex-direction:column;gap:10px">${stepsHTML()}</div>
            <button type="button" class="btn" id="addStep" style="align-self:flex-start">${svg('plus')}ステップを追加</button>
          </div>
          <div class="form-foot">
            ${orig ? `<button type="button" class="btn danger" id="delBtn">${svg('trash')}削除する</button>` : '<span></span>'}
            <button type="submit" class="btn primary">${svg('check')}保存する</button>
          </div>
        </form>
      </section>`;

    const stepsEl = $('#stepsEdit');
    const collect = () => {
      stepsEl.querySelectorAll('.step-edit').forEach(box => {
        const i = +box.dataset.i;
        const kind = box.querySelector('[data-f="kind"]').value;
        const note = box.querySelector('[data-f="note"]').value.trim();
        const s = { t: box.querySelector('[data-f="t"]').value };
        if (kind === 'tip' && note) s.tip = note;
        if (kind === 'warn' && note) s.warn = note;
        draft.steps[i] = s;
      });
    };
    const redrawSteps = () => { stepsEl.innerHTML = stepsHTML(); };

    stepsEl.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      collect();
      const i = +b.closest('.step-edit').dataset.i;
      const act = b.dataset.act;
      if (act === 'up' && i > 0) [draft.steps[i - 1], draft.steps[i]] = [draft.steps[i], draft.steps[i - 1]];
      if (act === 'down' && i < draft.steps.length - 1) [draft.steps[i + 1], draft.steps[i]] = [draft.steps[i], draft.steps[i + 1]];
      if (act === 'del') { draft.steps.splice(i, 1); if (!draft.steps.length) draft.steps.push({ t: '' }); }
      redrawSteps();
    });
    stepsEl.addEventListener('change', e => {
      if (e.target.dataset.f === 'kind') {
        const input = e.target.closest('.note-row').querySelector('[data-f="note"]');
        input.hidden = e.target.value === 'none';
        if (!input.hidden) input.focus();
      }
    });
    $('#addStep').addEventListener('click', () => {
      collect();
      draft.steps.push({ t: '' });
      redrawSteps();
      $(`#st-${draft.steps.length - 1}`).focus();
    });

    $('#form').addEventListener('submit', e => {
      e.preventDefault();
      collect();
      const title = $('#f-title').value.trim();
      if (!title) { toast('タイトルを入力してください'); $('#f-title').focus(); return; }
      const steps = draft.steps.map(s => ({ ...s, t: s.t.trim() })).filter(s => s.t);
      if (!steps.length) { toast('手順を1つ以上入力してください'); $('#st-0').focus(); return; }
      const m = {
        ...draft, title, steps,
        cat: $('#f-cat').value,
        minutes: Math.max(1, Math.min(240, parseInt($('#f-min').value, 10) || 5)),
        summary: $('#f-sum').value.trim(),
        author: $('#f-author').value.trim(),
        tags: $('#f-tags').value.split(/[,、，]/).map(t => t.trim().replace(/^#/, '')).filter(Boolean),
        updated: today()
      };
      if (orig) {
        state.manuals = state.manuals.map(x => x.id === m.id ? m : x);
        if (orig.steps.length !== m.steps.length) delete state.checks[m.id];
      } else {
        state.manuals.unshift(m);
      }
      store.save();
      toast('保存しました');
      location.hash = '#m-' + m.id;
    });

    if (orig) $('#delBtn').addEventListener('click', () => {
      openSheet(`
        <div class="sheet-head"><h2>このマニュアルを削除しますか？</h2></div>
        <p style="margin:0">「${esc(orig.title)}」を削除します。この操作は取り消せません。</p>
        <div class="actions" style="justify-content:flex-end">
          <button class="btn" data-close>やめる</button>
          <button class="btn danger" id="confirmDel">${svg('trash')}削除する</button>
        </div>`);
      $('#confirmDel').addEventListener('click', () => {
        state.manuals = state.manuals.filter(x => x.id !== orig.id);
        state.favs = state.favs.filter(x => x !== orig.id);
        state.recent = state.recent.filter(x => x !== orig.id);
        delete state.checks[orig.id];
        store.save();
        closeSheet();
        toast('削除しました');
        location.hash = '#cat-' + orig.cat;
      });
    });
  }

  /* ================= シート（設定・確認） ================= */
  const overlay = $('#overlay');
  function openSheet(html) {
    overlay.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
    overlay.hidden = false;
    const f = overlay.querySelector('button, input, textarea');
    if (f) f.focus();
  }
  function closeSheet() { overlay.hidden = true; overlay.innerHTML = ''; }
  overlay.addEventListener('click', e => { if (e.target === overlay || e.target.closest('[data-close]')) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !overlay.hidden) closeSheet(); });

  function openSettings() {
    openSheet(`
      <div class="sheet-head"><h2>設定</h2><button class="icon-btn" data-close aria-label="閉じる">${svg('x')}</button></div>
      <div class="setting">
        <span class="setting-title">文字の大きさ</span>
        <div class="seg" role="group" aria-label="文字の大きさ">
          <button data-size="normal" aria-pressed="${!state.largeText}">ふつう</button>
          <button data-size="large" aria-pressed="${state.largeText}">大きめ</button>
        </div>
      </div>
      <div class="setting">
        <span class="setting-title">データの書き出し</span>
        <span class="muted" style="font-size:.84rem">マニュアルはこの端末に保存されています。別の端末に移すときは、下の文字をコピーして、移したい端末の「読み込み」に貼り付けてください。</span>
        <textarea id="exportBox" readonly></textarea>
        <button class="btn sm" id="copyExport" style="align-self:flex-start">${svg('copy')}コピーする</button>
      </div>
      <div class="setting">
        <span class="setting-title">データの読み込み</span>
        <label for="importBox" class="sr-only">読み込むデータ</label>
        <textarea id="importBox" placeholder="書き出したデータをここに貼り付け"></textarea>
        <div class="actions">
          <button class="btn sm" id="doImport">読み込む</button>
          <label class="btn sm" for="importFile">ファイルから選ぶ</label>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
      </div>
      <div class="setting">
        <span class="setting-title">初期状態に戻す</span>
        <span class="muted" style="font-size:.84rem">追加・編集したマニュアルを消して、サンプルのマニュアルに戻します。</span>
        <button class="btn sm danger" id="resetAll" style="align-self:flex-start">${svg('reset')}初期状態に戻す</button>
      </div>`);

    $('#exportBox').value = JSON.stringify({ app: 'mirai-manual', version: 1, manuals: state.manuals }, null, 1);
    overlay.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
      state.largeText = b.dataset.size === 'large';
      document.documentElement.classList.toggle('large-text', state.largeText);
      store.save();
      overlay.querySelectorAll('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b));
    }));
    $('#copyExport').addEventListener('click', () => {
      const box = $('#exportBox');
      const fallback = () => { box.focus(); box.select(); toast('選択しました。コピーしてください'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(box.value).then(() => toast('コピーしました'), fallback);
      } else fallback();
    });
    const importText = text => {
      try {
        const data = JSON.parse(text);
        const list = Array.isArray(data) ? data : data.manuals;
        if (!Array.isArray(list) || !list.every(m => m && m.id && m.title && Array.isArray(m.steps))) throw new Error('bad');
        state.manuals = list;
        store.save();
        closeSheet();
        toast(`${list.length}件のマニュアルを読み込みました`);
        route();
      } catch (err) {
        toast('読み込めませんでした。書き出したデータをそのまま貼り付けてください');
      }
    };
    $('#doImport').addEventListener('click', () => importText($('#importBox').value));
    $('#importFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => importText(r.result);
      r.readAsText(file);
    });
    $('#resetAll').addEventListener('click', () => {
      const b = $('#resetAll');
      if (b.dataset.armed) {
        state.manuals = JSON.parse(JSON.stringify(DEFAULT_MANUALS));
        state.checks = {};
        state.favs = state.favs.filter(getManual);
        state.recent = state.recent.filter(getManual);
        store.save();
        closeSheet();
        toast('初期状態に戻しました');
        route();
      } else {
        b.dataset.armed = '1';
        b.innerHTML = `${svg('alert')}もう一度押すと戻します`;
      }
    });
  }
  $('#openSettings').addEventListener('click', openSettings);

  /* ================= ルーティング ================= */
  const q = $('#q');
  let searchTimer;
  q.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const v = q.value.trim();
      if (v) { renderSearch(v); setTab(''); }
      else route();
    }, 150);
  });

  function setTab(name) {
    const h = location.hash.slice(1) || 'home';
    const active = name !== undefined ? name
      : h === 'home' ? 'home' : (h === 'all' || h.startsWith('cat-')) ? 'all' : h === 'fav' ? 'fav' : h === 'new' ? 'new' : '';
    document.querySelectorAll('.tab').forEach(t => {
      if (t.dataset.tab === active) t.setAttribute('aria-current', 'page');
      else t.removeAttribute('aria-current');
    });
  }

  function route() {
    const h = location.hash.slice(1) || 'home';
    if (q.value && !h.startsWith('m-')) q.value = '';
    if (h.startsWith('m-')) { q.value = ''; renderDetail(h.slice(2)); }
    else if (h.startsWith('cat-')) renderList(h.slice(4));
    else if (h === 'all') { listFilter = 'all'; renderList(null); }
    else if (h === 'fav') renderFav();
    else if (h === 'new') renderEdit(null);
    else if (h.startsWith('edit-')) renderEdit(h.slice(5));
    else renderHome();
    setTab();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
