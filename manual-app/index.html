<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みらい歯科 院内マニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Yusei+Magic&display=swap">
<style>
/* Layout: 上部に検索バー、中央に1カラムのコンテンツ（最大960px）、下部にタブバー。カードは役割があるものだけに使う */
:root {
  --bg: #FFF6F8;
  --surface: #FFFFFF;
  --surface-2: #FFEEF3;
  --ink: #4A3036;
  --ink-soft: #85666E;
  --line: #F5D7E0;
  --accent: #F7A8C0;
  --accent-soft: #FFDCE6;
  --accent-ink: #B23F66;
  --warn-bg: #FFE5DF;
  --warn-ink: #A8402E;
  --ok: #5BAE8C;
  --ok-ink: #2E7A5B;
  --shadow: 0 6px 20px rgba(214, 120, 150, .14);

  --c-reception: #FFD9E3; --c-reception-ink: #B5476E;
  --c-assist: #E8E0FB;    --c-assist-ink: #6A55B0;
  --c-steril: #D6F1E7;    --c-steril-ink: #2F8466;
  --c-emergency: #FFDCD5; --c-emergency-ink: #B4442F;
  --c-open: #FFF1CC;      --c-open-ink: #9A7414;
  --c-patient: #FFE5D3;   --c-patient-ink: #B0602A;
  --c-rules: #DAEDFB;     --c-rules-ink: #2F6E9E;
  --c-material: #F4E2F6;  --c-material-ink: #924A9C;
  --c-hygiene: #D4EFF3;   --c-hygiene-ink: #23798A;
  --c-chart: #EFE7DC;     --c-chart-ink: #8A6A3E;

  --font-display: "Yusei Magic", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;

  --radius: 18px;
  --radius-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #251A1E; --surface: #32242A; --surface-2: #3D2B32; --ink: #FBEAEF; --ink-soft: #CFAFB8;
    --line: #4E3940; --accent: #F2A0BA; --accent-soft: #5A3442; --accent-ink: #FFB6CC;
    --warn-bg: #4A2A25; --warn-ink: #FFB4A3; --ok: #7CCBA9; --ok-ink: #93DDBD; --shadow: 0 6px 20px rgba(0,0,0,.3);
    --c-reception: #4E2C38; --c-reception-ink: #FFB3C9;
    --c-assist: #3A3352;    --c-assist-ink: #C9BBFF;
    --c-steril: #24433A;    --c-steril-ink: #93E0C2;
    --c-emergency: #4E2C26; --c-emergency-ink: #FFB2A2;
    --c-open: #463A1E;      --c-open-ink: #F3D27A;
    --c-patient: #4A3326;   --c-patient-ink: #FFC39C;
    --c-rules: #233B4E;     --c-rules-ink: #9FCFF5;
    --c-material: #452D4A;  --c-material-ink: #EAB3F2;
    --c-hygiene: #1F4148;   --c-hygiene-ink: #8FDCE8;
    --c-chart: #3E352A;     --c-chart-ink: #E5C99E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #251A1E; --surface: #32242A; --surface-2: #3D2B32; --ink: #FBEAEF; --ink-soft: #CFAFB8;
  --line: #4E3940; --accent: #F2A0BA; --accent-soft: #5A3442; --accent-ink: #FFB6CC;
  --warn-bg: #4A2A25; --warn-ink: #FFB4A3; --ok: #7CCBA9; --ok-ink: #93DDBD; --shadow: 0 6px 20px rgba(0,0,0,.3);
  --c-reception: #4E2C38; --c-reception-ink: #FFB3C9;
  --c-assist: #3A3352;    --c-assist-ink: #C9BBFF;
  --c-steril: #24433A;    --c-steril-ink: #93E0C2;
  --c-emergency: #4E2C26; --c-emergency-ink: #FFB2A2;
  --c-open: #463A1E;      --c-open-ink: #F3D27A;
  --c-patient: #4A3326;   --c-patient-ink: #FFC39C;
  --c-rules: #233B4E;     --c-rules-ink: #9FCFF5;
  --c-material: #452D4A;  --c-material-ink: #EAB3F2;
  --c-hygiene: #1F4148;   --c-hygiene-ink: #8FDCE8;
  --c-chart: #3E352A;     --c-chart-ink: #E5C99E;
  color-scheme: dark;
}
html.large-text { font-size: 112.5%; }
html, body { margin: 0; }
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.4; margin: 0; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { max-width: 960px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand-text { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.1; }
.brand-text small { display: block; font-family: var(--font-body); font-size: .68rem; color: var(--ink-soft); letter-spacing: .08em; }
.search { flex: 1; min-width: 0; position: relative; }
.search input {
  width: 100%; height: 44px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); padding: 0 16px 0 42px; font-size: .95rem;
}
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: var(--ink-soft);
  display: grid; place-items: center; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--accent-ink); }
@media (max-width: 520px) { .brand-text { display: none; } }

/* ---------- Main ---------- */
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.section-head a, .link-btn { color: var(--accent-ink); font-size: .88rem; text-decoration: none; background: none; border: none; padding: 0; }
.muted { color: var(--ink-soft); }

/* Greeting */
.hello {
  position: relative; overflow: hidden;
  background: var(--surface-2);
  border-radius: 24px; padding: 22px 22px 20px;
}
.hello::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, var(--accent-soft), transparent 70%);
  pointer-events: none;
}
.hello-date { font-size: .85rem; color: var(--ink-soft); letter-spacing: .04em; }
.hello h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.5rem, 4.5vw, 2rem); margin: 4px 0 6px; color: var(--ink); }
.hello p { margin: 0; color: var(--ink-soft); font-size: .92rem; position: relative; z-index: 1; }
.hello-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--surface); font-size: .82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.pill b { color: var(--accent-ink); font-weight: 700; }

/* Emergency banner */
.sos {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--radius);
  background: var(--c-emergency); color: var(--c-emergency-ink); text-decoration: none; border: 1.5px solid color-mix(in srgb, var(--c-emergency-ink) 25%, transparent);
}
.sos-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.sos-icon svg { width: 24px; height: 24px; }
.sos strong { display: block; font-size: 1rem; }
.sos span { font-size: .84rem; opacity: .9; }
.sos .chev { margin-left: auto; }

/* Category grid */
.cat-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cat {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: var(--radius);
  background: var(--cat-bg); color: var(--ink); text-decoration: none; border: none; text-align: left;
  transition: transform .15s ease, box-shadow .15s ease;
}
.cat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.cat-icon { width: 42px; height: 42px; border-radius: 14px; background: var(--surface); color: var(--cat-ink); display: grid; place-items: center; }
.cat-icon svg { width: 24px; height: 24px; }
.cat-name { font-weight: 700; font-size: .98rem; line-height: 1.3; }
.cat-count { font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* Manual list */
.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.item:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.item-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--cat-bg); color: var(--cat-ink); display: grid; place-items: center; flex: none; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-weight: 700; font-size: 1rem; line-height: 1.45; }
.item-sub { font-size: .84rem; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .76rem; color: var(--ink-soft); margin-top: 2px; font-variant-numeric: tabular-nums; }
.item-meta span { display: inline-flex; align-items: center; gap: 4px; }
.item-meta svg { width: 14px; height: 14px; }
.item .chev { color: var(--ink-soft); }
.progress-mini { width: 54px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; }
.progress-mini i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
mark { background: var(--accent-soft); color: var(--ink); border-radius: 4px; padding: 0 2px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .86rem;
  color: var(--ink-soft); white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

.empty {
  text-align: center; padding: 28px 20px; border-radius: var(--radius); border: 2px dashed var(--line); color: var(--ink-soft); font-size: .92rem;
}
.empty svg { width: 34px; height: 34px; color: var(--accent); margin-bottom: 6px; }

/* ---------- Detail ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-soft); background: none; border: none; padding: 6px 8px 6px 0; font-size: .92rem; text-decoration: none; }
.back:hover { color: var(--accent-ink); }
.detail-head { display: flex; flex-direction: column; gap: 10px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; background: var(--cat-bg); color: var(--cat-ink); font-size: .82rem; font-weight: 700; align-self: flex-start; }
.tag svg { width: 16px; height: 16px; }
.detail-head h1 { font-size: clamp(1.4rem, 4vw, 1.85rem); font-weight: 700; }
.detail-head .summary { margin: 0; color: var(--ink-soft); max-width: 65ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meta-row span { display: inline-flex; align-items: center; gap: 5px; }
.meta-row svg { width: 16px; height: 16px; }
.keywords { display: flex; flex-wrap: wrap; gap: 6px; }
.keywords span { font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: .92rem; font-weight: 500; text-decoration: none;
}
.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #3E2229; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.04); color: #3E2229; }
.btn.danger { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn-ink) 35%, transparent); }
.btn.faved { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.btn.faved svg { fill: currentColor; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .84rem; }

.progress {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 65px); z-index: 10;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px;
  display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow);
}
.progress-bar { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: inherit; transition: width .3s ease; }
.progress-label { font-size: .86rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress.done .progress-label { color: var(--ok); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: step; }
.step {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 16px; border-radius: var(--radius);
  background: var(--surface); border: 1.5px solid var(--line); transition: background .2s ease, border-color .2s ease;
}
.step-check {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 0;
}
.step-check svg { display: none; width: 22px; height: 22px; stroke-width: 2.6; }
.step.done { background: color-mix(in srgb, var(--ok) 9%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.step.done .step-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.done .step-check span { display: none; }
.step.done .step-check svg { display: block; }
.step.done .step-text { color: var(--ink-soft); }
.step-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 7px; }
.step-text { margin: 0; font-size: 1rem; white-space: pre-wrap; }
.note { display: flex; gap: 8px; padding: 10px 12px; border-radius: var(--radius-sm); font-size: .88rem; line-height: 1.65; }
.note svg { margin-top: 2px; }
.note b { flex: none; }
.note.tip { background: var(--accent-soft); color: var(--ink); }
.note.tip svg, .note.tip b { color: var(--accent-ink); }
.note.warn { background: var(--warn-bg); color: var(--ink); }
.note.warn svg, .note.warn b { color: var(--warn-ink); }
.complete {
  text-align: center; padding: 22px; border-radius: var(--radius); background: color-mix(in srgb, var(--ok) 12%, var(--surface));
  color: var(--ink);
}
.complete strong { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; display: block; color: var(--ok); }

/* ---------- Inputs ---------- */
input[type="text"], input[type="number"], input[type="password"], select, textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; min-height: 44px;
}
textarea { resize: vertical; min-height: 72px; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }

/* ---------- Lock / Inline editor ---------- */
.btn.lock { border-style: dashed; color: var(--ink-soft); }
.btn.lock:hover { border-style: solid; }
.lock-hint { font-size: .78rem; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 4px; }
.lock-hint svg { width: 14px; height: 14px; }
.editbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 65px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  padding: 10px 12px 10px 16px; border-radius: var(--radius); background: var(--accent-soft); border: 1.5px solid var(--accent); box-shadow: var(--shadow);
}
.editbar-state { display: flex; align-items: center; gap: 10px; color: var(--accent-ink); }
.editbar-state svg { width: 24px; height: 24px; }
.editbar-state b { display: block; font-size: .95rem; line-height: 1.25; }
.editbar-state small { display: block; font-size: .75rem; color: var(--ink-soft); line-height: 1.3; }
.editbar-actions { display: flex; gap: 8px; }
textarea.ed {
  display: block; width: 100%; min-height: 0; resize: none; overflow: hidden; line-height: 1.65; padding: 8px 10px;
  border: 1.5px dashed color-mix(in srgb, var(--accent) 75%, transparent); background: var(--surface);
}
textarea.ed:focus { border-style: solid; }
textarea.ed-title { font-size: clamp(1.3rem, 4vw, 1.7rem); font-weight: 700; line-height: 1.4; }
textarea.ed-sum { color: var(--ink-soft); }
.ed-row { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.ed-inline { display: flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--ink-soft); }
.ed-inline.grow { flex: 1 1 220px; min-width: 0; }
.ed-inline > span { flex: none; }
.ed-inline input, .ed-inline select { min-height: 38px; padding: 6px 10px; width: auto; }
.ed-inline.grow input { flex: 1; min-width: 0; }
.ed-inline input[type="number"] { width: 5em; }
.step.editing { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 65%, transparent); }
.step-num { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #3E2229; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.step.editing .step-body { padding-top: 0; }
.note.ed-note { align-items: flex-start; }
.ed-note-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ed-note select { min-height: 34px; padding: 4px 8px; width: auto; align-self: flex-start; font-size: .82rem; font-weight: 700; }
.ed-note textarea.ed { font-size: .88rem; }
.ed-add-note { display: flex; flex-wrap: wrap; gap: 6px; }
.step-tools { display: flex; justify-content: flex-end; gap: 2px; border-top: 1px dashed var(--line); padding-top: 6px; }
.step-tools .icon-btn { width: 40px; height: 40px; }
.editor-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
.pin-input { font-size: 1.6rem; letter-spacing: .6em; text-align: center; font-variant-numeric: tabular-nums; }
.err { color: var(--warn-ink); font-size: .85rem; min-height: 1.4em; margin: 0; }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 8px; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 10px; text-decoration: none; color: var(--ink-soft); font-size: .72rem;
  position: relative;
}

    {"id":"n-018072ebfd46","cat":"reception","title":"受付業務で必要なこと","summary":"受付として大切にしたい心構えと、日常業務・備品・情報管理の基本です。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["受付","心構え","身だしなみ","個人情報","受付業務"],"source":"https://app.notion.com/p/13c9c73023f582659ea5018072ebfd46","steps":[{"h":"基本的な心構え","t":"笑顔と丁寧な対応：お客様に好印象を与える第一歩です"},{"t":"正確な情報伝達：メモを取り、確実に情報を伝えることが重要です"},{"t":"清潔な身だしなみ：清潔感のある服装と身だしなみを心がけましょう"},{"h":"日常業務","t":"来客対応：来訪者の確認と案内／訪問記録の管理／来客用の飲み物の準備"},{"t":"電話対応：丁寧な言葉遣いでの応対／正確な伝言メモの作成／適切な取次ぎ"},{"h":"緊急時の対応","t":"緊急連絡先の把握：常に最新の連絡先リストを確認しておく"},{"t":"避難経路の確認：災害時の避難経路を把握しておく"},{"t":"応急手当の知識：基本的な応急処置の方法を理解しておく"},{"h":"必要な備品管理","t":"事務用品：筆記用具、メモ帳、スタンプ類"},{"t":"来客用品：お茶セット、紙コップ、スリッパ"},{"t":"受付周りの整理整頓：デスク周りの清潔さを保つ"},{"h":"情報管理","t":"個人情報の取り扱い：守秘義務を徹底する"},{"t":"セキュリティ管理：部外者の立ち入り制限を確実に行う"},{"t":"文書管理：重要書類の適切な保管と管理"}]},
    {"id":"n-81fe4a0bcddc","cat":"reception","title":"初診患者さんの受付〜退出まで","summary":"受付は歯科医院の「顔」と言える場所で、歯科医院そのものへの印象に大きく関わってきます。清潔感を大事に、笑顔で明るく、落ち着いた心で患者さんをお迎えしましょう。（broccoliより）","minutes":15,"updated":"2026-07-01","author":"受付業務","tags":["初診","受付","問診票","お会計","予約","受付業務"],"source":"https://app.notion.com/p/e4a9c73023f58239b46181fe4a0bcddc","steps":[{"h":"来院から退出までの主な流れ","t":"①来院 → ②受付 → ③待合室で待機 → ④診療開始 → ⑤診療終了 → ⑥お会計・予約 → ⑦退出","img":["https://toothtooth-manual.jp/data/files/00/00/00/14/cn2iE0S5_t.png"]},{"h":"①患者さん来院","t":"来院された患者さんのお顔を見て明るい声でご挨拶をします。初診で来られた患者さんの場合、受付の位置が分かるように一言お声がけすると良いでしょう。","say":"「こちらで受付いたします。」「こちらへどうぞ。」","warn":"お顔を見ずに作業をしながらご挨拶すると、患者さんの不信感・不安感が大きくなるので注意しましょう。"},{"h":"②受付","t":"1. お名前・予約時間の確認：患者さんのお名前をお伺いします。予約されている場合は予約時間を確認します。","say":"「◯時からご予約の◾️◾️様ですね。」","tip":"急患の方には主訴をお伺いします。（症状やお悩みといった来院理由）主訴をもとに先生と診療タイムを検討し、患者さんにご相談します。（そのまま待機または予約をお取りして改めてご来院）→詳しくは「急患さんの来院対応」へ","links":[{"label":"急患さんの来院対応","url":"https://toothtooth-manual.jp/clinic/manuals/2/books/5082/read"}]},{"t":"2. 必要書類の確認：診察券／健康保険証またはマイナンバーカード／医療証(医療券)や高齢者受給証／お薬手帳／糖尿病連携手帳や身体障害者手帳などの各種手帳／紹介状　など"},{"t":"3. 問診票の記入：初診の患者さんには問診票をご記入いただきます。（必要に応じて再診の方にも記入いただくことがあります）どの範囲を記入するのか、必読項目がある場合は必ずお伝えします。","warn":"健康保険証等は確認次第できればすぐにお返ししましょう。（お薬手帳なども同様）健康保険証(マイナンバーカード)やお薬手帳類は最も守秘義務の重要度が高い書類であるため大切に取り扱い、返し忘れ防止のためすぐにご本人へ返却しましょう。"},{"h":"③待合室で待機","t":"一言お声がけします。前の診療時間が伸びていることが分かっている場合は、このタイミングでお伝えします。","say":"「お名前をお呼びいたしますのでおかけになってお待ちください。」"},{"h":"④診療開始","t":"待合室にいらっしゃる患者さんのお名前(できればフルネーム)をお呼びします。待合室にいらっしゃる全ての患者さんに聞こえるボリュームで、ゆっくり発声します。患者さんが近づいて来られたらもう一度お名前の確認をします。患者さん自身に名乗っていただくとより正確です。","say":"「念の為お名前をフルネームでお願いします。」"},{"t":"お声がけして誘導します。→詳しくは「ご案内/誘導マニュアル」へ","say":"「こちらへどうぞ。」","links":[{"label":"ご案内 / 誘導","url":"https://toothtooth-manual.jp/clinic/manuals/3/books/26319/read"}]},{"h":"⑤診療終了","t":"待合室に戻られた患者さんにお声がけをし、お待ちいただきます。※お会計がすぐにできる状態の場合はそのまま受付へ誘導します。","say":"「お疲れ様でした、おかけになってお待ちください。」"},{"h":"⑥お会計・予約","t":"お声がけをし、お預かり書類がある場合はお返しをします。歯科医師・歯科衛生士からの申し送りをお伝えします。お会計を行います。自動支払機の場合は操作誘導を行います。","say":"「お疲れ様でした。」"},{"t":"次回の日程を確認し、患者さんに合った日程で予約をお取りします。必要であれば診察券へ記入し、お返しします。※お会計・予約の順番は各医院様の方針に倣ってください。","say":"「次回のご予約は◯週間後でお取りいたします。ご都合のよろしいお日にちをお伺いいたします。」「では、次回は◆月◇日(＊)◯時にお待ちしております。」","warn":"間違いがないように必ず予約日時の復唱をします"},{"h":"⑦患者さんご退出","t":"次回の受付方法・注意事項をお伝えします。診察券を持参して来院時に提出いただくこと／アプリで次回予約が確認できること（※アプリを導入している場合のみ）／予約日時変更やキャンセルについての注意事項　など"},{"t":"お声がけをし、退出するまで確認をします。","say":"「お大事になさってください。」"}]},
    {"id":"n-8107251c722e","cat":"reception","title":"その他の業務","summary":"受付で日々行うそのほかの業務の一覧です。","minutes":15,"updated":"2026-07-01","author":"受付業務","tags":["スキャン","物販","配達物","お薬","Instagram","ガチャガチャ","受付業務"],"source":"https://app.notion.com/p/02a9c73023f5832689208107251c722e","steps":[{"t":"請求書や同意書、お薬手帳など大切な資料はNOSAの文書類と右パソコンの個人カルテのそれぞれの欄にスキャンしておく"},{"t":"物販の購入があれば、物販の売上一覧表に正の字でその都度記入→月末に集計"},{"t":"電話対応：必ず名前、電話番号、症状などを聞いておく。","say":"「はい、こんにちは/こんばんは　みらい歯科・矯正歯科でございます。」","tip":"急患で当日予約の場合や当日分の予約キャンセル、変更があればインカムで皆んなに知らせる"},{"t":"配達物の受け取り、印鑑を押す。保証書や納品書の管理。届いたものをあけて中に持っていく、なおす。"},{"t":"よく出る薬のセットをしておく（受付の真ん中の引き出しの中）：サワシリンカプセル（抗生物質9錠）・ロキソニン（痛み止め5錠）のセット"},{"t":"薬や物販の在庫をこまめに確認して無ければ発注"},{"t":"Instagramの更新（当番制）"},{"t":"絵本やおもちゃの入れ替え"},{"t":"ガチャガチャとコインの補充：1カプセルにシール3枚・キーホルダー1つ　などで入れる"},{"t":"ガチャガチャのおもちゃ在庫の発注：Temuでシールやキーホルダーなど"},{"t":"窓壁面を変える：季節ごとでTemuで購入して。"}]},
    {"id":"n-0154c07f7a59","cat":"reception","title":"患者さんが提出される公費や書類について","summary":"公費とは、その市又は県から発行される医療費補助などの証明書の事。市や県によって発行されるものが違い、基本的にはその府県や市のみで適用されます。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["公費","医療証","子ども医療","ひとり親","限度額認定証","受付業務"],"source":"https://app.notion.com/p/9da9c73023f583d689710154c07f7a59","steps":[{"h":"公費とは","t":"その市又は県から発行される医療費補助などの証明書の事。市や県によって発行されるものが違う。基本的にはその府県や市のみで適用される。","tip":"例えば大阪の方がご来院されて大阪の公費を出された場合、適用できないので負担額は保険証の負担割合になる（3割負担の人なら3割）。自分の市の市役所に領収書と公費を持っていったら返金されるので、患者さんに聞かれたらそのようにしてもらうように伝える。"},{"h":"公費の種類","t":"①木津川市の45から始まる子ども医療証（京都府の子どもの公費）：これを持っていたら月の初めに1回200円を支払うと、以降同月の保険診療費はかからない。18歳になった年の初めの3/31まで有効、それ以降は使えない。","warn":"市によっては医療費が全く無償の市もあるので注意して見る。","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/Kuq1284j_t.jpeg"]},{"t":"②44から始まる公費（ひとり親）：ひとり親の親とその子どもが持つ公費で保険診療は無償。子どもが18歳になった最初の3/31まで親と子共に有効、それ以降は無効。","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/kqLZQmha_t.jpeg"]},{"t":"③43から始まる福祉の医療証：障がいのあるかたの公費","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/itvHZKrE_t.jpeg"]},{"t":"④41から始まる公費：高齢の方（65〜70未満）が持っている、保険診療の1部を補助してくれる公費","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/s3ztiNUN_t.jpeg"]},{"t":"⑤限度額認定証：ひと月の保険診療費がある一定の額を超えた場合、それ以降無償になる。","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/3KbTLDkG_t.jpeg"]},{"t":"⑥重障老人のピンクのシール：貼っている人は保険診療費無償のシール","warn":"見落とさないよう注意","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/pYNxbPjj_t.jpeg"]}]},
    {"id":"n-012df6f5e159","cat":"reception","title":"次回アポとる時に役立つ歯科用語","summary":"カルテを見るとき・次回アポを取る時に知っていたら役立つ歯科用語です。","minutes":15,"updated":"2026-07-01","author":"受付業務","tags":["歯科用語","略語","アポ","カルテ","受付業務"],"source":"https://app.notion.com/p/b099c73023f583f8bb47012df6f5e159","steps":[{"t":"Kp imp：インレー形成、印象"},{"t":"Pz imp：クラウン形成、印象"},{"t":"Br imp：ブリッジ　形成、印象"},{"t":"SET (CAD FMC P)：補綴物のセット　キャド　エフエムシー　パラ"},{"t":"RCT：根治　根管治療"},{"t":"RCF：根充　根管充填"},{"t":"EMR：イーエムアール　根っこの長さを測る治療"},{"t":"EXT：抜歯"},{"t":"SP：消毒(外科的処置をした所など)"},{"t":"抜糸(ばついと)：縫合したところの糸取り"},{"t":"D調：デンチャー調整"},{"t":"C処：虫歯治療"},{"t":"CR：レジン　虫歯の治療で使用するレジンの詰め物"},{"t":"NG：ナイトガード　院内で作成するソフトタイプのマウスピース"},{"t":"スプリント：マウスピース　技工所に出すタイプのマウスピース"},{"t":"レコア：レジンコアー土台形成","tip":"基本的にRCT→RCF→レコア→形成印象→SET"},{"t":"SC(スケーリング)：超音波の機械でする歯のお掃除"},{"t":"SRP：エスアールピー(スケーリング　ルート　プレーニング)"},{"t":"BTチェック：バイトチェック　詰め物をした後1w後で噛み合わせの確認"},{"t":"TBI：歯ブラシ指導"},{"t":"OBS：経過観察"},{"t":"CO：要観察歯"},{"t":"Hys：知覚過敏"},{"t":"P検：歯周ポケットの深さの検査"},{"t":"DH：歯科衛生士"},{"t":"DA：歯科助手"},{"t":"Kr：患者","links":[{"label":"アポイントの取り方について（Notion）","url":"https://app.notion.com/p/5fb9c73023f58331979a01c6d3842565"}]}]},
    {"id":"n-811d6a804fa1","cat":"reception","title":"電話対応","summary":"電話の出方と、初診・再診・急患のアポイントの取り方です。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["電話","アポイント","初診","再診","急患","受付業務"],"source":"https://app.notion.com/p/9d59c73023f583bca3c6811d6a804fa1","steps":[{"h":"電話の応対","t":"基本的な電話の出だし","say":"「こんにちは/こんばんは、みらい歯科・矯正歯科でございます。」"},{"h":"こちらから電話する場合","t":"最初に伝える。","say":"「こんにちは、みらい歯科・矯正歯科でございます。〇〇さんのお電話でお間違いないでしょうか、今お時間よろしいでしょうか。」"},{"h":"電話がかかってきた場合","t":"できるだけ2コールで出る。3コール以上で「お待たせいたしました」と添える。","say":"「お待たせいたしました。みらい歯科・矯正歯科でございます。」"},{"h":"アポイント取る場合〜初診〜","t":"診療内容が何か聞く。お痛みなど症状があれば部位といつからなど。"},{"t":"名前フルネームと電話番号を聞く"},{"t":"持ち物（保険証、こどもの医療証(こどもの場合)）を伝える"},{"t":"問診票の記入があるので、予約時間の少しだけ前に来てもらうように伝える。"},{"t":"初診の場合は60分程かかる事を伝える。","tip":"年齢に応じて初診アポの所要時間は変わる（子ども30分ほど）"},{"h":"アポイント取る場合〜再診〜","t":"名前を聞く→カルテを見て次回の予約内容を見る→〇〇のご予約で間違いないでしょうか？→日時を決めてとる→復唱する","say":"「次回の診療内容お調べしますのでお待ちください。」"},{"h":"アポイントを取る場合〜急患〜","t":"名前を聞く→症状と希望の日時を聞く→予約を取る→復唱する","warn":"アポイントが埋まってる場合は先生に必ず確認、相談する。"}]},
    {"id":"n-0185ae9103c4","cat":"reception","title":"お問い合わせの電話対応（患者/営業/クレーム）","summary":"診療時間中に歯科医師やスタッフあてにお問合せのお電話をいただくことがあります。スムーズに対応を行うためには必要な情報を聞き取ることと、相手への心遣いが重要です。（broccoliより）","minutes":15,"updated":"2026-07-01","author":"受付業務","tags":["電話","問い合わせ","営業電話","クレーム","折り返し","受付業務"],"source":"https://app.notion.com/p/9e89c73023f5823392a10185ae9103c4","steps":[{"h":"１．患者さんからのお問い合わせ対応","t":"お相手のお名前（必要であればカルテ番号）をメモし、指名の医師・スタッフへ繋ぐ前にご用件をお伺いいたします。聞くこと：名前（カルテ番号）／ご用件／誰宛の問い合わせなのか","say":"「◾️◾️は診療中でございまして、差し支えなければ、こちらでご用件をお伺いさせていただきます。」「承知いたしました、◾️◾️へ確認いたしますので、少々お待ちください。」","warn":"あまり長々と話をしてしまうと、相手に不快感を与えてしまいます。必要な用件を手短にお聞きしましょう。"},{"t":"ご用件をお聞きして、指定の医師・スタッフへお伝えし指示をもらいます。"},{"t":"＜再度お電話をしていただく場合＞急ぎのお用件でなければ指定の時間をお伝えして、改めてご連絡いただくようにお伝えします。","say":"「◇時〜◆時であれば◼︎◼︎へお繋ぎすることが可能ですので、再度ご連絡いただけますでしょうか？」"},{"t":"＜こちらから折り返しをする場合＞こちらから折り返しをする、またはお相手がご希望された場合はお電話可能なお時間帯をお聞きします。","say":"「◾️◾️から折り返しのご連絡をさせていただきますので、お電話可能なお時間帯をお伺いしてもよろしいでしょうか？」"},{"t":"折り返しのご連絡先の確認をします。","say":"「ご連絡はこちらのお電話番号あてでよろしいでしょうか？」\nYES→「承知いたしました、確認のため申し上げます。090-＊＊＊＊〜で間違いないでしょうか？」\nNO→「承知いたしました、ではご連絡先をお伺いいたします。」「確認のため復唱いたします、090-＊＊＊＊〜で間違いないでしょうか？」","tip":"カルテに電話番号の記載がない場合は、いただいた電話番号を追記しておくことで、今後コンタクトをとる際に役立てることができます。","warn":"個人情報ですので、メモの取り扱い（特に廃棄する場合）には十分注意しましょう。"},{"h":"２．営業電話への対応","t":"歯科医院に対しての営業電話は頻繁にあります。基本的には患者さんと同じように対応し取り次ぎますが、歯科医院の方針で院内には取り次がず、受付でお断りする場合もあります。その場合は曖昧に流さず、はっきりお断りをしましょう。"},{"t":"相手のお名前・会社名をメモし、指名の医師・スタッフへ繋ぐ前にご用件をお伺いいたします。聞くこと：会社名／名前／ご用件／誰宛の問い合わせなのか"},{"t":"お断りする場合は、お断りの理由をお伝えし納得した上でお切りしましょう。大切な要件の場合もありますので、傾聴することは忘れずに配慮しましょう。","say":"「医院への営業のご連絡はお断りするよう申しつけられておりますので、申し訳ありませんがお取り次ぎはできません。」"},{"h":"３．クレームへの対応","t":"患者さんからクレームのご連絡をいただくこともございます。焦らず、呼吸を整えて、より丁寧な対応を心がけましょう。"},{"t":"まずはお相手の話しをよく聞き、中断せず最後まで傾聴しましょう。その際、メモを取りながらお相手の言ったことを復唱しながら確認をします。","say":"「はい、今も痛みが続いているんですね。右下ですね。血が出ている、はい。・・・・」","tip":"人間は自分の言葉を繰り返されると落ち着いてくる傾向があります"},{"t":"お相手の主張に対して、対応する医師・スタッフへ指示を仰ぎます。","say":"「承知いたしました。お伺いした内容を◾️◾️へ確認いたしますので、しばらくお待ちください。」"},{"t":"すぐの対応が難しい場合はその旨をお伝えして、ご連絡先を確認します。ご連絡可能な時間帯、もしくはこちらから連絡する時間帯をご提案します。","say":"「大変申し訳ありませんが、◾️◾️は現在診療中ですので、折り返しのお電話をさせていただきます。」「ご連絡可能なお時間帯をお伺いいたします。」または、「確認しだいこちらから◇時ごろにご連絡いたします。」"},{"t":"折り返しのご連絡先の確認をします。","say":"「ご連絡はこちらのお電話番号あてでよろしいでしょうか？」\nYES→「承知いたしました、確認のため申し上げます。090-＊＊＊＊〜で間違いないでしょうか？」\nNO→「承知いたしました、ではご連絡先をお伺いいたします。」「確認のため復唱いたします、090-＊＊＊＊〜で間違いないでしょうか？」","tip":"お相手が怒鳴っている場合でも、焦らず落ち着いて対応することを心がけましょう。"}]},
    {"id":"n-819c98a1557d","cat":"reception","title":"急患さんの電話対応","summary":"急患とは、痛みがひどい、補綴物が取れたなど様々な理由で急遽医院に連絡、来院された患者さんのことです。患者さんに寄り添った対応を心がけましょう。（broccoliより）","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["急患","電話","主訴","補綴物","受付業務"],"source":"https://app.notion.com/p/6029c73023f582169eaa819c98a1557d","steps":[{"h":"1.現状を把握する","t":"患者さんの主訴をお聞きします：主訴／症状のある部位／現在どのような状態なのか／いつから症状が出たのか／症状のきっかけ","tip":"患者さんの現状がどんな状態なのか把握するために、症状や病名、補綴物の構造などをしっかり理解しておきましょう。"},{"t":"患者さんは突然のトラブルで気が動転しており、早急に対応してもらいたいと焦っておられる方が多いです。予約でいっぱいだとしても断らず最後まで傾聴します。お相手に落ち着いていただくためにも冷静に状況をお伺いします。","say":"「それは大変でしたね、すぐに◾️◾️に確認いたしますので、少々お待ちください。」"},{"t":"取れた・割れた補綴物などがある場合、必ずご持参いただくことをお伝えします。","say":"「取れた被せ物や詰め物は捨てずに、忘れずにご持参ください。」","tip":"欠けた・割れた場合でもどんな補綴を入れていたのか把握するために持ってきていただきます"},{"h":"2.来院予約を取る","t":"歯科医師の指示でご来院していただくことになったら、診療が可能な時間帯をお伝えします。","tip":"予約患者さんがいらっしゃる場合は予約優先であることをお伝えし、お待ちいただく時間があることに了承していただきます。"},{"h":"3.来院対応","t":"基本的な受付の流れと同じです。取れた補綴物など、治療に関わるものを先にお預かりしておくと、診療室に入ってからの対応がスムーズに行えます。→詳しくは「急患さんの来院対応」マニュアルへ","say":"「順番に対応いたしますので、お掛けになってお待ちください。」","tip":"すぐに対応してくれない！と不安に思われないように、一言、お待ちいただく旨をお伝えしましょう。"}]},
    {"id":"n-81b3a6eadff7","cat":"reception","title":"急患さんの来院対応","summary":"ご自宅や外出先でトラブルがあり、歯科医院へ直接ご来院された場合の対応です。＜既存＞か＜初診＞かで受付の流れが変わります。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["急患","来院","既存患者","初診","受付業務"],"source":"https://app.notion.com/p/4339c73023f58212aded81b3a6eadff7","steps":[{"h":"＜既存患者さんの場合＞","t":"診察券、必要書類を確認のうえ、カルテ内容を確認します。トラブルのあった歯が治療中(後)なのか健全歯かなどを把握します：症状のある部位／治療の有無（根管治療中・仮止め中・外科手術後など）／補綴の種類（仮歯・ブリッジ・インプラントなど）／トラブルのあった歯の治療歴（補綴製作日・治療日など）／トラブルのきっかけ／現在の症状　など"},{"t":"予約制のため、予約を取られている患者さんがいることをお伝えし、その上でお待ちいただきます。","warn":"お伝えしないとトラブルの原因になる可能性がありますので注意しましょう"},{"t":"来院されたことを歯科医師・歯科衛生士に伝えることに加え、カルテで確認できる患者さんの情報をお伝えできるとより良いです。カルテの記載情報を共有すると、診療タイムや今後の治療方針の検討を行いやすくなります。そして、歯科医師の指示を仰ぎ、患者さんにお伝えします。","say":"”◼︎◼︎様が〜〜の理由で直接ご来院されました。””主訴の部位はカルテでは、◇年に治療を行い、◆年に最終補綴物で治療終了と記載されています。”","tip":"診療中の場合は端的に要点だけお伝えしましょう"},{"h":"＜初診患者さんの場合＞","t":"問診票を記入いただき、必要書類の確認を行います。取れた補綴物の有無も確認します。お呼びするまで、待合室で待機していただきます。→受付の詳しい対応は「初診患者さんの受付〜退出まで」マニュアルへ","links":[{"label":"初診患者さんの受付〜退出まで","url":"https://toothtooth-manual.jp/clinic/manuals/2/books/4390/read"}]},{"t":"予約制のため、予約を取られている患者さんがいることをお伝えし、その上でお待ちいただきます。","warn":"お伝えしないとトラブルの原因になる可能性がありますので注意しましょう"}]},
    {"id":"n-81de0e76fd02","cat":"reception","title":"E-PARKの操作方法","summary":"朝の業務で行うE-PARKのアポイント確認と、アポツールへの入力の注意点です。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["E-PARK","アポツール","予約","朝","受付業務"],"source":"https://app.notion.com/p/3089c73023f58382b3ab81de0e76fd02","steps":[{"h":"e-park　朝の業務","t":"アポツールの画面1番上のタブの中から「＋」クリック→上から3段目、左から2番目「アポイント管理」をクリック。Eparkのアポイント画面が表示される","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/ftbdqNv0_t.jpeg"]},{"h":"アポイント管理","t":"基本的にアポはアポツールを使用します。E parkとアポツールは連携されていない為、予約が反映されることはありません。","warn":"必ずアポツール側にもアポをパソコンから入れて下さい。"},{"t":"アポツール、e-park、同じ所にアポが重複してしまうことがあるので、日中こまめにアポ入ってないか確認する。"}]},
    {"id":"n-81bc70cbe7e4","cat":"reception","title":"初診来院時の対応","summary":"初診の受付対応とやる事（アポツール・ノーザの操作を含む）です。","minutes":20,"updated":"2026-07-01","author":"受付業務","tags":["初診","アポツール","ノーザ","新患登録","問診票","受付業務"],"source":"https://app.notion.com/p/7569c73023f5827da1f781bc70cbe7e4","steps":[{"t":"①名前を伺う。→アポツールで確認→患者アポ右上の⬜︎未をクリックして⬜︎来にする。保険証・あれば公費【子ども医療証など】を預かり、問診票を渡す。インカムで伝える。","say":"「○時〇〇さん来られました。問診票記入中です。」","tip":"子ども：子ども医療証(京都府のもの)／70歳以上の方：受給者証（必ずいる）の提出が無ければ聞く"},{"t":"②ノーザ新患登録：院内患者一覧画面→F2新患登録→ctrl・F11保険証読み取り→スキャン機械に保険証を入れる（おもて面を下にして右上角に合わせていれる）→スキャン開始。音が止まったら取り出して保険証とスキャン内容に間違いがないか確認→➕"},{"t":"公費をお持ちの方：コントロールキー→F12 公費読み取り→スキャン機械に入れ、スキャン開始、音が止まったら取り出し内容確認。高齢者：F9 高齢者負担率 負担率の欄をみて登録する。子ども：公費区分入力（公費区分は社会保険の人だけ入力）→F11終了","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/ZbBkch0J_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/78/aZWziTmT_t.jpeg"]},{"t":"右端のパソコン　アポツール：予約の該当患者のアポクリック→名前をクリック→右端の患者プロフィール編集→診察券番号の所にカルテNo.入力→1番下更新","tip":"この操作でノーザと連携できる（電話番号、名前の漢字表記など）"},{"t":"③問診票のスキャン：問診票記入後、窓口に持って来られたら保険証をお返しする→左奥のスキャンの機械に問診票を入れる→スキャンする→アポツールの右パソコンでその人のアポイントをタップ→note→右上、用紙一覧→右上編集をタップ→ファイルから取り込む→ファイル選択→開く。問診票の登録がおわったら、インカムで伝える。","say":"「〇〇さん、問診票終わりました。」","tip":"アポツールの患者情報のところの「診察券アプリのトークン発行」をクリック"},{"t":"④ノーザに問診票を取り込む：プリンター裏返しにして左奥につめて入れる→その人の原簿にカーソル合わせてF3患者原簿→右上スキャン→文書類→スキャナーから取り込み→実行→➕→スキャンされたら原簿右上の住所、電話番号の欄に問診票を見ながら入力→コントロールキー→F3 neopremium2→F11→プリンターから問診票をだしてゴミ箱に入れる"},{"t":"⑤患者さんが中に入ったら、アポツール⬜︎来を診に変える"},{"t":"⑥診察券をつくる。カルテNo.、氏名、ふりがなを書く"},{"t":"⑦診察が終わって出て来られたら⬜︎診を会にかえる"},{"t":"⑧アポツール該当患者をクリック、右上赤タブのnoteを開く。会計までに診療録のカルテをみて次回の予約内容を確認しておく。"},{"t":"⑨お会計をする。（会計やり方は「受付　お会計」を参照）"},{"t":"⑩アポをとる。患者アポタップ→次回予約→半透明の患者アポがマウスについてうごくので、カレンダーから患者の希望日を選択して、時間を合わせてクリックする"}]},
    {"id":"n-815e64d84785","cat":"reception","title":"来院時の対応　再診の場合","summary":"再診の患者さんが来院されたときの受付の流れです。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["再診","来院","アポツール","保険証確認","受付業務"],"source":"https://app.notion.com/p/e189c73023f58244af91815e64d84785","steps":[{"t":"①お名前をお伺いする→アポツールで確認→患者アポ右上の⬜︎未をクリックして⬜︎来にする。インカムで伝える。","say":"「〇時〇〇さん来られました。」","warn":"月初や今月まだ保険証の確認が取れてない人は保険証をお預かりし確認（ノーザパソコンの院内患者一覧で水色のカーソル合わせて保険証の写真クリック、F12保険証確認をクリック、➕ボタン）の操作を必ずする。"},{"t":"②中に入ったら⬜︎来を診にかえる。"},{"t":"③診療が終わったら⬜︎診を会に変える→会計までに次回の治療項目を確認しておく。"},{"t":"④会計をする。（「受付　お会計」を参照）"},{"t":"⑤次回のアポをとる→診察券に次回アポの記入、復唱してお渡し"},{"t":"⑥帰ったら⬜︎会計をクリック、何もなしに変える"}]},
    {"id":"n-814d45ad04a6","cat":"reception","title":"保険証の種類","summary":"保険証の種類と見分け方です。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["保険証","国民健康保険","社会保険","受給者証","後期高齢者","受付業務"],"source":"https://app.notion.com/p/70e9c73023f582c29974814d45ad04a6","steps":[{"t":"①国民健康保険：保険者番号6桁で有効期限がある。","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/sXFRXYOC_t.jpeg"]},{"t":"②社会保険証：保険者番号8桁","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/aFvW76br_t.jpeg"]},{"t":"③受給者証：前期高齢者（70〜75歳未満の方）は保険証と受給者証が必ずいります。","warn":"この証が無ければ患者さんの負担割合がわかりません。","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/W0QHubPq_t.jpeg"]},{"t":"④後期高齢者保険証：75歳以上の方はこれ1枚のご提示になります。","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/hwzXYbCA_t.jpeg"]}]},
    {"id":"n-01a617f151d4","cat":"reception","title":"マイナンバーの登録方法","summary":"マイナンバーカードで受付するときの、初診・再診それぞれの操作です。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["マイナンバー","マイナ保険証","資格確認","ノーザ","初診","再診","受付業務"],"source":"https://app.notion.com/p/97a9c73023f583dda5d701a617f151d4","steps":[{"h":"初診の場合","t":"1　前の機械から操作をお願いする。認証方法は①顔認証（マスク、めがね、帽子などは外して貰う）または②暗証番号","say":"「前の機械から操作お願いいたします。」"},{"t":"2　問診票、同意書をお渡しし、記入して貰う。"},{"t":"3　新患登録をする。患者さんのマイナンバー操作が終わったら、ノーザのパソコンで登録していく。院内患者一覧→F10 各種業務→5 マイナンバーカード資格確認結果読込業務→一覧に認証された患者の名前が出てくる→対象患者にカーソル合わせて→F2 新患登録→原簿ができるので→F11終了"},{"t":"4　問診票入力：問診票はいつも通り取り込む。マイナンバーの場合は住所まで自動入力されるので、電話番号、その他間違いがないかだけ確認して→F3 neopremium登録→F11終了"},{"h":"再診の場合","t":"1　初診の時と同じようにマイナンバー端末より認証して貰う。終わったら掛けて待って貰う。"},{"t":"2　マイナンバーの情報を更新する。院内患者一覧→F10 各種業務→5 マイナンバーカード資格確認結果読込業務→Enter→該当患者にカーソル合わせ→F3 患者原簿→間違いがないか、情報に変更がないか確認して➕を押す→変更があれば原簿複数化してF11終了","tip":"変更が無ければそのまま閉じていい。"}]},
    {"id":"n-81cfdc6c26c6","cat":"reception","title":"保険証忘れた場合の対応","summary":"保険証を初診で忘れた場合は、一旦10割負担でお支払いして貰い、次回保険証を持ってきたら差額を返金します。","minutes":15,"updated":"2026-07-01","author":"受付業務","tags":["保険証","10割負担","返金","領収書","ノーザ","受付業務"],"source":"https://app.notion.com/p/d379c73023f582fbb47d81cfdc6c26c6","steps":[{"h":"保険証を初診で忘れた場合","t":"一旦10割負担でお支払いして貰う。次回来て貰った時に保険証を持ってきたら差額返金になる。","warn":"必ず返金分の領収書を持ってきて貰う。ないと差し替えできなくなります。","tip":"10割負担の場合、初診の場合1万円は超えます。治療したらもう少しかかります。詳しい料金を患者さんから聞かれたら先生に聞いてください。"},{"h":"当日操作","t":"①F2新患登録→名前、性別を手打ちで登録→保険種別にカーソル合わせて「999」と入力→閉じる"},{"t":"②問診票記入が終わったら、住所、生年月日、電話番号など問診票を見ながら入力。閉じる時に色々訂正などの項目がでてくるが、無視して登録してOK"},{"h":"後日操作　保険証を持ってきた時","t":"①保険証を登録していく"},{"t":"②その人にカーソル合わせて患者原簿F3→保険証をスキャナーにいれてスキャンする→スキャン内容と保険証の相違ないか確認→F11終了","warn":"原簿は複数化しない！！！！上書き保存する。"},{"h":"会計について","t":"①F8開く→▲がついているのは過剰金（多く貰いすぎている返金分）。返金分の金額を返金する：F7過剰金返却→無変換→横の釣り銭にとぶので釣り銭機のokを押して小計すると、患者さん側の釣り銭から返金される"},{"h":"領収書について","t":"①F8の会計画面から→F1日付選択で前回の日付を入れる→前回の3割分の料金を打ち替える→F9領収証→F8手書き→3割分の料金を手打ち→F12発行","warn":"必ず前回の10割負担の領収証と3割負担分の正しい領収証と差し替えしてください。"},{"t":"10割負担の領収証（初診時の）ー3割負担の領収証（初診時の）＝返金分。これを領収書と電卓を使って説明して、返金と正しい領収証を渡す（10割分はこちらで破棄する）"}]},
    {"id":"n-01d519263a87","cat":"reception","title":"医療券の書き方","summary":"医療券の記入のしかたです。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["医療券","生活保護","書類","受付業務"],"source":"https://app.notion.com/p/d089c73023f58238874801d519263a87","steps":[{"t":"症状部位：P部位を記入する"},{"t":"初診日を記入する"},{"t":"転機：記入しない"},{"t":"主要症状及び今後の診療見込み：「全顎的に中等度から重度の歯周病に罹患しており、継続的な歯周基本治療が必要と認めます。」と記入する"},{"t":"入院外　6ヶ月"},{"t":"入院外　医療を　要する　数字を◯で囲む"},{"t":"院長にサインとハンコをもらう"}]},
    {"id":"n-014b73d4e4e2","cat":"reception","title":"生活保護患者の方","summary":"生活保護の方の受付・原簿作成・月末の入力についてです。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["生活保護","通知票","医療券","原簿","受付業務"],"source":"https://app.notion.com/p/c299c73023f58286a5e7014b73d4e4e2","steps":[{"h":"来られたら","t":"生活保護の方が来られたら通知票を必ず預かって下さい。問診票は通常通り記入して頂きます。赤の小さなファイル「生活保護関係」に、人ごとにポケットに入れます。","warn":"通知票は毎回必要になります。","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/KiEcr4gf_t.jpeg"]},{"h":"原簿を作成する","t":"①スキャンするものはないのでF2新患登録→通知票や問診票を元に名前、住所、電話番号、生年月日などの入力をする"},{"t":"②shift F10生保情報→本人支払額にカーソル合わせてF5候補一覧→1、0円（負担なし）→enter→確認(+)"},{"t":"③原簿右側の下から3つ目「保険種別」にカーソルを合わせて「192」enterすると、192生活保護と入力される","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/2onsXV1R_t.jpeg"]},{"h":"月末入力事項","t":"月末に医院に生活保護法医療券が届きます。届いたら該当患者の原簿に事項を入力します。画像の赤線の番号を、原簿の公費負担者番号と公費受給者番号の所に入力する→Ctrl→F3 Neopremium2→F11 終了","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/xLL6EbTj_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/90/u1faq4bQ_t.jpeg"]},{"h":"まとめ","t":"毎回受診時、通知票が必ず必要になります。治療入力後、金額があがっても生保の方はお支払いがありません。","tip":"未収金のままで大丈夫です→月末届く書類の番号を原簿に登録後に未収金は消えます！"}]},
    {"id":"n-8107efc26e45","cat":"reception","title":"受付　お会計","summary":"院内患者一覧で「★会計待ち」になったら会計をします。現金とカードそれぞれの操作です。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["会計","現金","カード","釣り銭機","領収証","ノーザ","受付業務"],"source":"https://app.notion.com/p/fcc9c73023f583bfb4928107efc26e45","steps":[{"t":"院内患者一覧の該当患者が「治療待ち」から「★会計待ち」に変わったら会計をする。","say":"「〇〇さん、お疲れ様でした。お名前はお間違いありませんか？」「本日のお会計〇〇円です。」","tip":"5000円以上でカード利用できる。それ以外は基本現金のみ"},{"h":"現金の場合","t":"①院内患者一覧からカーソルを該当患者に合わせて→F8窓口会計→F12 全額入金→無変換→F10まとめ発行→Enter"},{"t":"②釣り銭機：画面に患者さんの名前が出たら患者選択して、OK→小計→入金","say":"「釣り銭機からご入金お願いいたします。」"},{"t":"③領収証がプリンタから発行されるので印鑑を押して、領収書と口腔内のお知らせなどあればあわせてお渡しする。"},{"h":"カードの場合","t":"ノーザのパソコン操作：F8窓口会計→shift→F6 入金振替→振替率にカーソル合わせて100と入力→摘要にカーソル合わせてF5候補一覧→3カード支払い→Enter→➕確定→無変換"},{"t":"釣り銭機：画面に患者さんの名前が出たら患者選択して→ok→クレジット→小計","warn":"釣り銭機は、ここで操作を一旦ストップ"},{"t":"クレジット端末で金額を入力して操作してもらう（「クレジットカード端末　取り扱い」を参照）","warn":"端末でのお取引が「完了してから」釣り銭機のおわりボタンを押す。"},{"t":"領収証がプリンタから発行されるので印鑑を押して、領収書と口腔内のお知らせなどあればあわせてお渡しする。","warn":"（控え）の領収書は医院保管する。渡さない。クレジットの場合は出てくる明細の1枚目を渡して、2枚目を医院保管する(右端の引き出しに1日分まとめて入れる）"}]},
    {"id":"n-812ad84837a4","cat":"reception","title":"クレジットカード端末　取り扱い","summary":"クレジット端末（線の無い小さい端末）の朝のログインと、お会計での使い方です。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["クレジット","カード","端末","会計","朝","受付業務"],"source":"https://app.notion.com/p/d289c73023f5832e916d812ad84837a4","steps":[{"h":"朝のログイン","t":"朝来たらクレジット端末（線の無い小さい端末）のログインをする。ID…admini　PW…3263"},{"h":"取り扱い方法","t":"①右サイドの電源ボタンを軽く押す"},{"t":"②「クレジット」をタップ"},{"t":"③「売上」をタップ"},{"t":"④金額を入力→次へ"},{"t":"⑤「一括」or「分割」を聞いてタップする。"},{"t":"⑥「実行する」をタップ"},{"t":"⑦「カードをどうぞ」とでるので、下から差し込み　または　上タッチで操作してもらう","tip":"差し込みの場合は4ケタの暗証番号が必要になるのでペンで入力→「確認」をタップ。タッチでサインが必要な場合は「電子サイン」をタップ→ペンで入力してもらう"},{"t":"⑧「承認されました」とでたらok! 左側の吊るしている端末から2枚印字される。1枚目→お客様控えお渡し、2枚目→院内保管","warn":"早めにちぎらないと、続けて2枚目も印字される為注意"}]},
    {"id":"n-01814620e940","cat":"reception","title":"請求書の書き方","summary":"請求書を作成したら、スキャンしてカルテとwise staffに取り込みます。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["請求書","自費","インプラント","ジルコニア","受付業務"],"source":"https://app.notion.com/p/4959c73023f583db9c2301814620e940","steps":[{"h":"青の欄","t":"青①患者の名前を書く","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/APYnBWEU_t.jpeg"]},{"t":"青②請求書を作成した日にちを書く"},{"t":"青③請求金額の合計を書く"},{"h":"赤の欄","t":"赤①被せ物の材質やインプラントボディなど内容を書く"},{"t":"赤②本数など複数あれば書く"},{"t":"赤③税抜の1本の金額を書く"},{"t":"赤④税抜の合計金額を書く(2本あれば2本の合計)"},{"t":"赤⑤小計の合計を書く"},{"t":"赤⑥税抜合計の消費税を書く"},{"t":"赤⑦税込の合計金額をかく"},{"h":"記入例","t":"ジルコニアクラウン1本とインプラントのボディ2本分の請求書の場合","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/yvRV5N8J_t.jpeg"]},{"t":"請求書を作成したらスキャンし、カルテとwise staffに取り込む"}]},
    {"id":"n-019cfd900c78","cat":"reception","title":"処方薬について","summary":"医院処方の薬のセット準備と、患者さんへの説明です。多いのは抗生物質と痛み止めです。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["処方薬","抗生物質","痛み止め","ロキソニン","カロナール","軟膏","受付業務"],"source":"https://app.notion.com/p/0b09c73023f5835797e0019cfd900c78","steps":[{"h":"薬のセット準備","t":"抗生物質は1日3錠✖️3日分の処方になるので、ハサミで1粒切って9錠にする。痛み止めは5回分出るので、5錠になるようにハサミで切っておく"},{"h":"抗生物質","t":"①サワシリンカプセル　②ビクシリンカプセル　③セフゾンカプセル","say":"「抗生物質のお薬は1日、朝、昼、夕の食後に1回1錠、3日分で9錠服用してください。」","tip":"飲み切ってもらう","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/UuZrQyEQ_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/79/maUNfTx3_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/79/o7G0i2mJ_t.jpeg"]},{"h":"痛み止め","t":"①ロキソニン","say":"「痛み止めは1回1錠、5回分です。間隔は6時間空けてください。」","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/R1YwFDM6_t.jpeg"]},{"t":"②カロナール：200mg 小児／300mg 成人","tip":"錠剤苦手な子どもは聞いて粉末の薬を渡す。1袋1錠になるので5袋","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/8hSfdjQ5_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/79/cjg9zlba_t.jpeg"]},{"t":"③フロモックス　④ボルタレン","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/vHc3hqVT_t.jpeg"]},{"h":"軟膏","t":"オルテクサー：1日1〜数回、患部に塗布","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/GhTAU6ac_t.jpeg"]},{"h":"うがい薬","t":"ネオステグリーン：黄色の紙の倍率で薄めて、1日数回うがいして貰う","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/REdsaYxK_t.jpeg"]},{"t":"薬をお渡しするときは、薬剤提供書を一緒に渡す","warn":"必ず薬剤提供書を一緒に渡す","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/0DwTyQNU_t.jpeg"]}]},
    {"id":"n-01ff44b5d15c","cat":"reception","title":"デンタルローンについて","summary":"デンタルローンは患者さんご自身で申請して頂き、ローン会社と契約してもらうものになります。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["デンタルローン","矯正","支払い","自費","受付業務"],"source":"https://app.notion.com/p/4659c73023f5828db88d01ff44b5d15c","steps":[{"h":"ローン払いを希望されたら","t":"①受付にあるデンタルローンの引き出しにあるパンフレットのQRコードから、患者さんに申し込みをしてもらう"},{"t":"②パンフレットに載っている申し込みコードの番号を入れてもらう"},{"t":"③受付にて作成した補助用紙に沿って入力をしてもらい、その後患者さんの個人情報を入れてもらう","tip":"入力補助用紙は、患者さんに合わせた内容で書き込んで、申請作業される際に渡す","img":["https://toothtooth-manual.jp/data/files/00/00/01/79/srYM2eqa_t.jpeg"]},{"t":"④金利4.5%で組んでもらうためにはTカード作成が条件になるため、作成するかしないかの欄を必ず「作成する」にしてもらうよう伝える"},{"t":"⑤申し込み審査が降りたら矯正が開始できることを伝える","warn":"デンタルローンの開始ボタンは同意書の記入後に押す"}]},
    {"id":"n-01c5c304fb4e","cat":"reception","title":"自費治療支払いのタイミング","summary":"自費の詰め物・被せ物、インプラント、矯正それぞれの請求書の作成とお支払いのタイミングです。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["自費","請求書","支払い","インプラント","矯正","ジルコニア","受付業務"],"source":"https://app.notion.com/p/ac69c73023f582ffa64301c5c304fb4e","steps":[{"h":"自費の詰め物や被せ物","t":"自費の詰め物や被せ物をすると決まった際、請求書を作成する。だいたい型取りをする日に請求書を作成し、会計時に窓口にてお渡しする(ジルコニアクラウンの場合)","say":"「本日被せ物のご請求書をお渡しさせて頂きます。ジルコニアクラウン1本分で税込88,000円になっております。」「お支払いは本日されますか？」","tip":"基本支払いは次回のセットの際で大丈夫ですが、当日に支払われる方もいるため確認してみてください。当日を希望された場合、支払いして頂き、請求書も渡して下さい。"},{"h":"インプラント","t":"カルテを参考に請求書を作成。1回目のオペの日に支払いして頂く","tip":"オペに必要な分だけ支払って、上部は上部が必要になった時に支払われる方もいる"},{"h":"矯正","t":"矯正結果の日に請求書を作成する。支払い方法は①窓口現金 ②カード払い ③窓口分割(5回まで) ④口座振込 ⑤デンタルローン がある。支払いをいつされるか確認する","warn":"支払いが終わってから矯正スタートになるため、装置の発注などが必要な場合も支払い後の発注になる"},{"t":"口座振込の場合：振り込みが完了したら医院にtelいただくように伝える(次回来られた際に領収書を渡す)"},{"t":"窓口分割の場合：最大5回まで分割でき、1回目の支払いの際に消費税の金額がはいる"},{"t":"デンタルローンの場合：患者さんに申し込みをしてもらう。審査が降りたら矯正が開始できる。支払いのタイミングは患者さんに合わせる形になるが、支払い後に始められる旨を伝える。"},{"t":"矯正や自費の請求書を渡した方については、支払いが終わったら管理表にその都度「済」と書き足していく"}]},
    {"id":"n-814b7853140c","cat":"reception","title":"受付作成書類・原本等の管理","summary":"基本的に問診票や同意書等の原本は受付のパソコンにて保存しています。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["書類","原本","問診票","同意書","料金表","受付業務"],"source":"https://app.notion.com/p/1fd9c73023f582acb46f814b7853140c","steps":[{"t":"①問診票（一般用と矯正相談用）"},{"t":"②歯科麻酔処置・インプラント・ホワイトニング・矯正（プレオルソ／成人）・抜歯の同意書"},{"t":"③補綴物・インプラント・ホワイトニング・矯正・Denの料金表"},{"t":"④矯正のケンサ割引チケット"},{"t":"⑤指示書など"}]},
    {"id":"n-01d37d0c8ba1","cat":"reception","title":"物販の購入について","summary":"物販を購入されたときの会計操作です。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["物販","会計","売上","受付業務"],"source":"https://app.notion.com/p/ab59c73023f5825cb4e301d37d0c8ba1","steps":[{"t":"①f8窓口会計→f3売上→購入されたものにカーソル合わせて購入個数を入力→➕"},{"t":"ここからはいつものお会計と同じ操作方法（「受付　お会計」を参照）","tip":"物販の価格変更方法は、Notionの元ページに見出しだけあります（未記入）。"}]},
    {"id":"n-01c80f53c4bc","cat":"reception","title":"受付で行っているファイル管理","summary":"受付で管理しているレシート・納品書・重要書類・ローン契約書類のファイルの場所とまとめ方です。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["ファイル","レシート","納品書","重要書類","アプラス","受付業務"],"source":"https://app.notion.com/p/46d9c73023f582f3abc601c80f53c4bc","steps":[{"h":"①1日の入金額や売上金回収等のレシート（受付の1番右の引き出し）","t":"①売上金回収のレシート→1週間ごとにまとめてホッチキスする"},{"t":"②朝の入金額を示したレシート→1週間ごとにまとめてホッチキスする"},{"t":"③売上日計表のレシート→1週間ごとにまとめてホッチキスする","tip":"①〜③は「合計表・日計表」のシールが貼っている場所にまとめていれる"},{"t":"④クレジットカードの控え→その日ごとにまとめてホッチキスする"},{"t":"⑤クレジットカードの日計→その日ごとにまとめてホッチキスする","tip":"④⑤はカード収入のシールが貼っている場所にまとめて入れる","img":["https://toothtooth-manual.jp/data/files/00/00/01/89/YiCIWcvf_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/89/59a639Rm_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/89/UtkOX53R_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/89/7HFvIPZw_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/89/3ykLxAkv_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/89/POk38Mmu_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/89/Oew1wX7X_t.jpeg"]},{"h":"②納品書ファイル（受付下の棚）","t":"物販など届いたものの納品書は保管しておく。業者ごとにシールを貼って分けているのでまとめる。","warn":"トミヤの納品書は消毒室にて保管しているので受付には入れない。届いたら中の衛生士さんに渡してください","img":["https://toothtooth-manual.jp/data/files/00/00/01/89/VjxQAnJm_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/89/GIOpCF9w_t.jpeg"]},{"h":"③重要書類・返却書類（受付下の棚）","t":"患者さんが忘れていった領収書やカード支払いの控え、渡しそびれた書類や患者さんの診療情報提供書などを入れて保管しておく。","tip":"次回来られた際に渡す場合は、アポのメモ欄に書いておくと忘れない","img":["https://toothtooth-manual.jp/data/files/00/00/01/89/6NMMSoIO_t.jpeg"]},{"h":"④アプラス契約患者ファイル","t":"デンタルローンを希望の患者に関しての書類をいれる。ローン希望で登録をされた時にローン会社からFAXで送られてくる書類を保管しておく。","img":["https://toothtooth-manual.jp/data/files/00/00/01/89/3iaGDuH1_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/89/7AFoj0NN_t.jpeg"]}]},
    {"id":"n-8194711f58e5","cat":"reception","title":"矯正患者の管理","summary":"矯正患者の管理は基本、受付が紙ファイルやパソコン上にて管理します。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["矯正","管理表","割引チケット","分割払い","受付業務"],"source":"https://app.notion.com/p/7f09c73023f583f9beac8194711f58e5","steps":[{"h":"管理の基本","t":"矯正相談で割引チケットを渡した患者を書き込んでいく(写真の黄色い部分)→カルテNo./名前/年齢/相談日/割引対象日を書く"},{"t":"段階に応じて、検査をしたときや請求書を渡したときなど、その都度記入していく"},{"t":"矯正を開始するにあたって、支払い後に装置を発注し、届いたら医院の方からtelする場合があるので、その際は連絡についての記入欄も漏れないようにする"},{"h":"紙での管理","t":"①矯正の検査をした場合、実施した日にちをいれる"},{"t":"②矯正を進めていくと決まった場合、装置の種類等を書く"},{"t":"③検査を実施した日に支払った検査代を書く","tip":"割引について：3週間以内に検査でチケット持参→¥33,000／兄弟が当院で矯正検査、矯正をしていた場合→−¥11,000／割引期間を過ぎてからの検査、またはチケット紛失や持ってきてない場合→¥55,000（チケットに関して会計時までに取りに帰るは🆗）"},{"t":"④矯正に関しての請求書を作成した場合に金額を、支払いが済んだら「済」と書く"},{"t":"⑤矯正装着等の支払い方法を書く：カード・現金・分割・ローン"},{"t":"⑥支払い後、装置発注などの兼ね合いで医院からtelが必要な場合は「有」に◯をし、連絡が済んだら「済」に◯をする","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/RvvVI9Ul_t.jpeg"]},{"h":"パソコンでの管理","t":"パソコン上にて管理する表も、紙と同じような内容で記入していく","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/RH8eGUKA_t.jpeg"]},{"t":"分割払いの管理用紙：患者名/年齢/分割の料金を書く。支払いの都度、日にちと支払いが済んだことがわかるように「済」に◯をつける","warn":"記載漏れがないように定期的に患者の状況をチェックする","img":["https://toothtooth-manual.jp/data/files/00/00/01/77/rxyAH5od_t.jpeg"]}]},
    {"id":"n-81bbb7a3417b","cat":"reception","title":"矯正の検査結果後の作業","summary":"矯正の検査結果をお伝えしたあとに、受付で行う請求書・同意書・管理表の作業です。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["矯正","検査結果","請求書","同意書","受付業務"],"source":"https://app.notion.com/p/1099c73023f583989d0081bbb7a3417b","steps":[{"t":"①検査結果の話を聞いて、患者さんに矯正をするかしないか決めて頂く"},{"t":"②矯正をする場合、検査結果の用紙を見ながら請求書を作成する。同意書や請求書は受付の引き出しから出す。","tip":"患者のカルテの矯正資料の場所に結果について記入する用紙が入っているので、それを見ながら請求書を作る。マーカーで引いているところに、装置や追加に必要な処置の有無が書いている。支払いについても書いているので、口座振込であれば振り込み用紙も用意する","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/YKn2H8Td_t.jpeg"]},{"t":"請求書や同意書を作成したらスキャンしてカルテとwisestaffに取り込む。原本は封筒に入れて患者さんに渡す。"},{"t":"請求書は作成後スキャンし、患者のカルテの請求書フォルダ(〰️のところ)に入れておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/7GnTY5GB_t.jpeg"]},{"t":"③装置の種類に合わせて同意書をアシストの人に渡す。同意書は記入してもらったら、請求書と同様にスキャンし同意書のフォルダ(〰️のところ)に入れておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/zPXQrR35_t.jpeg"]},{"t":"④矯正の管理表に内容を記入する（「矯正患者の管理」を参照）"}]},
    {"id":"n-01345599e0ab","cat":"reception","title":"自費(矯正以外)の支払い、請求書管理","summary":"自費の被せ物やインプラントの見積もり・請求書の作成と、管理表への記入です。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["自費","請求書","見積書","管理表","インプラント","受付業務"],"source":"https://app.notion.com/p/23c9c73023f582b4881301345599e0ab","steps":[{"t":"患者のカルテに、自費の被せ物にすることやインプラントの見積もりや請求書をお渡しすることが記載されていたら、請求書や見積書を作成する"},{"t":"矯正の請求書と同じく、作成後はスキャンして原本を患者さんにお渡しする"},{"t":"管理表(紙)にその都度書き込んでいく：①カルテ番号 ②名前 ③内容(ジルコニアクラウン/ジルコニアインレーなど)","img":["https://toothtooth-manual.jp/data/files/00/00/01/78/7VTzml1i_t.jpeg"]},{"t":"④請求書の記載金額を書き、請求書を渡したら金額の横に「済」と書く"},{"t":"⑤支払いが済んだら「済」とその都度書き足していく"}]},
    {"id":"n-01405d9e5ba8","cat":"reception","title":"レセプト請求","summary":"レセプトは毎月月初め5日以降（5日以降しか返戻ダウンロードできない為）7日までに行います。遅くても8日朝には必ずレターパック赤色で発送します。10日必着！","minutes":60,"updated":"2026-07-01","author":"受付業務","tags":["レセプト","返戻","国保","社保","月初","レターパック","受付業務"],"source":"https://app.notion.com/p/4e69c73023f58254bb7201405d9e5ba8","steps":[{"h":"事前準備","t":"レターパックの準備：受付の引き出しに入っている国保連合会宛の住所を宛名に貼る、医院のヨコバンを送り主の欄に押す。追跡番号を剥がして受付下のファイルの紙に貼り、日にちと何を送ったか(2/7 1月レセプト分 など)書いておく","warn":"遅くても8日朝には必ずレターパック赤色で発送する。10日必着！"},{"t":"ファイル1枚用意（送付書を入れる用）"},{"t":"CD2枚出して、レセプト月を記入しておく。国保、社保もそれぞれ〇しておく"},{"t":"準備できたら、返戻ファイルとレセプトの説明書、レターパック、ファイル、CDをまとめて親機の下に入れて、いつでもできるようにしておく"},{"h":"簡単な流れ","t":"①国保と社保それぞれ返戻レセプトファイルのダウンロード"},{"t":"②ダウンロードした返戻をワイズ(院内PCソフト)に取り込む(無ければしない)"},{"t":"③先生に治療入力の訂正があれば返戻患者を知らせて訂正してもらう→返戻入力を行う(返戻が無ければ入力なし)"},{"t":"④電子レセプトを作成する(送る準備をするというイメージ)"},{"t":"⑤電子レセプトの送信(オンラインで送る)"},{"t":"⑥電子レセプトを請求確定する、確定状況のダウンロード"},{"t":"⑦院内保管用のCD-Rを焼く。社保と国保で1枚ずつ"},{"t":"⑧ワイズに請求確定状況のファイルをダウンロードする"},{"t":"⑨国保だけ郵送するので、レターパックに入れてポストに投函する"},{"t":"⑩焼いたCD-Rを保管：受付の下のレセプトBOXの中","tip":"詳しくは別紙参照。レセプトの説明書が受付のレセプトBOXにはいっています！"}]},
    {"id":"n-0134a3467201","cat":"reception","title":"請求書出たらする事","summary":"請求書が出たときに行うことの一覧です。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["請求書","スキャン","矯正","受付業務"],"source":"https://app.notion.com/p/f509c73023f5822387b50134a3467201","steps":[{"t":"スキャンして右のPCに取り込む"},{"t":"バインダーに記入"},{"t":"ノーションに入力"},{"t":"矯正のみ院長ノートに記入"},{"t":"請求書は封筒に入れてお渡しする","warn":"請求書は封筒に入れてお渡しする！","tip":"請求書を渡してその日にお支払いでもOK、次のsetの時でもok"}]},
    {"id":"n-01160804a683","cat":"reception","title":"矯正の時の請求書","summary":"矯正の支払い方法ごとの、領収書と手続きの違いです。","minutes":5,"updated":"2026-07-01","author":"受付業務","tags":["矯正","請求書","領収書","口座振込","分割","デンタルローン","受付業務"],"source":"https://app.notion.com/p/fa19c73023f58322958e01160804a683","steps":[{"t":"窓口一括→現金orカードのみ","warn":"領収書を渡す"},{"t":"口座振込→振込完了したらtelしてもらう。確認出来たら発注","warn":"領収書は渡さなくていい"},{"t":"デンタルローン→紙に書いて、患者さんに携帯で入力してもらい、結果が出るまで待ってもらう"},{"t":"窓口分割(５回、現金のみ)→領収書は手入力で金額を変える","tip":"１回目は税込みなので料金が少し高くなる"},{"t":"支払いが終われば付箋に書いておく"}]},
    {"id":"n-e4bf15875f8c","cat":"reception","title":"受付のよくある対応","summary":"マイナンバーの機械の不調・マイナンバー確認・会計・初診・保険証忘れの、すぐ見たい操作のまとめです。","minutes":10,"updated":"2026-07-01","author":"受付業務","tags":["マイナンバー","会計","初診","保険証忘れ","SIGNAL","受付業務"],"source":"https://app.notion.com/p/3909c73023f5807ea5bde4bf15875f8c","steps":[{"h":"マイナンバーの機械の調子が悪い時","t":"左のPCの画面右下の押すところ『SIGNAL』を押す→奥の黒のマウスを使って終了を押す→顔認証付きカードリーダーのアプリ(左下くらいにある)をダブルクリック→待機中になればOK→いつもの画面に戻すのに『SIGNAL』を何回か押す"},{"h":"マイナンバー確認のやり方","t":"初診→F10→5→F2→＋→F11　／　再診→F10→5→F3→＋→F11"},{"h":"会計のやり方","t":"「会計待ち」だったらDr入力済み。名前にカーソルを合わせる→F8→F12→無変換→F10→釣銭機で『OK』『小計』を押す→F11で終了"},{"h":"初診のやり方","t":"①名前を聞く。保険証、医療証もあればお預かりする（またはマイナンバー）。同意書、問診票を書いてもらう。インカムで伝える。","say":"「初診の〇〇さん来られました。問診表記入中です」"},{"t":"②新患登録をする：読み取り機に保険証を入れる→F2(新患登録)→ctrl→F11→＋"},{"t":"③公費を持ってる人：取り込み機に公費を入れる→F2(新患登録)→ctrl→F11→＋→公費区分を公費にあったものを入力","tip":"子供(社)→12.45（￥200）、43.44（￥0）"},{"t":"④患者のNo.が分かれば右のPCにNo.を入れる：初診の人を押す→名前を押す→プロフィール編集→診察券番号に入力→下にスクロールで更新を押す"},{"t":"⑤問診票をスキャナーでスキャンする。右のPCに送られるので名前を入力して保存する。右のPCで患者の名前を押す→note→右上の用紙一覧→右上編集→ファイルから取り込む→ファイル選択して開く。入ったらインカムで伝える。","say":"「問診票終わりました」"},{"t":"⑥プロフィール編集で来院経路も入力しておく"},{"h":"保険証忘れの方","t":"一旦10割でお支払いいただく。新患登録する：F2→カナ名前・郵便番号・漢字氏名・性別・住所・電話番号・生年月日・保険種別を入力（詳しくは「保険証忘れた場合の対応」を参照）"}]},
    {"id":"n-81df42ce484d","cat":"material","title":"受付の在庫管理","summary":"受付周りの消耗品・販売品の在庫と、注文のしかたです。","minutes":15,"updated":"2026-07-01","author":"受付業務","tags":["在庫","注文","アスクル","アマゾン","ラクスル","ロール紙","受付業務"],"source":"https://app.notion.com/p/2c49c73023f58234bb6281df42ce484d","steps":[{"h":"クレジットカード端末のロール紙","t":"①モバイルタイプの機械は、裏に電話番号が載っているのでそこから注文する","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/d2K0NPBr_t.jpeg"]},{"t":"②据え置きタイプの機械は、機械内の画面操作で注文できるのでそこから頼む","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/xDR2hRwo_t.jpeg"]},{"h":"コピー用紙","t":"医院で使用しているコピー用紙はA5とA4サイズ。在庫がなくなってきたらパソコン画面でアスクルで注文する。受付下の引き出しに予備を入れ、入らない分は親機の下や2階のストックの棚になおしておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/q7VmtnyW_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/90/h9Qp3SYV_t.jpeg"]},{"h":"診察券や医院の封筒","t":"受付の引き出しにて保管しているが、入らない分は親機の下にも入れている時があるので、その都度確認するようにする。在庫が少なくなってきたらパソコン画面でラクスルで注文する","warn":"届くまで時間がかかるので早めに頼む","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/Bm93EVIN_t.jpeg"]},{"h":"掃除道具やその都度必要な事務用品","t":"受付周りに置いている掃除用品や事務用品は、無くなってきたらその都度購入する。パソコン画面のアスクルやアマゾン、その他にも歯科用品のサイト（ciやFEED）もあるので、必要に応じて注文するサイトを選ぶ","tip":"一定の額以上注文しないと送料がかかる場合があるので、その場合は他にも必要なものがないか確認して注文するようにしてください。"},{"h":"歯科用品販売の在庫","t":"受付の左の棚に販売している歯科用品を入れているので、在庫が少なくなってきたらその都度注文する。注文先の業者と目安に頼む数を札に書いてつけているので、それを参考にする","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/kqoJexbR_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/90/ChoOGzHt_t.jpeg"]},{"h":"ガチャガチャ類","t":"がちゃがちゃのカプセルや中身も受付で注文している。数が少なくなってきたら、中身はTEMU、カプセルはアスクルかアマゾンで注文。在庫は受付下の引き出しにて保管","tip":"注文履歴を辿ったら同じものを購入しやすいです","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/vgdfBGJh_t.jpeg"]},{"h":"コピー機のインク・メンテナンスボックス","t":"受付にあるコピー機のインクやメンテナンスボックスの在庫の管理も受付がする。新しいものを開ける時に次のものを注文する。在庫は親機の下に保管しておく","tip":"アマゾンにて購入歴があるので参考にして下さい","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/zv4udUC7_t.jpeg"]},{"h":"釣銭機横のロール紙（日計表や売上のレシート用紙）","t":"受付の一番左にある機械のロール紙も、在庫が減ってきたら注文する（アマゾン）。受付下の棚にて在庫保管している","img":["https://toothtooth-manual.jp/data/files/00/00/01/90/I4I2quAN_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/01/90/CTxI1hbI_t.jpeg"]},{"h":"レセプトのデータ保存用CD-R","t":"毎月のレセプト請求の保存用のCD-Rの在庫が減ってきたら、専用のfax用紙にて注文する"}]},
    {"id":"n-eca780bbd06f","cat":"assist","title":"レントゲン機器の使い方","summary":"レントゲン（デンタル・パノラマ）撮影のときの、機器の基本位置と片付けです。","minutes":5,"updated":"2025-09-09","author":"アシスト業務","tags":["レントゲン","デンタル","パノラマ","防護エプロン","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581f18969eca780bbd06f","steps":[{"h":"基本位置","t":"患者さんの誘導の際は、基本ホームポジションの位置でお願いします。","img":["https://toothtooth-manual.jp/data/files/00/00/01/25/Uw6WLpmx_t.jpeg"]},{"t":"患者さんに中の白い椅子に座って頂いてから、リセットボタンを押してセッティングしていきます。","img":["https://toothtooth-manual.jp/data/files/00/00/01/25/LWwfGSZj_t.jpeg"]},{"t":"デンタルは座って撮影します。パノラマ撮影の際に白い椅子に誘導しますので、使い終わった後は元の位置に戻してください。","img":["https://toothtooth-manual.jp/data/files/00/00/01/25/g9RE5dOP_t.jpeg"]},{"t":"防護エプロンは大人と子どもの2種類あります。身体の大きさに合わせて使用して下さい。"},{"t":"終わった後は、触れた場所をSPワッテで消毒する","warn":"触れた場所はSPワッテで消毒お願いします。"}]},
    {"id":"n-e94c6047a3cf","cat":"assist","title":"CR（コンポジットレジン充填）","summary":"コンポジットレジン充填の準備物と、治療の流れに沿ったアシストです。","minutes":30,"updated":"2026-07-21","author":"アシスト業務","tags":["CR","レジン","充填","麻酔","歯面処理","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581b99f24e94c6047a3cf","steps":[{"h":"準備するもの","t":"タービン / コントラ／タービン・コントラのバー類／スプーンエキスカベータ／う蝕検知液／歯面処理剤（エッチング液 / プライマー液 / ボンディング材）／マイクロスポンジ／コンポジットレジン（フロー or ペースト）／光照射器","img":["https://toothtooth-manual.jp/data/files/00/00/00/91/vmGg0qfp_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/00/91/kFUysW5s_t.jpeg"]},{"t":"必要に応じて準備するもの：切削すると痛みを伴う大きなう蝕の場合…表面麻酔（＋綿棒）・浸潤麻酔（注射筒＋注射針＋カートリッジ）／隣接面を含む窩洞の場合…隔壁材・マトリックス・ウェッジ・マトリックスバンド・トッフルマイヤー式リテーナー・研磨用ストリップ・フロス／咬合面を含む窩洞の場合…咬合紙・咬合紙ホルダー"},{"h":"１. 局所麻酔（必要に応じて）","t":"エアーをかけてしみたり、切削すると痛みを伴ったりする大きなう蝕の場合に局所麻酔をします。表面麻酔の塗布（小綿球）→効果待ち（約1分）→浸潤麻酔→軽いうがい→効果待ち（約5分）","img":["https://toothtooth-manual.jp/data/files/00/00/00/01/3snhVaEq_t.jpg"]},{"t":"〈アシスト〉小綿球に表面麻酔をつけておく・浸潤麻酔をセットしておく・麻酔が口腔内で漏れる場合はバキュームで吸引する・麻酔が効くまで待ち、感覚の有無を確認する","tip":"必ず事前に全身疾患・アレルギーの有無を確認しましょう（疾患に合わせて麻酔を選ぶ）。麻酔薬に少し苦味があることをお伝えしましょう（薬の浸透待ちの時は喉に流れないよう唾液の吸引を心がける）。麻酔後、気分が悪くなっていないか確認しましょう"},{"t":"麻酔薬のセット方法：①カートリッジの先端（針が刺さる面）を消毒する ②注射筒のハンドルを引いてカートリッジの後部から入れる ③注射針をセットする","img":["https://toothtooth-manual.jp/data/files/00/00/00/21/pGo6yaQ0_t.png","https://toothtooth-manual.jp/data/files/00/00/00/21/ux9cmNbV_t.png","https://toothtooth-manual.jp/data/files/00/00/00/21/TwguXjA8_t.png","https://toothtooth-manual.jp/data/files/00/00/00/21/4SfGlNwI_t.png"]},{"t":"リキャップ〜注射針をとる：①手は使わずに針でキャップをすくう ②キャップをしめる ③注射筒から注射針を外す","warn":"リキャップは手を使わず、針でキャップをすくう","img":["https://toothtooth-manual.jp/data/files/00/00/00/21/pGx5Zevd_t.png","https://toothtooth-manual.jp/data/files/00/00/00/21/nHINmPx5_t.png","https://toothtooth-manual.jp/data/files/00/00/00/21/lZJNDQFe_t.png","https://toothtooth-manual.jp/data/files/00/00/00/21/vfySc1V2_t.png"]},{"h":"２. う蝕（カリエス）除去","t":"切削する歯質によって器具を使い分けます。エナメル質カリエス：タービン／象牙質カリエス：コントラ・エキスカベータ。う蝕検知液を用いて除き残しが無いかを確認します（う蝕検知液→洗浄（or うがい）→乾燥）","img":["https://toothtooth-manual.jp/data/files/00/00/00/01/L8ReSgRk_t.jpg"]},{"t":"〈アシスト〉バキューム・バーの付け替え・頬粘膜や舌の排除","tip":"Drが歯質を確認する時は、アシストがエアーをかけて乾燥させると分かりやすいです。"},{"h":"３. 歯面処理","t":"使用する材料によって工程が異なります。３ステップ法：①エッチング→水洗＋乾燥＋防湿 ②プライミング→乾燥 ③ボンディング→乾燥＋光照射","img":["https://toothtooth-manual.jp/data/files/00/00/00/01/akrQVnzh_t.jpg","https://toothtooth-manual.jp/data/files/00/00/00/01/Xl6ApC6n_t.jpg"]},{"t":"２ステップ法（プライミング液とボンディング材が一緒になっている液を使う場合）：①エッチング→水洗→乾燥→防湿 ②プライミング＋ボンディング→乾燥→光照射"},{"t":"１ステップ法（オールインワン法。エッチング液・プライミング液・ボンディング材が全て一つになっている液を使う場合）：防湿→オールインワン液→乾燥→光照射"},{"t":"〈アシスト〉液剤の準備・器材の受け渡し（液剤を何度か塗布する場合はダッペンディッシュを口元で保持）・水洗時のバキューム","warn":"液剤は揮発しやすいので直前に出す"},{"h":"４. レジン充填","t":"防湿→窩洞にレジンを流す（形成）→光照射（何度か繰り返す場合があります）。隣接面を含む窩洞の場合は、マトリックスを挿入し、輪郭形成を行いながらレジンを充填します。光照射後に防湿を除去します。","img":["https://toothtooth-manual.jp/data/files/00/00/00/01/sz8m3qVf_t.jpg","https://toothtooth-manual.jp/data/files/00/00/00/01/YPf4rGbi_t.jpg"]},{"t":"〈アシスト〉指定されたレジンの用意（フロー or ペースト）・器材の受け渡し・唾液が溜まってきたらバキューム","tip":"レジンは部位によって使い分けることが多いです。前歯：ペーストタイプ（固体）→充填器を用いる／臼歯：フロータイプ（液体）→そのまま流す"},{"h":"５. 形態修正・咬合調整・研磨","t":"調整する面によって工程と使用器材が異なります。咬合面：咬合紙で印記→調整（必要に応じて）→研磨／側面：形態修正（必要に応じて）→研磨／隣接面：研磨用ストリップス・フロスを用いる"},{"t":"〈アシスト〉咬合紙の交換・バキューム・バーの付け替え","tip":"咬合紙を使う前に歯面にエアーをかけましょう（咬合紙が湿っていると着色しにくいため）","links":[{"label":"CR（院内の補足ページ／Notion）","url":"https://app.notion.com/p/19c9c73023f581519a20e0d565b2476b"}]}]},
    {"id":"n-df49e7f3d568","cat":"assist","title":"RCT（根管治療）","summary":"根管治療（RCT）の準備物です。","minutes":10,"updated":"2026-07-11","author":"アシスト業務","tags":["RCT","根管治療","根治","ファイル","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581669ef6df49e7f3d568","steps":[{"h":"準備物","t":"①治療のワゴン：主要ファイル・根治用ミラー・シリンジ・04/06のファイル","img":["https://toothtooth-manual.jp/data/files/00/00/01/01/dXAfy0SL_t.jpeg"]},{"t":"②スケーラー","tip":"スケーラーはスケーリングに合わせて5にしておく"},{"t":"③トライオート","img":["https://toothtooth-manual.jp/data/files/00/00/01/01/eT2Vd8m9_t.jpeg"]},{"t":"④キャビトン/充填器"},{"t":"⑤場合によってはEMR","tip":"使う場合はワゴンの1番上にあるフックを取り付ける","img":["https://toothtooth-manual.jp/data/files/00/00/01/01/0dZiOt4F_t.jpeg"]},{"t":"⑥カルシペックス/ビタペックス/ペリオドンを使うこともある"},{"t":"シリンジにはNCを0.3のメモリのあたりまで入れておく"}]},
    {"id":"n-d1acd8ea3291","cat":"assist","title":"RCF（根管充填）","summary":"根管充填（RCF）の準備物です。","minutes":10,"updated":"2026-06-10","author":"アシスト業務","tags":["RCF","根管充填","根充","シーラー","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f58128a3cbd1acd8ea3291","steps":[{"h":"準備物","t":"スケーラー","tip":"スケーラーはスケーリングに合わせて5にしておく"},{"t":"練板/スパチュラ"},{"t":"RCT用ミラー"},{"t":"充填器/キャビトン"},{"t":"根管充填用ピンセット・根管充填用スプレッダー・根管充填用プラガー","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/ktmCUHOT_t.jpeg"]},{"t":"シリンジ(NC)"},{"t":"ヒートカッター","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/pPFP1oZj_t.jpeg"]},{"t":"ペーパーポイント","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/TyCesmmW_t.jpeg"]},{"t":"シーラー","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/Jo2hhBGi_t.jpeg"]}]},
    {"id":"n-d6a5474ec95c","cat":"assist","title":"レコア","summary":"レジンで土台（コア）を立てるレコアの準備物です。","minutes":5,"updated":"2026-01-23","author":"アシスト業務","tags":["レコア","コア","ファイバーポスト","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581ee9d09d6a5474ec95c","steps":[{"h":"準備物","t":"スケーラー"},{"t":"タービン/バーセット"},{"t":"コントラ"},{"t":"照射器"},{"t":"レコアセット（冷蔵庫の中）：冷蔵庫の中からレコアのセットを出しておく。このセットはアシストが受け渡しするためチェストの上に置いておく","tip":"歯式によってレジンの先を細めか太めで使い分けて取り付けるため、先は2種類入っている","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/q4PDxoGx_t.jpeg"]},{"t":"ファイバーポスト"},{"t":"印象もするなら指示書"}]},
    {"id":"n-d4be48b68ac0","cat":"assist","title":"TEC（仮歯）","summary":"仮歯（TEC）の準備物と、型取りして作る場合・ティッシュで作る場合の流れです。","minutes":20,"updated":"2025-11-26","author":"アシスト業務","tags":["TEC","TEK","仮歯","即重","テンポラリーセメント","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f58188ab11d4be48b68ac0","steps":[{"h":"準備物","t":"①即重のセット ②ストレート ③鉛筆 ④テンポラリーセメント ⑤青いカップ ⑥ワセリン ⑦咬合紙","tip":"ティッシュで作る場合は大きい容器の即重を、印象をして作る場合は筆があるセットを準備しておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/tLmA5LMC_t.jpeg"]},{"t":"仮歯（TEC）を除去する場合は、スケーラーとリムーバーを準備しておく","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/WGmvlEtJ_t.jpeg"]},{"t":"テンポラリーセメントは、消毒室の銀ラックの棚から出し入れする","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/CXesaCEI_t.jpeg"]},{"h":"型取りをして仮歯を作る場合","t":"①アルジネートで型取りをする"},{"t":"②印象が乾かないように、濡らしたペーパーを被せて青いカップに入れておく","tip":"型取りをしている間に青いカップを用意して、ペーパーを濡らしておく"},{"t":"③印象に即重を流して歯の形を作っていく","tip":"即重がひっつくのでワセリンを用意する"},{"t":"④仮歯を固める","tip":"青いカップにポットのお湯を入れて置く"},{"t":"⑤形を整えて仮歯を作っていく","tip":"必要に応じて口腔外バキュームを出し入れする"},{"t":"⑥仮歯をつける","tip":"セメントの量をDrに確認して練る"},{"t":"⑦水で固める→バキュームする"},{"h":"ティッシュで形を作る場合","t":"①ティッシュの上に即重と液を合わせる→ティッシュをDrに渡す"},{"t":"②歯にはめて形を整えていく","tip":"即重がひっつくのでワセリンを用意する"},{"t":"③形を整えて仮歯を作る","tip":"必要に応じて口腔外バキュームを出し入れする"},{"t":"④仮歯をつける","tip":"セメントの量をDrに確認して練る"},{"t":"⑤水で固める→バキュームする"}]},
    {"id":"n-fda70d852b21","cat":"assist","title":"パラIn/FMC","summary":"パラインレー・クラウン（FMC）のセットの準備物です。","minutes":5,"updated":"2025-09-09","author":"アシスト業務","tags":["パラ","インレー","FMC","クラウン","セット","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581278ec9fda70d852b21","steps":[{"h":"準備物","t":"①患者の技工物 ②ストレート ③フロス ④咬合紙 ⑤照射器 ⑥リライエックス セメント ⑦仮封除去スケーラー(インレーの場合)","img":["https://toothtooth-manual.jp/data/files/00/00/00/91/IOwb8tM5_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/00/91/FrtvgWyI_t.jpeg"]},{"t":"ストレートを使う時は、水が出ないように設定しておく","img":["https://toothtooth-manual.jp/data/files/00/00/00/91/RAlGhdkZ_t.jpeg"]}]},
    {"id":"n-f25717e02502","cat":"assist","title":"CADセット","summary":"CADインレー／クラウンのセットの準備物とアシストです。","minutes":15,"updated":"2026-01-23","author":"アシスト業務","tags":["CAD","CAD/CAM","インレー","クラウン","セット","サンドブラスト","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581868898f25717e02502","steps":[{"h":"準備物","t":"①患者の技工物 ②ストレート ③咬合紙 ④フロス ⑥照射器 ⑦練板 ⑧仮封除去スケーラー(インレーの場合のみ)","tip":"場合によってはタービン/バーセットとコントラ","img":["https://toothtooth-manual.jp/data/files/00/00/00/91/yNv2Cbd2_t.jpeg","https://toothtooth-manual.jp/data/files/00/00/00/91/kMISEEoW_t.jpeg"]},{"t":"⑤サンドブラストセット：ボンディング・カタナクリーナー（紫）・SAルーティング・サンドブラスト","tip":"サンドブラストのセットは銀ラックの棚から出し入れする。準備する際に線を繋げておく","img":["https://toothtooth-manual.jp/data/files/00/00/00/91/9EGW0SZz_t.jpeg"]},{"t":"ストレートをセットする際に、水が出ないように設定しておく","img":["https://toothtooth-manual.jp/data/files/00/00/00/91/RAlGhdkZ_t.jpeg"]},{"h":"アシストについて","t":"メインテーブルのガーゼを一枚、練板の上に置いておく"},{"t":"Drが調節する際は、口腔外バキュームを必要に応じて出し入れする"},{"h":"本着する際（Dr／アシスト）","t":"Dr：エッチング → アシスト：エッチングを渡す"},{"t":"Dr：水で洗う → アシスト：バキューム"},{"t":"Dr：エアーで乾かす → アシスト：セット物にボンディングする→エアー"},{"t":"Dr：ボンディング → アシスト：セット物にセメントをつける"},{"t":"Dr：セットする → アシスト：照射器を渡す→ガーゼを渡す"}]},

    {"id":"n-c4b04838e628","cat":"assist","title":"リベース","summary":"義歯（デンチャー）に材料を付け足すリベースの準備物と流れです。","minutes":15,"updated":"2025-09-09","author":"アシスト業務","tags":["リベース","Den","デンチャー","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f5810a900ec4b04838e628","steps":[{"h":"準備物","t":"銀ラックのDenセット／青いカップ／患者さんのDen","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/FEy7BNtw_t.jpeg"]},{"h":"流れ","t":"Denに材料を付け足す→必要な量に応じて、リベースの液と粉を青の小さいカップに入れてスパチュラで混ぜてDrに渡す"},{"t":"Denに材料をつけてお湯で固める→その間に青いカップにお湯を入れておく（硬化剤を入れる）","tip":"水と混ぜて熱すぎないようにする"},{"t":"調整する→必要に応じて口腔外バキューム"}]},
    {"id":"n-ca5af9f9356e","cat":"assist","title":"マウスピースSET","summary":"マウスピースのセットの準備物と、ケース購入時の注意です。","minutes":5,"updated":"2025-09-09","author":"アシスト業務","tags":["マウスピース","ナイトガード","セット","ケース","保険","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f5812db347ca5af9f9356e","steps":[{"h":"準備物","t":"ストレート／患者本人のマウスピース／マウスピースケース／咬合紙2本","img":["https://toothtooth-manual.jp/data/files/00/00/01/76/LsxGKWAD_t.jpeg"]},{"t":"ストレートは水が出ないように設定しておく"},{"t":"マウスピースケースは購入しない場合があるので、袋からは出さずに置いておく。マウスピースケースは技工室の棚から出し入れする","warn":"マウスピースケースの購入を希望した場合は、会計時に受付の人にわかるように、カルテにケース購入することを書き忘れないようにする！"}]},
    {"id":"n-ea557235fe91","cat":"assist","title":"シリコン印象の取り方","summary":"シリコン印象（パテ＋インジェクション）の取り方です。","minutes":10,"updated":"2025-11-11","author":"アシスト業務","tags":["シリコン印象","印象","パテ","自費","アシスト業務"],"source":"https://app.notion.com/p/19c9c73023f581cbab91ea557235fe91","steps":[{"t":"パテを1：1でしっかり練り、トレー(プラスチック)にのせる"},{"t":"歯牙に圧接し、概形印象をとる。圧接した概形印象を適度にならす"},{"t":"ガンに印象材を装着し、ミキシングチップ(細)をつける","tip":"印象材はデンチャーならピンク、補綴なら黄色"},{"t":"シリンジの内筒を少し引き、先を外す。先から印象材を注入し、先をつける","tip":"量はドクターに確認"},{"t":"先ほどとった概形印象の内面にも、同じシリコン印象材を一層流し込む"},{"t":"ドクターに手渡し、口腔内に圧接する"}]},
