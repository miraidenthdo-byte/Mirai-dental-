<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みらい歯科 院内マニュアル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Yusei+Magic&display=swap">
<style>
/* Layout: 上部に検索バー、中央に1カラムのコンテンツ（最大960px）、下部にタブバー。カードは役割があるものだけに使う */
:root {
  --bg: #FFF6F8;
  --surface: #FFFFFF;
  --surface-2: #FFEEF3;
  --ink: #4A3036;
  --ink-soft: #85666E;
  --line: #F5D7E0;
  --accent: #F7A8C0;
  --accent-soft: #FFDCE6;
  --accent-ink: #B23F66;
  --warn-bg: #FFE5DF;
  --warn-ink: #A8402E;
  --ok: #5BAE8C;
  --ok-ink: #2E7A5B;
  --shadow: 0 6px 20px rgba(214, 120, 150, .14);

  --c-reception: #FFD9E3; --c-reception-ink: #B5476E;
  --c-assist: #E8E0FB;    --c-assist-ink: #6A55B0;
  --c-steril: #D6F1E7;    --c-steril-ink: #2F8466;
  --c-emergency: #FFDCD5; --c-emergency-ink: #B4442F;
  --c-open: #FFF1CC;      --c-open-ink: #9A7414;
  --c-patient: #FFE5D3;   --c-patient-ink: #B0602A;
  --c-rules: #DAEDFB;     --c-rules-ink: #2F6E9E;
  --c-material: #F4E2F6;  --c-material-ink: #924A9C;

  --font-display: "Yusei Magic", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;

  --radius: 18px;
  --radius-sm: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #251A1E; --surface: #32242A; --surface-2: #3D2B32; --ink: #FBEAEF; --ink-soft: #CFAFB8;
    --line: #4E3940; --accent: #F2A0BA; --accent-soft: #5A3442; --accent-ink: #FFB6CC;
    --warn-bg: #4A2A25; --warn-ink: #FFB4A3; --ok: #7CCBA9; --ok-ink: #93DDBD; --shadow: 0 6px 20px rgba(0,0,0,.3);
    --c-reception: #4E2C38; --c-reception-ink: #FFB3C9;
    --c-assist: #3A3352;    --c-assist-ink: #C9BBFF;
    --c-steril: #24433A;    --c-steril-ink: #93E0C2;
    --c-emergency: #4E2C26; --c-emergency-ink: #FFB2A2;
    --c-open: #463A1E;      --c-open-ink: #F3D27A;
    --c-patient: #4A3326;   --c-patient-ink: #FFC39C;
    --c-rules: #233B4E;     --c-rules-ink: #9FCFF5;
    --c-material: #452D4A;  --c-material-ink: #EAB3F2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #251A1E; --surface: #32242A; --surface-2: #3D2B32; --ink: #FBEAEF; --ink-soft: #CFAFB8;
  --line: #4E3940; --accent: #F2A0BA; --accent-soft: #5A3442; --accent-ink: #FFB6CC;
  --warn-bg: #4A2A25; --warn-ink: #FFB4A3; --ok: #7CCBA9; --ok-ink: #93DDBD; --shadow: 0 6px 20px rgba(0,0,0,.3);
  --c-reception: #4E2C38; --c-reception-ink: #FFB3C9;
  --c-assist: #3A3352;    --c-assist-ink: #C9BBFF;
  --c-steril: #24433A;    --c-steril-ink: #93E0C2;
  --c-emergency: #4E2C26; --c-emergency-ink: #FFB2A2;
  --c-open: #463A1E;      --c-open-ink: #F3D27A;
  --c-patient: #4A3326;   --c-patient-ink: #FFC39C;
  --c-rules: #233B4E;     --c-rules-ink: #9FCFF5;
  --c-material: #452D4A;  --c-material-ink: #EAB3F2;
  color-scheme: dark;
}
html.large-text { font-size: 112.5%; }
html, body { margin: 0; }
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.4; margin: 0; }
svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-inner { max-width: 960px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; }
.brand-mark svg { width: 22px; height: 22px; }
.brand-text { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.1; }
.brand-text small { display: block; font-family: var(--font-body); font-size: .68rem; color: var(--ink-soft); letter-spacing: .08em; }
.search { flex: 1; min-width: 0; position: relative; }
.search input {
  width: 100%; height: 44px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); padding: 0 16px 0 42px; font-size: .95rem;
}
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: var(--ink-soft);
  display: grid; place-items: center; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--accent-ink); }
@media (max-width: 520px) { .brand-text { display: none; } }

/* ---------- Main ---------- */
main { max-width: 960px; margin: 0 auto; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.section-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.section-head a, .link-btn { color: var(--accent-ink); font-size: .88rem; text-decoration: none; background: none; border: none; padding: 0; }
.muted { color: var(--ink-soft); }

/* Greeting */
.hello {
  position: relative; overflow: hidden;
  background: var(--surface-2);
  border-radius: 24px; padding: 22px 22px 20px;
}
.hello::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle at 40% 40%, var(--accent-soft), transparent 70%);
  pointer-events: none;
}
.hello-date { font-size: .85rem; color: var(--ink-soft); letter-spacing: .04em; }
.hello h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.5rem, 4.5vw, 2rem); margin: 4px 0 6px; color: var(--ink); }
.hello p { margin: 0; color: var(--ink-soft); font-size: .92rem; position: relative; z-index: 1; }
.hello-stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--surface); font-size: .82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.pill b { color: var(--accent-ink); font-weight: 700; }

/* Emergency banner */
.sos {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: var(--radius);
  background: var(--c-emergency); color: var(--c-emergency-ink); text-decoration: none; border: 1.5px solid color-mix(in srgb, var(--c-emergency-ink) 25%, transparent);
}
.sos-icon { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; flex: none; }
.sos-icon svg { width: 24px; height: 24px; }
.sos strong { display: block; font-size: 1rem; }
.sos span { font-size: .84rem; opacity: .9; }
.sos .chev { margin-left: auto; }

/* Category grid */
.cat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .cat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cat {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; border-radius: var(--radius);
  background: var(--cat-bg); color: var(--ink); text-decoration: none; border: none; text-align: left;
  transition: transform .15s ease, box-shadow .15s ease;
}
.cat:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.cat-icon { width: 42px; height: 42px; border-radius: 14px; background: var(--surface); color: var(--cat-ink); display: grid; place-items: center; }
.cat-icon svg { width: 24px; height: 24px; }
.cat-name { font-weight: 700; font-size: .98rem; line-height: 1.3; }
.cat-count { font-size: .78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* Manual list */
.list { display: flex; flex-direction: column; gap: 10px; }
.item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line); text-decoration: none; color: var(--ink);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.item:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.item-icon { width: 44px; height: 44px; border-radius: 14px; background: var(--cat-bg); color: var(--cat-ink); display: grid; place-items: center; flex: none; }
.item-body { flex: 1; min-width: 0; }
.item-title { font-weight: 700; font-size: 1rem; line-height: 1.45; }
.item-sub { font-size: .84rem; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .76rem; color: var(--ink-soft); margin-top: 2px; font-variant-numeric: tabular-nums; }
.item-meta span { display: inline-flex; align-items: center; gap: 4px; }
.item-meta svg { width: 14px; height: 14px; }
.item .chev { color: var(--ink-soft); }
.progress-mini { width: 54px; height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; }
.progress-mini i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
mark { background: var(--accent-soft); color: var(--ink); border-radius: 4px; padding: 0 2px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: .86rem;
  color: var(--ink-soft); white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }

.empty {
  text-align: center; padding: 28px 20px; border-radius: var(--radius); border: 2px dashed var(--line); color: var(--ink-soft); font-size: .92rem;
}
.empty svg { width: 34px; height: 34px; color: var(--accent); margin-bottom: 6px; }

/* ---------- Detail ---------- */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-soft); background: none; border: none; padding: 6px 8px 6px 0; font-size: .92rem; text-decoration: none; }
.back:hover { color: var(--accent-ink); }
.detail-head { display: flex; flex-direction: column; gap: 10px; }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; background: var(--cat-bg); color: var(--cat-ink); font-size: .82rem; font-weight: 700; align-self: flex-start; }
.tag svg { width: 16px; height: 16px; }
.detail-head h1 { font-size: clamp(1.4rem, 4vw, 1.85rem); font-weight: 700; }
.detail-head .summary { margin: 0; color: var(--ink-soft); max-width: 65ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.meta-row span { display: inline-flex; align-items: center; gap: 5px; }
.meta-row svg { width: 16px; height: 16px; }
.keywords { display: flex; flex-wrap: wrap; gap: 6px; }
.keywords span { font-size: .78rem; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-soft); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-size: .92rem; font-weight: 500; text-decoration: none;
}
.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #3E2229; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.04); color: #3E2229; }
.btn.danger { color: var(--warn-ink); border-color: color-mix(in srgb, var(--warn-ink) 35%, transparent); }
.btn.faved { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-ink); }
.btn.faved svg { fill: currentColor; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: .84rem; }

.progress {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 65px); z-index: 10;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px;
  display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow);
}
.progress-bar { flex: 1; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--ok)); border-radius: inherit; transition: width .3s ease; }
.progress-label { font-size: .86rem; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress.done .progress-label { color: var(--ok); }

.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; counter-reset: step; }
.step {
  display: grid; grid-template-columns: auto 1fr; gap: 14px; padding: 16px; border-radius: var(--radius);
  background: var(--surface); border: 1.5px solid var(--line); transition: background .2s ease, border-color .2s ease;
}
.step-check {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent); background: var(--surface); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 0;
}
.step-check svg { display: none; width: 22px; height: 22px; stroke-width: 2.6; }
.step.done { background: color-mix(in srgb, var(--ok) 9%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.step.done .step-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.done .step-check span { display: none; }
.step.done .step-check svg { display: block; }
.step.done .step-text { color: var(--ink-soft); }
.step-body { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-top: 7px; }
.step-text { margin: 0; font-size: 1rem; white-space: pre-wrap; }
.note { display: flex; gap: 8px; padding: 10px 12px; border-radius: var(--radius-sm); font-size: .88rem; line-height: 1.65; }
.note svg { margin-top: 2px; }
.note b { flex: none; }
.note.tip { background: var(--accent-soft); color: var(--ink); }
.note.tip svg, .note.tip b { color: var(--accent-ink); }
.note.warn { background: var(--warn-bg); color: var(--ink); }
.note.warn svg, .note.warn b { color: var(--warn-ink); }
.complete {
  text-align: center; padding: 22px; border-radius: var(--radius); background: color-mix(in srgb, var(--ok) 12%, var(--surface));
  color: var(--ink);
}
.complete strong { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; display: block; color: var(--ok); }

/* ---------- Inputs ---------- */
input[type="text"], input[type="number"], input[type="password"], select, textarea {
  width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; min-height: 44px;
}
textarea { resize: vertical; min-height: 72px; line-height: 1.6; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.icon-btn:disabled { opacity: .3; cursor: default; background: transparent; }

/* ---------- Lock / Inline editor ---------- */
.btn.lock { border-style: dashed; color: var(--ink-soft); }
.btn.lock:hover { border-style: solid; }
.lock-hint { font-size: .78rem; color: var(--ink-soft); display: inline-flex; align-items: center; gap: 4px; }
.lock-hint svg { width: 14px; height: 14px; }
.editbar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 65px); z-index: 10;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  padding: 10px 12px 10px 16px; border-radius: var(--radius); background: var(--accent-soft); border: 1.5px solid var(--accent); box-shadow: var(--shadow);
}
.editbar-state { display: flex; align-items: center; gap: 10px; color: var(--accent-ink); }
.editbar-state svg { width: 24px; height: 24px; }
.editbar-state b { display: block; font-size: .95rem; line-height: 1.25; }
.editbar-state small { display: block; font-size: .75rem; color: var(--ink-soft); line-height: 1.3; }
.editbar-actions { display: flex; gap: 8px; }
textarea.ed {
  display: block; width: 100%; min-height: 0; resize: none; overflow: hidden; line-height: 1.65; padding: 8px 10px;
  border: 1.5px dashed color-mix(in srgb, var(--accent) 75%, transparent); background: var(--surface);
}
textarea.ed:focus { border-style: solid; }
textarea.ed-title { font-size: clamp(1.3rem, 4vw, 1.7rem); font-weight: 700; line-height: 1.4; }
textarea.ed-sum { color: var(--ink-soft); }
.ed-row { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.ed-inline { display: flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--ink-soft); }
.ed-inline.grow { flex: 1 1 220px; min-width: 0; }
.ed-inline > span { flex: none; }
.ed-inline input, .ed-inline select { min-height: 38px; padding: 6px 10px; width: auto; }
.ed-inline.grow input { flex: 1; min-width: 0; }
.ed-inline input[type="number"] { width: 5em; }
.step.editing { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 65%, transparent); }
.step-num { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #3E2229; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.step.editing .step-body { padding-top: 0; }
.note.ed-note { align-items: flex-start; }
.ed-note-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ed-note select { min-height: 34px; padding: 4px 8px; width: auto; align-self: flex-start; font-size: .82rem; font-weight: 700; }
.ed-note textarea.ed { font-size: .88rem; }
.ed-add-note { display: flex; flex-wrap: wrap; gap: 6px; }
.step-tools { display: flex; justify-content: flex-end; gap: 2px; border-top: 1px dashed var(--line); padding-top: 6px; }
.step-tools .icon-btn { width: 40px; height: 40px; }
.editor-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
.pin-input { font-size: 1.6rem; letter-spacing: .6em; text-align: center; font-variant-numeric: tabular-nums; }
.err { color: var(--warn-ink); font-size: .85rem; min-height: 1.4em; margin: 0; }

/* ---------- Tab bar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 8px; }
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 10px; text-decoration: none; color: var(--ink-soft); font-size: .72rem;
  position: relative;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent-ink); font-weight: 700; }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 4px 4px; background: var(--accent); }
.tab.add .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #3E2229; display: grid; place-items: center; margin-top: -2px; }

.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(10px); z-index: 60;

  /* ================= データの置き場所 ================= */

  const REMOTE = typeof google !== 'undefined' && google.script && google.script.run;
  const clone = o => JSON.parse(JSON.stringify(o));
  const nowISO = () => new Date().toISOString();

  // 体験モード用のサンプル（スプレッドシート版では使いません）
  const SAMPLE_STAFF = [
    { id: 's1', name: '佐藤 さくら', role: '歯科衛生士', code: '111111' },
    { id: 's2', name: '鈴木 ゆい', role: '歯科助手', code: '222222' },

    { id: 's6', name: '渡辺 まい', role: '歯科助手', code: '', active: false, retiredAt: '2026-08-31T09:00:00.000Z' }
  ];
  function sampleProgress(manuals, staff) {
    const level = [0.92, 0.72, 0.55, 0.38, 0.16, 0.6];
    const progress = {};
    staff.forEach((s, si) => {
      progress[s.id] = {};
      manuals.forEach((m, mi) => {
        const r = (((si + 1) * 9301 + (mi + 1) * 49297) % 233280) / 233280;
        const day = String(5 + (si * 3 + mi * 5) % 25).padStart(2, '0');
        const month = s.active === false ? '08' : '09';
        const at = `2026-${month}-${day}T10:${String(10 + mi).padStart(2, '0')}:00.000Z`;
        if (r < level[si]) progress[s.id][m.id] = { done: [], completedAt: at, updatedAt: at, count: 1 };
        else if (r < level[si] + 0.22) progress[s.id][m.id] = { done: m.steps.map((_, i) => i).slice(0, Math.max(1, Math.floor(m.steps.length / 2))), completedAt: '', updatedAt: at, count: 0 };
      });
    });
    return progress;
  }

  // 体験モードでは、サーバー（Code.gs）と同じ動きをこの端末の中で再現する
  const DEMO_KEY = 'mirai-manual-demo-v3';
  const LocalServer = (() => {
    let db = null;
    let fails = [];
    const STAFF_IDLE = 120 * 864e5, ADMIN_TTL = 12 * 3600e3;
    const persist = () => { try { localStorage.setItem(DEMO_KEY, JSON.stringify(db)); } catch (e) { /* 保存できない環境 */ } };
    const rnd = () => Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
    const iso = () => new Date().toISOString();
    const newCode = () => { let c; do { c = String(Math.floor(100000 + Math.random() * 900000)); } while (db.staff.some(s => s.code === c)); return c; };
    const pub = s => ({ id: s.id, name: s.name, role: s.role || '' });
    const dropSessions = test => { db.sessions = db.sessions.filter(x => !test(x)); };
    const openSession = (staffId, device) => { const token = rnd(); db.sessions.push({ token, staffId, device: String(device || ''), createdAt: iso(), lastSeen: iso() }); persist(); return { token }; };
    const throttle = () => { const now = Date.now(); fails = fails.filter(t => now - t < 600e3); if (fails.length >= 20) throw new Error('LIMIT'); };
    const check = (kind, pin) => { if (db.pins[kind] && db.pins[kind] !== pin) throw new Error('PIN'); };
    function resolve(token) {
      const s = db.sessions.find(x => x.token === token);
      if (!s) throw new Error('AUTH');
      const now = Date.now();
      if (s.staffId === '__admin') {
        if (now - Date.parse(s.createdAt) > ADMIN_TTL) { dropSessions(x => x === s); persist(); throw new Error('AUTH'); }
        return { admin: true };
      }
      const st = db.staff.find(x => x.id === s.staffId && x.active !== false);
      if (!st || now - Date.parse(s.lastSeen) > STAFF_IDLE) { dropSessions(x => x === s); persist(); throw new Error('AUTH'); }
      s.lastSeen = iso();
      return { admin: false, staff: st };
    }
    function requireAdmin(token) {
      let r;
      try { r = resolve(token); } catch (e) { throw new Error('ADMINAUTH'); }
      if (!r.admin) throw new Error('ADMINAUTH');
    }
    const staffById = id => { const s = db.staff.find(x => x.id === id); if (!s) throw new Error('STAFF'); return s; };
    function remap(mid, map) {
      if (!map) return;
      Object.values(db.progress).forEach(p => {
        const r = p[mid];
        if (!r || !(r.done || []).length) return;
        const old = new Set(r.done);
        r.done = map.map((o, i) => (o >= 0 && old.has(o)) ? i : -1).filter(i => i >= 0);
      });
    }
    const api = {
      status() { return { hasAdminPin: !!db.pins.admin, initialized: true, demo: true }; },
      initialize() { return true; },
      login(code, device) {
        throttle();
        const st = db.staff.find(s => s.active !== false && s.code && s.code === String(code));
        if (!st) { fails.push(Date.now()); throw new Error('LOGIN'); }
        return openSession(st.id, device);
      },
      adminLogin(pin, device) {
        throttle();
        if (!db.pins.admin) throw new Error('NOADMIN');
        if (db.pins.admin !== String(pin)) { fails.push(Date.now()); throw new Error('PIN'); }
        return openSession('__admin', device);
      },
      adminSetup(pin, device) {
        if (db.pins.admin) throw new Error('PIN');
        if (!/^\d{4}$/.test(String(pin))) throw new Error('FORMAT');
        db.pins.admin = String(pin);
        return openSession('__admin', device);
      },
      logout(token) { dropSessions(x => x.token === token); persist(); return true; },
      ping(token) { resolve(token); persist(); return true; },
      getAll(token) {
        const r = resolve(token);
        persist();
        return {
          role: r.admin ? 'admin' : 'staff', me: r.admin ? null : pub(r.staff), manuals: db.manuals,
          progress: r.admin ? db.progress : { [r.staff.id]: db.progress[r.staff.id] || {} },
          hasEditPin: !!db.pins.edit, hasAdminPin: !!db.pins.admin, initialized: true, demo: true
        };
      },
      verifyPin(token, kind, pin) { resolve(token); return !db.pins[kind] || db.pins[kind] === pin; },
      saveManual(token, m, map, editPin) {
        if (!resolve(token).admin) check('edit', editPin);
        const i = db.manuals.findIndex(x => x.id === m.id);
        if (i >= 0) db.manuals[i] = m; else db.manuals.unshift(m);
        remap(m.id, map);
        persist();
        return true;
      },
      deleteManual(token, id, editPin) {
        if (!resolve(token).admin) check('edit', editPin);
        db.manuals = db.manuals.filter(x => x.id !== id);
        Object.values(db.progress).forEach(p => { delete p[id]; });
        persist();
        return true;
      },
      saveProgress(token, mid, rec) {
        const r = resolve(token);
        if (r.admin) throw new Error('STAFF');
        (db.progress[r.staff.id] = db.progress[r.staff.id] || {})[mid] = rec;
        persist();
        return true;
      },
      adminData(token) {
        requireAdmin(token);
        return {
          staff: db.staff.map(s => ({
            ...pub(s), active: s.active !== false, retiredAt: s.retiredAt || '',
            sessions: db.sessions.filter(x => x.staffId === s.id).map(x => ({ device: x.device, lastSeen: x.lastSeen }))
          })),
          progress: db.progress
        };
      },
      addStaff(token, name, role) {
        requireAdmin(token);
        if (!String(name || '').trim()) throw new Error('FORMAT');
        const s = { id: 's' + rnd().slice(0, 8), name: String(name).trim(), role: String(role || '').trim(), active: true, retiredAt: '', code: newCode() };
        db.staff.push(s);
        persist();
        return { id: s.id, code: s.code };
      },
      updateStaff(token, id, name, role) {
        requireAdmin(token);
        if (!String(name || '').trim()) throw new Error('FORMAT');
        const s = staffById(id);
        s.name = String(name).trim();
        s.role = String(role || '').trim();
        persist();
        return true;
      },
      retireStaff(token, id) {
        requireAdmin(token);
        const s = staffById(id);
        const closed = db.sessions.filter(x => x.staffId === id).length;
        s.active = false; s.retiredAt = iso(); s.code = '';
        dropSessions(x => x.staffId === id);
        persist();
        return { closed };
      },
      reinstateStaff(token, id) {
        requireAdmin(token);
        const s = staffById(id);
        s.active = true; s.retiredAt = ''; s.code = newCode();
        persist();
        return { code: s.code };
      },
      reissueCode(token, id) {
        requireAdmin(token);
        const s = staffById(id);
        if (s.active === false) throw new Error('STAFF');
        s.code = newCode();
        dropSessions(x => x.staffId === id);
        persist();
        return { code: s.code };
      },
      logoutStaff(token, id) { requireAdmin(token); dropSessions(x => x.staffId === id); persist(); return true; },
      deleteStaff(token, id) {
        requireAdmin(token);
        db.staff = db.staff.filter(x => x.id !== id);
        delete db.progress[id];
        dropSessions(x => x.staffId === id);
        persist();
        return true;
      },
      revokeAll(token) { requireAdmin(token); dropSessions(x => x.staffId !== '__admin'); persist(); return true; },
      setPin(token, kind, next) {
        requireAdmin(token);
        if (next && !/^\d{4}$/.test(String(next))) throw new Error('FORMAT');
        if (kind === 'admin') {
          if (!next) throw new Error('FORMAT');
          dropSessions(x => x.staffId === '__admin' && x.token !== token);
        }
        db.pins[kind] = next ? String(next) : '';
        persist();
        return true;
      },
      replaceManuals(token, list) {
        requireAdmin(token);
        db.manuals = list;
        const ids = new Set(list.map(m => m.id));
        Object.values(db.progress).forEach(p => Object.keys(p).forEach(mid => { if (!ids.has(mid)) delete p[mid]; }));
        persist();
        return true;
      }
    };
    return {
      init() {
        try { db = JSON.parse(localStorage.getItem(DEMO_KEY)); } catch (e) { db = null; }
        if (db && Array.isArray(db.manuals) && Array.isArray(db.sessions)) return;
        let old = null;
        try { old = JSON.parse(localStorage.getItem('mirai-manual-demo-v2')) || JSON.parse(localStorage.getItem('mirai-manual-v1')); } catch (e) { old = null; }
        const manuals = old && Array.isArray(old.manuals) ? old.manuals
          : clone(DEFAULT_MANUALS).map(m => m.id === 'm10' ? { ...m, reviewFrom: '2026-10-01T00:00:00.000Z' } : m);
        const staff = clone(SAMPLE_STAFF).map(s => ({ active: true, retiredAt: '', ...s }));
        db = { manuals, staff, progress: sampleProgress(manuals, SAMPLE_STAFF), sessions: [], pins: { edit: '', admin: '' } };
        persist();
      },
      call(name, args) { return api[name](...args); }
    };
  })();

  function callApi(name, ...args) {
    if (REMOTE) {
      return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
    }
    return new Promise((resolve, reject) => {
      try { const r = LocalServer.call(name, clone(args)); resolve(r === undefined ? null : clone(r)); } catch (e) { reject(e); }
    });
  }
  const errText = e => String((e && e.message) || e);
  function apiError(e) {
    const msg = errText(e);
    if (msg.includes('ADMINAUTH')) {
      session.adminToken = '';
      saveAdminToken();
      toast('管理者の確認が切れました。もう一度暗証番号を入力してください');
      if (location.hash.startsWith('#admin')) route(); else location.hash = '#admin';
    }
    else if (msg.includes('AUTH')) lockOut('ログインの有効期限が切れたか、管理者によって利用が停止されました。');
    else if (msg.includes('PIN')) toast('暗証番号が確認できませんでした。もう一度ロックを解除してください');
    else if (msg.includes('LIMIT')) toast('失敗が続いたため、しばらくログインできません。10分ほど待ってからお試しください');
    else if (msg.includes('STAFF')) toast('スタッフが見つかりません。画面を最新にしてください');
    else toast('保存できませんでした。通信状態を確かめて、もう一度お試しください');
  }
  const send = (name, ...args) => callApi(name, ...args).catch(apiError);

  /* ================= 端末ごとの設定・ログイン ================= */
  const ME_KEY = 'mirai-manual-me-v2';
  const ADMIN_KEY = 'mirai-manual-admin';
  const personal = (() => {
    let p = {};
    try { p = JSON.parse(localStorage.getItem(ME_KEY)) || {}; } catch (e) { p = {}; }
    if (!p.migrated) {
      try {
        const old = JSON.parse(localStorage.getItem('mirai-manual-v1'));
        if (old) { p.favs = old.favs; p.recent = old.recent; p.largeText = old.largeText; }
      } catch (e) { /* 旧データなし */ }
    }
    return p;
  })();
  const state = {
    ready: false, role: '', me: '', meInfo: null, adminLoaded: false,
    manuals: [], staff: [], progress: {}, hasEditPin: false, hasAdminPin: false,
    favs: Array.isArray(personal.favs) ? personal.favs : ['m10', 'm8'],
    recent: Array.isArray(personal.recent) ? personal.recent : ['m1', 'm2'],
    largeText: !!personal.largeText,
    token: typeof personal.token === 'string' ? personal.token : ''
  };
  const savePersonal = () => {
    try { localStorage.setItem(ME_KEY, JSON.stringify({ migrated: true, favs: state.favs, recent: state.recent, largeText: state.largeText, token: state.token })); } catch (e) { /* 保存できない環境 */ }
  };
  // 管理者の確認と編集ロックの解除は、このページ（タブ）を開いている間だけ覚えておく
  const session = { editPin: '', adminToken: '' };
  try { session.adminToken = sessionStorage.getItem(ADMIN_KEY) || ''; } catch (e) { /* 使えない環境 */ }
  const saveAdminToken = () => {
    try { if (session.adminToken) sessionStorage.setItem(ADMIN_KEY, session.adminToken); else sessionStorage.removeItem(ADMIN_KEY); } catch (e) { /* 使えない環境 */ }
  };
  const tok = () => state.token || session.adminToken;
  document.documentElement.classList.toggle('large-text', state.largeText);

  function deviceLabel() {
    const u = navigator.userAgent;
    const os = /iPad/.test(u) ? 'iPad' : /iPhone/.test(u) ? 'iPhone' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : 'その他の端末';
    const br = /Edg\//.test(u) ? 'Edge' : /Chrome\//.test(u) ? 'Chrome' : /Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : '';
    return br ? `${os}・${br}` : os;
  }

  async function loadShared() {
    const d = await callApi('getAll', tok());
    state.role = d.role;
    state.meInfo = d.me || null;
    state.me = d.me ? d.me.id : '';
    state.staff = d.me ? [d.me] : [];
    state.manuals = d.manuals || [];
    state.progress = d.progress || {};
    state.hasEditPin = !!d.hasEditPin;
    state.hasAdminPin = !!d.hasAdminPin;
    state.adminLoaded = false;
    if (REMOTE && !d.initialized) {
      await callApi('initialize', clone(DEFAULT_MANUALS));
      state.manuals = clone(DEFAULT_MANUALS);
    }
    state.ready = true;
  }
  async function loadAdmin() {
    const d = await callApi('adminData', session.adminToken);
    state.staff = d.staff || [];
    state.progress = d.progress || {};
    state.adminLoaded = true;
  }

  // 利用停止・期限切れ・ログアウト：画面の中身を消してログイン画面へ
  function lockOut(msg) {

    session.adminToken = '';

    renderLogin(msg);
  }
  function logoutNow() {

  const setSignedOut = on => document.body.classList.toggle('signed-out', on);

        <p class="muted" style="margin:0">管理者から受け取った、6桁のログインコードを入力してください。</p>

        <p class="err" id="loginErr"></p>

        ${REMOTE ? '' : `<div class="demo-note" style="text-align:left">${svg('info')}<span>体験モード用のコード：${SAMPLE_STAFF.filter(s => s.code).map(s => `${esc(s.name)} <b>${s.code}</b>`).join('、')}</span></div>`}
        <details class="admin-login">
          <summary>管理者の方はこちら</summary>

    const code = $('#loginCode'), err = $('#loginErr');

        code.focus();
      });

    $('#loginOk').addEventListener('click', go);
    code.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });

    $('.admin-login').addEventListener('toggle', function onToggle() {
      if (!this.open || this.dataset.loaded) return;
      this.dataset.loaded = '1';
      callApi('status').then(st => {
        const setup = !st.hasAdminPin;
        $('#adminLoginBox').innerHTML = `
          <span class="muted" style="font-size:.84rem">${setup ? 'はじめに、管理者用の4桁の暗証番号を決めてください。' : '管理者用の4桁の暗証番号を入力してください。'}</span>
          <label for="aPin" class="sr-only">暗証番号</label>
          <input id="aPin" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="${setup ? '新しい暗証番号' : ''}">
          ${setup ? '<label for="aPin2" class="sr-only">もう一度</label><input id="aPin2" class="pin-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="もう一度">' : ''}
          <p class="err" id="aErr"></p>
          <button class="btn" id="aOk">${svg('shield')}${setup ? '設定して管理者ページを開く' : '管理者ページを開く'}</button>`;
        const pin = $('#aPin'), aErr = $('#aErr');
        let aBusy = false;
        const goAdmin = () => {

          }, e => {

  }

  /* ================= ユーティリティ ================= */
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const getManual = id => state.manuals.find(m => m.id === id);
  const getStaff = id => state.staff.find(s => s.id === id) || (state.meInfo && state.meInfo.id === id ? state.meInfo : null);
  const activeStaff = () => state.staff.filter(s => s.active !== false);
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const fmtDate = s => { const p = String(s || '').split('-'); return p.length === 3 ? `${+p[0]}年${+p[1]}月${+p[2]}日` : ''; };
  const fmtShort = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth() + 1}月${d.getDate()}日`; };
  const view = $('#view');

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function highlight(text, q) {
    const safe = esc(text);
    if (!q) return safe;
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    return safe.replace(re, m => `<mark>${m}</mark>`);
  }

  /* ================= 進み具合の計算 ================= */
  const recOf = (sid, mid) => (sid && state.progress[sid] && state.progress[sid][mid]) || null;
  const doneOf = (sid, m) => { const r = recOf(sid, m.id); return r ? (r.done || []).filter(i => i < m.steps.length).length : 0; };
  // 完了 / 要再確認（完了後にマニュアルが改訂された） / 途中 / 未着手
  function statusOf(sid, m) {
    const r = recOf(sid, m.id);
    if (r && r.completedAt) return (m.reviewFrom && r.completedAt < m.reviewFrom) ? 'review' : 'done';
    return r && doneOf(sid, m) ? 'doing' : 'none';
  }
  const STATUS = { done: '完了', review: '要再確認', doing: '途中', none: '未着手' };
  const stPill = st => `<span class="st st-${st}">${STATUS[st]}</span>`;
  function staffSummary(sid) {
    const c = { done: 0, review: 0, doing: 0, none: 0 };
    let last = '';
    state.manuals.forEach(m => {
      c[statusOf(sid, m)]++;
      const r = recOf(sid, m.id);
      if (r && r.updatedAt > last) last = r.updatedAt;
    });
    const total = state.manuals.length;
    return { ...c, total, last, rate: total ? Math.round(c.done / total * 100) : 0 };
  }
  function manualSummary(m) {
    const c = { done: 0, review: 0, doing: 0, none: 0 };
    const list = activeStaff();
    list.forEach(s => c[statusOf(s.id, m)]++);
    return { ...c, total: list.length };
  }
  function stackHTML(c, total) {
    if (!total) return '<div class="stack"></div>';
    const seg = k => c[k] ? `<i class="s-${k}" style="width:${c[k] / total * 100}%"></i>` : '';
    return `<div class="stack" role="img" aria-label="完了${c.done}・要再確認${c.review}・途中${c.doing}・未着手${c.none}">${seg('done')}${seg('review')}${seg('doing')}</div>`;
  }
  const legendHTML = () => `<div class="legend"><span><i style="background:var(--ok)"></i>完了</span><span><i style="background:var(--warn-ink);opacity:.75"></i>要再確認</span><span><i style="background:var(--accent)"></i>途中</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>未着手</span></div>`;

  const AV_TONES = ['reception', 'assist', 'steril', 'open', 'patient', 'rules', 'material'];
  function avatarHTML(s, cls) {
    if (!s) return `<span class="avatar empty ${cls || ''}">?</span>`;
    let h = 0;
    for (const ch of s.id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const tone = AV_TONES[h % AV_TONES.length];
    return `<span class="avatar ${cls || ''}" style="--av-bg: var(--c-${tone}); --av-ink: var(--c-${tone}-ink)">${esc((s.name || '?').trim().charAt(0))}</span>`;
  }

  function itemHTML(m, q) {
    const c = catById(m.cat);
    const done = doneOf(state.me, m);
    const st = state.me ? statusOf(state.me, m) : 'none';
    const pct = m.steps.length ? Math.round(done / m.steps.length * 100) : 0;
    let sub = m.summary;
    if (q) {
      const hit = m.steps.find(s => (s.t + (s.tip || '') + (s.warn || '')).toLowerCase().includes(q.toLowerCase()));
      if (hit && !m.title.toLowerCase().includes(q.toLowerCase())) sub = hit.t;
    }
    return `<a class="item" href="#m-${esc(m.id)}" style="${catStyle(c.id)}">
      <span class="item-icon">${svg(c.id)}</span>
      <span class="item-body">
        <span class="item-title">${highlight(m.title, q)}</span>
        <span class="item-sub">${highlight(sub, q)}</span>
        <span class="item-meta">
          <span>${esc(c.name)}</span>
          <span>${svg('clock')}約${esc(m.minutes || 5)}分</span>
          <span>${m.steps.length}ステップ</span>
          ${st === 'done' || st === 'review' ? stPill(st) : ''}
          ${done ? `<span><span class="progress-mini"><i style="width:${pct}%"></i></span>${done}/${m.steps.length}</span>` : ''}
        </span>
      </span>
      ${svg('chev', 'chev')}
    </a>`;
  }

  function emptyHTML(icon, text) {
    return `<div class="empty">${svg(icon)}<div>${text}</div></div>`;
  }

  /* ================= ログイン中の人 ================= */
  function openAccount() {
    const me = state.meInfo;
    openSheet(`
      <div class="sheet-head"><h2>ログイン中</h2><button class="icon-btn" data-close aria-label="閉じる">${svg('x')}</button></div>
      <div style="display:flex;align-items:center;gap:12px">${me ? avatarHTML(me, 'lg') : `<span class="avatar lg">${svg('shield')}</span>`}
        <div><b>${me ? esc(me.name) : '管理者'}</b><br><span class="muted" style="font-size:.84rem">${me ? esc(me.role || '') : 'スタッフとしてはログインしていません'}</span></div></div>
      <p class="muted" style="margin:0;font-size:.84rem">共用の端末では、使い終わったらログアウトしてください。次の人は、自分のログインコードでログインします。</p>
      <div class="actions" style="justify-content:flex-end">
        <button class="btn" data-close>閉じる</button>
        <button class="btn primary" id="logoutBtn">${svg('lock')}ログアウト</button>
      </div>`);
    $('#logoutBtn').addEventListener('click', logoutNow);
  }
  $('#whoBtn').addEventListener('click', openAccount);
  function needMe() {
    if (state.me) return false;
    toast('管理者としてログイン中は、進み具合は記録されません');
    return true;
  }

  /* ================= 画面: ホーム ================= */
  function renderHome() {
    const now = new Date();
    const h = now.getHours();
    const greet = h < 11 ? 'おはようございます' : h < 17 ? 'こんにちは' : 'おつかれさまです';
    const wd = '日月火水木金土'[now.getDay()];
    const me = getStaff(state.me);
    const favs = state.favs.map(getManual).filter(Boolean);
    const recent = state.recent.map(getManual).filter(Boolean).slice(0, 4);
    const latest = [...state.manuals].sort((a, b) => String(b.updated).localeCompare(String(a.updated))).slice(0, 3);
    const sum = me ? staffSummary(me.id) : null;

    view.innerHTML = `
      <section class="hello">
        <div class="hello-date">${now.getMonth() + 1}月${now.getDate()}日（${wd}）</div>
        <h1>${me ? esc(me.name.split(/\s/)[0]) + 'さん、' : ''}${greet}</h1>
        <p>迷ったときは、ここで手順を確認しましょう。</p>
        <div class="hello-stats">
          <span class="pill">マニュアル <b>${state.manuals.length}</b> 件</span>
          <span class="pill">お気に入り <b>${favs.length}</b> 件</span>
        </div>
      </section>

      <a class="sos" href="#cat-emergency" style="${catStyle('emergency')}">
